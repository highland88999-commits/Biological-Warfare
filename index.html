<!DOCTYPE html>
<html>
<head>
    <title>Artemis Galactic Command</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
        #hud { position: absolute; top: 0; width: 100%; color: #0ff; padding: 20px; box-sizing: border-box; pointer-events: none; display: flex; justify-content: space-between; z-index: 100; }
        .hud-item { background: rgba(0, 40, 40, 0.5); padding: 10px; border: 1px solid #0ff; }
        #video-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; z-index: 500; }
        #skip-btn { position: absolute; bottom: 30px; right: 30px; padding: 15px 30px; background: #0ff; color: #000; border: none; cursor: pointer; font-weight: bold; }
        #fade-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 0.5s; z-index: 400; }
        #crosshair { position: absolute; width: 60px; height: 60px; border: 2px solid rgba(255,0,0,0.5); border-radius: 10px; display: none; pointer-events: none; }
        #rapid-fire-btn { position: absolute; bottom: 20px; right: 20px; width: 100px; height: 100px; border-radius: 50%; background: rgba(0,255,255,0.2); border: 2px solid #0ff; color: #0ff; display: none; cursor: pointer; z-index: 600; }
    </style>
</head>
<body>

<div id="fade-layer"></div>
<div id="hud">
    <div class="hud-item">LEVEL: <span id="lvl-val">1</span></div>
    <div class="hud-item">SHIELD: <span id="shield-val">100</span>%</div>
    <div class="hud-item"><span id="label-left">KILLS:</span> <span id="target-val">0</span>/100</div>
</div>

<div id="crosshair"></div>
<button id="rapid-fire-btn" onclick="activateRapidFire()">RAPID FIRE</button>

<div id="video-container">
    <div id="player"></div>
    <button id="skip-btn" onclick="skipClip()">SKIP TRANSMISSION</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
// --- GAME STATE ---
const state = {
    level: 1, health: 100, maxHealth: 100,
    phase: 'SWARM', kills: 0, killsToBoss: 100,
    isRapidFire: false, canRapidFire: true
};

let gameActive = false, isGameOver = false, lastDamageTime = Date.now();
let scene, camera, renderer, playerShip, deathStar;
let drones = [], lasers = [], enemyLasers = [], cores = [], particles = [];
let ytPlayer, formationGroup;

const cinematicMap = {
    10: 'D5iEO8n6I3w', 20: 'lsAEdblcqU4', 30: 'Xkm9h0S4wr8',
    40: 'd3nuk8UI76M', 50: 'n3DHDXAzoBA', 60: 'ijTAJ-JRiac',
    70: '9MDNJSv6Bpw', 80: 'wXrwWnu7agk', 90: '8kpHK4YIwY4', 100: 'ErjtFtRi9Xo'
};

// --- INITIALIZATION ---
function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Light & Stars
    scene.add(new THREE.AmbientLight(0x404040));
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(1, 1, 1);
    scene.add(sun);

    createStars();
    createPlayerShip();
    createDeathStar();
    
    window.addEventListener('mousedown', shoot);
    animate();
}

function createDeathStar() {
    const geo = new THREE.SphereGeometry(200000, 32, 32);
    const mat = new THREE.MeshPhongMaterial({ color: 0x444444 });
    deathStar = new THREE.Mesh(geo, mat);
    deathStar.position.z = -800000;
    scene.add(deathStar);
}

// --- CORE MECHANICS ---
function shoot() {
    if (!gameActive) return;
    spawnLaser(playerShip.position, 0x00ffff, true);
    if (state.isRapidFire) {
        setTimeout(() => spawnLaser(playerShip.position, 0x00ffff, true), 100);
        setTimeout(() => spawnLaser(playerShip.position, 0x00ffff, true), 200);
    }
}

function spawnLaser(pos, color, isPlayer) {
    const geo = new THREE.CylinderGeometry(50, 50, 2000, 8);
    const mat = new THREE.MeshBasicMaterial({ color: color });
    const laser = new THREE.Mesh(geo, mat);
    laser.position.copy(pos);
    laser.rotation.x = Math.PI / 2;
    scene.add(laser);
    isPlayer ? lasers.push(laser) : enemyLasers.push(laser);
}

function takeDamage(amt) {
    state.health -= amt;
    lastDamageTime = Date.now();
    document.getElementById('shield-val').innerText = Math.max(0, Math.floor(state.health));
    if (state.health <= 0 && !isGameOver) triggerDeath();
}

// --- FORMATION & LEVELS ---
function spawnSwarm() {
    if (formationGroup) scene.remove(formationGroup);
    formationGroup = new THREE.Group();
    
    const count = 5;
    for(let i=0; i<count; i++) {
        const drone = new THREE.Mesh(new THREE.BoxGeometry(2000, 1000, 2000), new THREE.MeshPhongMaterial({color: 0x666666}));
        drone.position.set(Math.random()*40000-20000, Math.random()*40000-20000, Math.random()*20000);
        formationGroup.add(drone);
        drones.push(drone);
    }
    formationGroup.position.z = -100000;
    scene.add(formationGroup);
}

// --- ANIMATION LOOP ---
function animate() {
    requestAnimationFrame(animate);
    if (!gameActive) return;

    // Shield Regen
    if (Date.now() - lastDamageTime > 5000 && state.health < 100) {
        state.health = 100;
        document.getElementById('shield-val').innerText = "100";
    }

    // Formation Movement
    if (formationGroup) {
        formationGroup.position.z += 1000;
        if (state.level >= 80) formationGroup.rotation.z += 0.02;
        if (formationGroup.position.z > 20000) spawnSwarm();
    }

    // Laser Physics
    lasers.forEach((l, i) => {
        l.position.z -= 10000;
        if (l.position.z < -1000000) { scene.remove(l); lasers.splice(i, 1); }
        
        // Target Collision (Boss Phase)
        cores.forEach((c, ci) => {
            if (l.position.distanceTo(c.position) < 10000) {
                createExplosion(c.position);
                scene.remove(c); cores.splice(ci, 1);
                if (cores.length === 0) levelUp();
            }
        });
    });

    renderer.render(scene, camera);
}

function createExplosion(pos) {
    // Simple particle burst
    for(let i=0; i<10; i++) {
        const p = new THREE.Mesh(new THREE.SphereGeometry(200), new THREE.MeshBasicMaterial({color: 0xffaa00}));
        p.position.copy(pos);
        scene.add(p);
        setTimeout(() => scene.remove(p), 500);
    }
}

// --- YOUTUBE & PROGRESSION ---
function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('player', {
        height: '100%', width: '100%',
        events: { 'onStateChange': (e) => { if(e.data === YT.PlayerState.ENDED) skipClip(); } }
    });
    init(); // Start game once API is ready
    gameActive = true; 
}

function levelUp() {
    state.level++;
    document.getElementById('lvl-val').innerText = state.level;
    if (state.level >= 50) document.getElementById('rapid-fire-btn').style.display = 'block';
    
    if (cinematicMap[state.level]) {
        gameActive = false;
        document.getElementById('video-container').style.display = 'block';
        ytPlayer.loadVideoById(cinematicMap[state.level]);
    } else {
        resetForNextLevel();
    }
}

function skipClip() {
    document.getElementById('video-container').style.display = 'none';
    ytPlayer.stopVideo();
    resetForNextLevel();
    gameActive = true;
}

function resetForNextLevel() {
    state.phase = 'SWARM';
    state.kills = 0;
    spawnSwarm();
}

// Initial Call
function createStars() { /* Starfield logic */ }
function createPlayerShip() { 
    playerShip = new THREE.Group(); 
    scene.add(playerShip); 
}
</script>
</body>
</html>
