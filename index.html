<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS v9.17 | GALAXY AT WAR</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; touch-action:none; }
        #video-container { position: absolute; inset:0; pointer-events: none; z-index: 100; opacity: 0; transition: opacity 2s; }
        iframe { width: 100vw; height: 100vh; pointer-events: none; transform: scale(1.4); }
        .ui-screen { position: absolute; inset: 0; z-index: 110; color: #0ff; text-align: center; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .glitch-text { font-size: 3em; letter-spacing: 15px; animation: pulse 2s infinite; text-shadow: 0 0 20px #0ff; }
        button { padding: 20px 40px; background: rgba(0,255,255,0.1); border: 2px solid #0ff; color: #0ff; font-family: inherit; font-size: 1.2em; cursor: pointer; margin-top: 30px; box-shadow: 0 0 10px #0ff; }
        
        #hud { position:absolute; inset:0; pointer-events:none; z-index:20; display:none; color:#0ff; }
        .top-bar { display:flex; justify-content:space-between; padding:15px; background:rgba(0,0,0,0.8); border-bottom:2px solid #0ff; }
        
        #radar { position: absolute; top: 60px; right: 20px; width: 100px; height: 100px; border: 2px solid #0ff; border-radius: 50%; background: rgba(0,20,20,0.6); pointer-events: auto; }
        #radar-sweep { position: absolute; inset:0; border-radius:50%; background: conic-gradient(from 0deg, rgba(0,255,255,0.2) 0%, transparent 40%); animation: sweep 2s linear infinite; }
        .blip { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #f00; box-shadow: 0 0 5px #f00; }

        #console { position: absolute; bottom: 30px; right: 30px; pointer-events: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .ctrl-btn { width: 90px; height: 90px; border: 2px solid #0ff; background: rgba(0,0,0,0.7); color: #0ff; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; }
        #hyper-btn { grid-column: span 2; height: 50px; border-color: #fff; color: #fff; }
        #seeker-btn { border-color: #f0f; color: #f0f; }

        #fade-layer { position: absolute; inset: 0; background: #fff; z-index: 200; pointer-events: none; opacity: 0; }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="fade-layer"></div>
    <div id="screen-1" class="ui-screen"><h1 class="glitch-text">TITAN FALL</h1><button onclick="engagePreload()">ENGAGE AUDIO & VIDEO</button></div>
    <div id="screen-2" class="ui-screen" style="display:none; background:transparent;">
        <div id="video-container"><div id="player"></div></div>
        <div style="z-index:120;"><h1 class="glitch-text" style="font-size: 2em;">ARTEMIS</h1><button onclick="launchGame()">INITIALIZE COCKPIT</button></div>
    </div>

    <div id="hud">
        <div class="top-bar">
            <div>LVL: <span id="lvl-val">1</span> | KILLS: <span id="kill-val">0</span>/<span id="target-val">100</span></div>
            <div>SHIELD: <span id="shield-val">10</span></div>
        </div>
        <div id="radar"><div id="radar-sweep"></div><div id="blip-container"></div></div>
        <div id="console">
            <div id="hyper-btn" class="ctrl-btn">HYPER DRIVE</div>
            <div id="seeker-btn" class="ctrl-btn">SEEKER</div>
            <div id="fire-btn" class="ctrl-btn">CANNON</div>
        </div>
    </div>

<script>
let ytPlayer, gameActive = false;
const introId = 's0HU_j4fRkg', playlistId = 'PLeMER9rHllyCIchd-ZGKTzAnAXYx4FSOz';

function engagePreload() {
    document.getElementById('screen-1').style.display = 'none';
    document.getElementById('screen-2').style.display = 'flex';
    document.getElementById('video-container').style.opacity = '1';
    if (!ytPlayer) {
        ytPlayer = new YT.Player('player', {
            height: '100%', width: '100%', videoId: introId,
            playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0 },
            events: { 'onReady': (e) => { e.target.unMute(); e.target.playVideo(); } }
        });
    }
}

function launchGame() {
    document.getElementById('fade-layer').style.opacity = 1;
    setTimeout(() => {
        document.getElementById('screen-2').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('fade-layer').style.opacity = 0;
        ytPlayer.loadPlaylist({ list: playlistId, listType: 'playlist' });
        bootSystem();
        gameActive = true;
    }, 1000);
}

// GAME CORE
let scene, camera, renderer, clock, playerShip, bossEntity, cores = [];
let chunks = [], lasers = [], drones = [], missiles = [];
let state = { 
    speed: 7500, health: 10, level: 1, 
    kills: 0, killTarget: 100, 
    phase: 'SWARM', // SWARM or BOSS
    isHyper: false 
};
let joy = { active: false, x: 0, y: 0, sx: 0, sy: 0 };

function bootSystem() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 5000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0x00ffff, 0x000000, 2));
    
    playerShip = createDreadnought();
    scene.add(playerShip);

    for(let i = 0; i < 15; i++) spawnChunk(i * -20000);
    setupControls();
    clock = new THREE.Clock();
    animate();
    setInterval(() => { if(state.phase === 'SWARM' && !state.isHyper) spawnDrone(); }, 1000);
}

function createDreadnought() {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({color:0x444444, metalness:1, roughness:0.1});
    const glowMat = new THREE.MeshBasicMaterial({color:0x00ffff, transparent:true, opacity:0.8});
    const body = new THREE.Mesh(new THREE.CylinderGeometry(800, 900, 200, 32), mat);
    body.rotation.x = Math.PI/2;
    g.add(body);
    const engine = new THREE.Mesh(new THREE.SphereGeometry(400, 16, 16), glowMat);
    engine.position.z = 100;
    g.add(engine);
    g.scale.setScalar(3);
    return g;
}

function spawnDrone() {
    const d = new THREE.Mesh(new THREE.SphereGeometry(500, 8, 8), new THREE.MeshBasicMaterial({color:0xff0000}));
    d.position.set((Math.random()-0.5)*150000, (Math.random()-0.5)*60000, playerShip.position.z - 150000);
    scene.add(d); drones.push(d);
}

function spawnBoss() {
    state.phase = 'BOSS';
    if(bossEntity) scene.remove(bossEntity);
    bossEntity = new THREE.Group();
    
    // Logic for Star Destroyer (lvl 50) or Death Star/Destroyer combo (lvl 100)
    let bossGeo;
    if(state.level >= 100) { bossGeo = new THREE.SphereGeometry(150000, 32, 32); } // Death Star
    else { bossGeo = new THREE.ConeGeometry(80000, 200000, 4); } // Star Destroyer

    const body = new THREE.Mesh(bossGeo, new THREE.MeshStandardMaterial({color: 0x666666}));
    bossEntity.add(body);
    
    // Core Logic
    cores = [];
    let coreCount = (state.level >= 100) ? 5 : 3; 
    for(let i=0; i<coreCount; i++) {
        const c = new THREE.Mesh(new THREE.SphereGeometry(12000, 16, 16), new THREE.MeshBasicMaterial({color: 0xff0000}));
        c.position.set((Math.random()-0.5)*100000, (Math.random()-0.5)*100000, 20000);
        bossEntity.add(c);
        cores.push(c);
    }

    bossEntity.position.set(0, 0, playerShip.position.z - 500000);
    scene.add(bossEntity);
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    playerShip.position.x += joy.x * 50000 * dt;
    playerShip.position.y += joy.y * 40000 * dt;
    playerShip.position.z -= state.speed * dt;

    // Fixed Bullet Speed Logic
    const bulletSpeed = 150000; 
    lasers.forEach((p, i) => {
        p.position.z -= bulletSpeed * dt; 
        
        // Swarm Collision
        drones.forEach((d, di) => {
            if(p.position.distanceTo(d.position) < 3000) {
                scene.remove(d); drones.splice(di, 1);
                scene.remove(p); lasers.splice(i, 1);
                state.kills++;
                document.getElementById('kill-val').innerText = state.kills;
                if(state.kills >= state.killTarget) spawnBoss();
            }
        });

        // Boss Core Collision
        cores.forEach((c, ci) => {
            if(p.position.distanceTo(c.getWorldPosition(new THREE.Vector3())) < 15000) {
                scene.remove(c); cores.splice(ci, 1);
                scene.remove(p); lasers.splice(i, 1);
                if(cores.length === 0) nextLevel();
            }
        });
    });

    updateRadar();
    chunks.forEach(c => { if(c.position.z > playerShip.position.z + 20000) c.position.z -= 20000 * chunks.length; });
    
    camera.position.lerp(playerShip.position.clone().add(new THREE.Vector3(0, 8000, 30000)), 0.1);
    camera.lookAt(playerShip.position.x, playerShip.position.y, playerShip.position.z - 15000);
    renderer.render(scene, camera);
}

function nextLevel() {
    state.level++;
    state.kills = 0;
    state.killTarget = 100 + ((state.level - 1) * 50);
    state.phase = 'SWARM';
    scene.remove(bossEntity);
    document.getElementById('lvl-val').innerText = state.level;
    document.getElementById('target-val').innerText = state.killTarget;
    document.getElementById('kill-val').innerText = "0";
}

function updateRadar() {
    const container = document.getElementById('blip-container');
    container.innerHTML = '';
    drones.forEach(d => {
        const dx = (d.position.x - playerShip.position.x) / 3000;
        const dz = (d.position.z - playerShip.position.z) / 3000;
        const b = document.createElement('div');
        b.className = 'blip';
        b.style.left = (50 + dx) + 'px';
        b.style.top = (50 + dz) + 'px';
        container.appendChild(b);
    });
}

function spawnChunk(z) {
    const chunk = new THREE.Group();
    chunk.add(new THREE.GridHelper(200000, 10, 0x00ffff, 0x112233));
    chunk.position.z = z; scene.add(chunk); chunks.push(chunk);
}

function setupControls() {
    document.getElementById('fire-btn').ontouchstart = (e) => { e.preventDefault(); shoot(); };
    document.getElementById('seeker-btn').ontouchstart = (e) => { e.preventDefault(); shootMissile(); };
    document.getElementById('hyper-btn').ontouchstart = (e) => { e.preventDefault(); triggerHyper(); };
    document.addEventListener('touchstart', e => { 
        if(e.touches[0].clientX < window.innerWidth/2) { joy.active=true; joy.sx=e.touches[0].clientX; joy.sy=e.touches[0].clientY; }
    });
    document.addEventListener('touchmove', e => { if(joy.active) { joy.x = (e.touches[0].clientX-joy.sx)/60; joy.y = (joy.sy-e.touches[0].clientY)/60; } });
    document.addEventListener('touchend', () => { joy.active=false; joy.x=joy.y=0; });
}

function triggerHyper() {
    state.isHyper = true; state.speed = 300000;
    document.getElementById('fade-layer').style.opacity = 0.5;
    setTimeout(() => { state.isHyper = false; state.speed = 7500; document.getElementById('fade-layer').style.opacity = 0; }, 2000);
}

function shoot() {
    const p = new THREE.Mesh(new THREE.BoxGeometry(300,300,10000), new THREE.MeshBasicMaterial({color: 0x00ffff}));
    p.position.copy(playerShip.position);
    scene.add(p); lasers.push(p);
}

function shootMissile() {
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(300, 1000, 4, 8), new THREE.MeshBasicMaterial({color:0xf0f}));
    m.position.copy(playerShip.position);
    m.userData = { target: drones[0] || cores[0] };
    scene.add(m); missiles.push(m);
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
