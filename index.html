<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS v9.1 | HYPERDRIVE ENGAGED</title>
    <style>
        body { margin:0; overflow:hidden; background:#000; font-family:'Courier New',monospace; touch-action:none; color:#0ff; }
        #debug { position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.7); color:#0f0; padding:8px; font-size:11px; z-index:1000; pointer-events:none; max-width:90%; height:60px; overflow:hidden; }
        #hud { position:absolute; inset:0; pointer-events:none; z-index:20; }
        .top-bar { display:flex; justify-content:space-between; padding:15px; background:rgba(0,0,0,0.8); border-bottom:2px solid #0ff; font-size:1.1em; }
        .ctrl-btn { position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center; justify-content:center; font-weight:bold; z-index:30; }
        #fire-btn { bottom:40px; right:40px; width:110px; height:110px; background:rgba(0,255,255,0.1); border:5px solid #0ff; color:#0ff; font-size:18px; }
        #seeker-btn { bottom:40px; left:40px; width:90px; height:90px; background:rgba(255,0,0,0.1); border:5px solid #f00; color:#f00; font-size:14px; }
        #titan-hp-wrap { position:absolute; top:70px; left:50%; transform:translateX(-50%); width:70%; height:14px; border:2px solid #f00; display:none; background:#300; }
        #titan-hp-bar { width:100%; height:100%; background:#f00; transition:width 0.4s; }
        .screen { position:absolute; inset:0; background:#000; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        button { padding:25px 60px; background:#0ff; color:#000; border:none; font-weight:bold; font-size:28px; cursor:pointer; box-shadow:0 0 40px #0ff; }
        #js-base { position:absolute; width:160px; height:160px; border:2px solid rgba(0,255,255,0.3); border-radius:50%; display:none; pointer-events:none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
    <div id="yt-player" style="position:absolute; top:-1000px;"></div>
    <div id="debug">System Ready...</div>
    <div id="menu-screen" class="screen">
        <h1 style="letter-spacing:12px;">ARTEMIS v9.1</h1>
        <p style="color:#0ff;">HYPERDRIVE STABLE | TITAN PROTOCOL</p>
        <button onclick="bootSystem()">ENGAGE</button>
    </div>
    <div id="hud" style="display:none;">
        <div class="top-bar">
            <div>SHIELD: <span id="shield-val">0</span>% | COMBO: <span id="combo-val">0</span></div>
            <div>SCORE: <span id="score-val">0</span></div>
        </div>
        <div id="titan-hp-wrap"><div id="titan-hp-bar"></div></div>
        <div id="fire-btn" class="ctrl-btn">FIRE</div>
        <div id="seeker-btn" class="ctrl-btn">SEEKER</div>
    </div>

<script>
let scene, camera, renderer, clock, player, ytPlayer;
let worldObjs = [], lasers = [], drones = [], enemyLasers = [], particles = [];
let state = { 
    score: 0, combo: 0, speed: 6000, shieldCharge: 0.8, isShielded: false, 
    titanActive: false, titanDefeated: false, titanHP: 2500, titanMesh: null, 
    shake: 0, lastFire: 0, warpActive: false, baseFOV: 75
};
let joy = { active: false, x: 0, y: 0, sx: 0, sy: 0 };

// --- MUSIC ENGINE ---
function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('yt-player', {
        height: '0', width: '0', videoId: 'wmin5WkOuPw',
        playerVars: { 'autoplay': 1, 'loop': 1, 'playlist': 'wmin5WkOuPw' },
        events: { 'onReady': (e) => e.target.setVolume(45) }
    });
}

function switchMusic(isBoss) {
    if (ytPlayer && ytPlayer.loadVideoById) {
        const trackId = isBoss ? 'PL7F37BB1A67E0238D' : 'wmin5WkOuPw';
        ytPlayer.loadVideoById(trackId);
    }
}

function bootSystem() {
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    init();
}

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000205);
    scene.fog = new THREE.FogExp2(0x000510, 0.000015);
    
    camera = new THREE.PerspectiveCamera(state.baseFOV, window.innerWidth/window.innerHeight, 1, 1000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x00ffff, 0x5500ff, 2));
    
    createStarField();
    player = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(300, 300, 80, 32), new THREE.MeshStandardMaterial({color:0x888888, metalness:0.9}));
    player.add(body);
    state.shieldMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(550, 1), new THREE.MeshBasicMaterial({color:0x00ffff, wireframe:true, transparent:true, opacity:0}));
    player.add(state.shieldMesh);
    player.position.y = 1400;
    scene.add(player);

    for(let i = 0; i < 40; i++) spawnChunk(i * -20000);
    setupControls();
    clock = new THREE.Clock();
    animate();
    setInterval(spawnDrone, 2500);
}

function createStarField() {
    const geo = new THREE.BufferGeometry();
    const pos = [];
    for (let i = 0; i < 10000; i++) {
        pos.push((Math.random()-0.5)*150000, (Math.random()-0.5)*100000, (Math.random()-0.5)*400000);
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const stars = new THREE.Points(geo, new THREE.PointsMaterial({color:0xffffff, size:150, sizeAttenuation: true}));
    scene.add(stars);
}

function spawnChunk(z) {
    const grid = new THREE.GridHelper(60000, 40, 0x0044ff, 0x001133);
    grid.position.set(0, -1400, z);
    scene.add(grid);
    for(let i=0; i<3; i++) {
        const h = 10000 + Math.random()*30000;
        const b = new THREE.Mesh(new THREE.BoxGeometry(4000, h, 4000), new THREE.MeshStandardMaterial({color:0x020202}));
        b.position.set((Math.random()-0.5)*50000, h/2 - 1400, z + (Math.random()-0.5)*10000);
        scene.add(b);
    }
}

function spawnDrone() {
    const d = new THREE.Mesh(new THREE.OctahedronGeometry(800), new THREE.MeshPhongMaterial({color:0xff3300, emissive:0xff0000}));
    d.position.set((Math.random()-0.5)*40000, (Math.random()-0.5)*15000, player.position.z - 60000);
    scene.add(d);
    drones.push(d);
}

function droneAttack(d) {
    if (Math.random() > 0.99) {
        const el = new THREE.Mesh(new THREE.SphereGeometry(250), new THREE.MeshBasicMaterial({color:0xff0000}));
        el.position.copy(d.position);
        el.userData = { vel: new THREE.Vector3().subVectors(player.position, d.position).normalize().multiplyScalar(15000) };
        scene.add(el);
        enemyLasers.push(el);
    }
}

function shoot() {
    const now = Date.now();
    if (now - state.lastFire < 200) return;
    const forward = new THREE.Vector3(0, 0, -40000); // Massive forward projectile speed
    for(let x of [-250, 250]) {
        const l = new THREE.Mesh(new THREE.BoxGeometry(80, 80, 3000), new THREE.MeshBasicMaterial({color:0x00ffff}));
        l.position.copy(player.position).add(new THREE.Vector3(x, 0, -1000));
        l.userData = { vel: forward };
        scene.add(l);
        lasers.push(l);
    }
    state.lastFire = now;
}

function spawnTitan() {
    if (state.titanActive || state.titanDefeated) return;
    state.titanActive = true;
    document.getElementById('titan-hp-wrap').style.display = 'block';
    state.titanMesh = new THREE.Mesh(new THREE.ConeGeometry(18000, 50000, 4), new THREE.MeshStandardMaterial({color:0x050505, metalness:1}));
    state.titanMesh.rotation.set(Math.PI/2, 0, Math.PI/4);
    state.titanMesh.position.set(0, 5000, player.position.z - 100000);
    scene.add(state.titanMesh);
    switchMusic(true);
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    // Movement
    player.position.x += joy.x * 25000 * dt;
    player.position.y += joy.y * 20000 * dt;
    player.position.z -= state.speed * dt;

    // Hyperdrive Speed Logic
    state.warpActive = state.score > 10000;
    let targetSpeed = state.warpActive ? 48000 : 7000;
    state.speed = THREE.MathUtils.lerp(state.speed, targetSpeed, 0.03);
    
    // Camera Warp FOV
    camera.fov = THREE.MathUtils.lerp(camera.fov, state.warpActive ? 115 : state.baseFOV, 0.05);
    camera.updateProjectionMatrix();

    // Bounce Physics (Floor & Walls)
    if (player.position.y < -1100) { player.position.y = -1100; state.shake = 10; state.shieldCharge -= 0.05; }
    if (Math.abs(player.position.x) > 28000) { player.position.x = player.position.x > 0 ? 27500 : -27500; state.shake = 10; state.shieldCharge -= 0.05; }

    // Combat Loop
    for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].position.z += lasers[i].userData.vel.z * dt;
        if(state.titanActive && lasers[i].position.distanceTo(state.titanMesh.position) < 25000) {
            state.titanHP -= 10;
            document.getElementById('titan-hp-bar').style.width = (state.titanHP/2500*100)+'%';
            scene.remove(lasers[i]); lasers.splice(i,1);
            if(state.titanHP <= 0) { 
                scene.remove(state.titanMesh); 
                state.titanActive = false; 
                state.titanDefeated = true; 
                state.score += 1000000;
                document.getElementById('titan-hp-wrap').style.display = 'none';
                switchMusic(false);
            }
        }
        drones.forEach((d, di) => {
            if(lasers[i] && lasers[i].position.distanceTo(d.position) < 2000) {
                scene.remove(d); drones.splice(di, 1);
                scene.remove(lasers[i]); lasers.splice(i, 1);
                state.score += 5000; state.combo++;
            }
        });
    }

    enemyLasers.forEach((el, i) => {
        el.position.add(el.userData.vel.clone().multiplyScalar(dt));
        if(el.position.distanceTo(player.position) < 1200) {
            state.shieldCharge -= 0.15; state.shake = 20;
            scene.remove(el); enemyLasers.splice(i,1);
        }
    });

    drones.forEach(d => { if(d.position.z > player.position.z - 55000) droneAttack(d); });

    // Shield UI
    state.shieldCharge = Math.min(1, state.shieldCharge + 0.015 * dt);
    state.isShielded = state.shieldCharge >= 0.95;
    state.shieldMesh.material.opacity = state.isShielded ? 0.6 : 0;
    
    document.getElementById('score-val').innerText = Math.floor(state.score += state.speed*dt*0.1);
    document.getElementById('shield-val').innerText = Math.max(0, Math.floor(state.shieldCharge * 100));
    document.getElementById('combo-val').innerText = state.combo;
    if(state.combo >= 40 && !state.titanActive && !state.titanDefeated) spawnTitan();

    // Camera follow
    camera.position.lerp(player.position.clone().add(new THREE.Vector3(0, 2200, 8500)), 0.1);
    camera.lookAt(player.position.x, player.position.y, player.position.z - 5000);
    
    if(state.shake > 0.1) {
        camera.position.x += (Math.random()-0.5)*state.shake;
        camera.position.y += (Math.random()-0.5)*state.shake;
        state.shake *= 0.9;
    }

    renderer.render(scene, camera);
}

function setupControls() {
    document.getElementById('fire-btn').addEventListener('touchstart', e => { e.preventDefault(); shoot(); });
    document.addEventListener('touchstart', e => { if(e.touches[0].clientX < window.innerWidth/2) { joy.active=true; joy.sx=e.touches[0].clientX; joy.sy=e.touches[0].clientY; } });
    document.addEventListener('touchmove', e => { if(!joy.active) return; joy.x = (e.touches[0].clientX - joy.sx)/80; joy.y = (joy.sy - e.touches[0].clientY)/80; });
    document.addEventListener('touchend', () => { joy.active=false; joy.x=joy.y=0; });
}
</script>
</body>
</html>
