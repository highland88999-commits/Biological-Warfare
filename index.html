        #yt-player { position: absolute; top: -1000px; }
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; color: #0ff; }

        #js-base { position: absolute; width: 140px; height: 140px; border: 3px solid #0ff; background: rgba(0,255,255,0.1); border-radius: 50%; display: none; pointer-events: none; z-index: 15; }
        #js-knob { position: absolute; width: 60px; height: 60px; background: #0ff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 25px #0ff; }
        .screen { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        button { padding: 20px 50px; background: #0ff; border: none; font-weight: bold; cursor: pointer; font-size: 24px; box-shadow: 0 0 30px #0ff; }
        #multiplier-tag, #shield-status { font-size: 20px; color: #f0f; text-shadow: 0 0 10px #f0f; display: none; margin-left: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>

    // ─── MUSIC SEQUENCE ───
    const MUSIC_SEQUENCE = [

        { type: 'playlist', id: 'PL7F37BB1A67E0238D' },                          // 1: TRON Legacy OST

        { type: 'playlist', id: 'OLAK5uy_lWke5nT7WDSQvpWiIIOGtJ9XnaJlExpDU' }    // 3: Synth playlist 2
    ];

    let currentMusicIndex = 0;
    let resumeAfterBossIndex = 0;

    function playCurrentMusicItem() {
        const item = MUSIC_SEQUENCE[currentMusicIndex];
        if (item.type === 'video') {
            ytPlayer.loadVideoById(item.id);
        } else {
            ytPlayer.loadPlaylist({ list: item.id, index: 0 });
        }
        ytPlayer.playVideo();
    }

    function switchMusic(toBoss) {
        if (!ytPlayer) return;

        if (toBoss) {
            resumeAfterBossIndex = currentMusicIndex;
            ytPlayer.loadVideoById('wmin5WkOuPw'); // Firestarter
            ytPlayer.setLoop(true);
            ytPlayer.playVideo();
        } else {
            // Advance to next after boss (or resume if interrupted mid-sequence)
            currentMusicIndex = (resumeAfterBossIndex + 1) % MUSIC_SEQUENCE.length;
            playCurrentMusicItem();
        }
    }

    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.ENDED && !bossActive) {
            currentMusicIndex = (currentMusicIndex + 1) % MUSIC_SEQUENCE.length;
            playCurrentMusicItem();
        }
    }

    // ─── BOOT & INIT ───
    function bootSystem() {
        document.getElementById('menu-screen').style.display = 'none';
        ytPlayer?.playVideo(); // Start Venom immediately
        init();
    }

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000308);
        scene.fog = new THREE.FogExp2(0x001122, 0.000008);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 600000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0x0044ff, 0x8800ff, 1.8));

        playerShip = createFalcon();
        scene.add(playerShip);

        for(let i = 0; i < 40; i++) spawnChunk(i * -18000);
        setupControls();
        minimapCtx = document.getElementById('minimap').getContext('2d');

        animate();

</html>
