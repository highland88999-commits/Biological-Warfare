<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Falcon OS: Neon Overdrive</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --blue: #0ff; --magenta: #f0f; --neon-green: #39ff14; --red: #ff3131; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; }
        
        #hud { position: absolute; top: 20px; left: 20px; z-index: 100; border-left: 2px solid var(--blue); padding: 10px; background: rgba(0,0,0,0.8); pointer-events: none; }
        .mode-hl { color: var(--neon-green); font-weight: bold; text-shadow: 0 0 10px var(--neon-green); }
        
        #joy-left-zone { position: absolute; top: 0; left: 0; width: 50%; height: 100%; z-index: 200; }
        #joy-left-container { position: absolute; width: 80px; height: 80px; border: 1px solid var(--blue); border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); }
        #joy-left-stick { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; background: var(--blue); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 15px var(--blue); }
        
        #ctrl-right { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        #hyper-btn { width: 70px; height: 70px; background: rgba(255,255,255,0.1); border: 2px solid var(--blue); border-radius: 10px; color: var(--blue); font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px var(--blue); }
        #fire-btn { width: 90px; height: 90px; background: rgba(255,0,0,0.2); border: 3px solid var(--red); border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 5px red; }
    </style>
</head>
<body>

    <div id="hud">
        WEAPON: <span id="w-mode" class="mode-hl">STANDARD</span><br>
        SPEED: <span id="v-stat" style="color:white">50</span> MK<br>
        HULL: <span id="h-stat" style="color:var(--magenta)">100%</span>
    </div>

    <div id="joy-left-zone"><div id="joy-left-container"><div id="joy-left-stick"></div></div></div>

    <div id="ctrl-right">
        <div id="hyper-btn">HYPER</div>
        <div id="fire-btn">FIRE</div>
    </div>

<script>
let scene, camera, renderer, clock = new THREE.Clock();
let playerShip, buildings = [], enemies = [], projectiles = [];
let lastFireTap = 0;
const state = { 
    hull: 100, joyL: { x: 0, y: 0, active: false }, 
    baseSpeed: 50, currentSpeed: 50, isHyper: false,
    weaponIdx: 0, weapons: ['STANDARD', 'BURST', 'RAPID', 'MISSILE']
};

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 50000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x222244, 0.5));
    
    createFalcon();
    createNeonCity();
    setupControls();
    animate();
}

function createFalcon() {
    playerShip = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9 });
    const hull = new THREE.Mesh(new THREE.CylinderGeometry(15, 15, 4, 32), mat);
    playerShip.add(hull);
    
    // Engine Glow
    const engine = new THREE.Mesh(new THREE.TorusGeometry(12, 1, 8, 20), new THREE.MeshBasicMaterial({color: 0x00ffff}));
    engine.rotation.x = Math.PI/2; engine.position.z = -5;
    playerShip.add(engine);

    playerShip.position.set(0, 400, 0);
    scene.add(playerShip);
}

function createNeonCity() {
    const colors = [0x00f2ff, 0xff00ff, 0x39ff14, 0xffff00];
    for (let i = 0; i < 200; i++) {
        const h = 400 + Math.random() * 2500;
        const b = new THREE.Mesh(new THREE.BoxGeometry(250, h, 250), new THREE.MeshStandardMaterial({ color: 0x050508 }));
        b.position.set((Math.random()-0.5)*20000, h/2, (Math.random()-0.5)*20000);
        
        // Window Lights
        for(let j=0; j<10; j++) {
            const win = new THREE.Mesh(new THREE.BoxGeometry(252, 10, 20), new THREE.MeshBasicMaterial({color: colors[Math.floor(Math.random()*colors.length)]}));
            win.position.y = (Math.random()-0.5) * h;
            win.position.z = (Math.random()-0.5) * 200;
            b.add(win);
        }
        
        scene.add(b);
        buildings.push(b);
    }
}

function handleHyper() {
    if (state.isHyper) return;
    state.isHyper = true;
    state.currentSpeed = state.baseSpeed * 2.5;
    camera.fov = 100; camera.updateProjectionMatrix();
    
    setTimeout(() => {
        state.isHyper = false;
        state.currentSpeed = state.baseSpeed;
        camera.fov = 70; camera.updateProjectionMatrix();
    }, 1000);
}

function cycleWeapon() {
    state.weaponIdx = (state.weaponIdx + 1) % state.weapons.length;
    document.getElementById('w-mode').innerText = state.weapons[state.weaponIdx];
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    // 1. Flight & Stabilization
    playerShip.rotateY(-state.joyL.x * 0.05);
    
    // 180 Turn Logic
    if (state.joyL.y > 0.95) {
        playerShip.rotateY(Math.PI * dt * 2); 
    } else {
        playerShip.rotation.x = THREE.MathUtils.lerp(playerShip.rotation.x, -state.joyL.y * 0.7, 0.05);
    }
    playerShip.rotation.z = THREE.MathUtils.lerp(playerShip.rotation.z, -state.joyL.x * 0.8, 0.05);

    const pDir = new THREE.Vector3(0,0,1).applyQuaternion(playerShip.quaternion);
    playerShip.position.add(pDir.multiplyScalar(state.currentSpeed));

    // Camera
    camera.position.lerp(playerShip.position.clone().add(new THREE.Vector3(0, 40, -150).applyQuaternion(playerShip.quaternion)), 0.1);
    camera.lookAt(playerShip.position);

    document.getElementById('v-stat').innerText = Math.floor(state.currentSpeed);
    renderer.render(scene, camera);
}

function setupControls() {
    const lZone = document.getElementById('joy-left-zone');
    const lCont = document.getElementById('joy-left-container');
    const fBtn = document.getElementById('fire-btn');
    const hBtn = document.getElementById('hyper-btn');

    lZone.addEventListener('pointerdown', e => {
        state.joyL.active = true;
        lCont.style.display = 'block';
        lCont.style.left = e.clientX + 'px'; lCont.style.top = e.clientY + 'px';
        state.joyL.originX = e.clientX; state.joyL.originY = e.clientY;
    });

    window.addEventListener('pointermove', e => {
        if (!state.joyL.active) return;
        const dx = e.clientX - state.joyL.originX; const dy = e.clientY - state.joyL.originY;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
        const angle = Math.atan2(dy, dx);
        state.joyL.x = (Math.cos(angle) * dist) / 40;
        state.joyL.y = (Math.sin(angle) * dist) / 40;
        document.getElementById('joy-left-stick').style.transform = `translate(calc(-50% + ${state.joyL.x * 20}px), calc(-50% + ${state.joyL.y * 20}px))`;
    });

    window.addEventListener('pointerup', () => { state.joyL.active = false; lCont.style.display = 'none'; });

    fBtn.addEventListener('pointerdown', () => {
        const now = Date.now();
        if (now - lastFireTap < 300) cycleWeapon();
        lastFireTap = now;
        // Fire logic would go here based on state.weaponIdx
    });

    hBtn.addEventListener('pointerdown', handleHyper);
}

init();
</script>
</body>
</html>
