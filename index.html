<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS v9.15 | DREADNOUGHT</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; touch-action:none; }
        #video-container { position: absolute; inset:0; pointer-events: none; z-index: 100; opacity: 0; transition: opacity 2s; }
        iframe { width: 100vw; height: 100vh; pointer-events: none; transform: scale(1.4); }
        .ui-screen { position: absolute; inset: 0; z-index: 110; color: #0ff; text-align: center; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .glitch-text { font-size: 3em; letter-spacing: 15px; animation: pulse 2s infinite; text-shadow: 0 0 20px #0ff; }
        button { padding: 20px 40px; background: rgba(0,255,255,0.1); border: 2px solid #0ff; color: #0ff; font-family: inherit; font-size: 1.2em; cursor: pointer; margin-top: 30px; box-shadow: 0 0 10px #0ff; }
        
        /* HUD ELEMENTS */
        #hud { position:absolute; inset:0; pointer-events:none; z-index:20; display:none; color:#0ff; }
        .top-bar { display:flex; justify-content:space-between; padding:15px; background:rgba(0,0,0,0.8); border-bottom:2px solid #0ff; }
        
        /* RADAR SYSTEM */
        #radar { position: absolute; top: 20px; right: 20px; width: 120px; height: 120px; border: 2px solid #0ff; border-radius: 50%; background: rgba(0,40,40,0.5); overflow: hidden; pointer-events: auto; }
        #radar-sweep { position: absolute; width: 100%; height: 100%; background: conic-gradient(from 0deg, rgba(0,255,255,0.3) 0%, transparent 50%); animation: sweep 2s linear infinite; }
        .radar-blip { position: absolute; width: 4px; height: 4px; background: #f00; border-radius: 50%; }

        /* TACTICAL CONSOLE (Bottom Right) */
        #console { position: absolute; bottom: 20px; right: 20px; display: grid; grid-template-areas: "hyper hyper" "seeker fire"; gap: 10px; pointer-events: auto; }
        .ctrl-btn { width: 80px; height: 80px; border-radius: 10px; border: 2px solid #0ff; background: rgba(0,0,0,0.8); color: #0ff; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        #fire-btn { grid-area: fire; width: 100px; height: 100px; border-color: #0ff; }
        #seeker-btn { grid-area: seeker; border-color: #f00; color: #f00; }
        #hyper-btn { grid-area: hyper; width: 100%; height: 60px; border-color: #fff; color: #fff; }

        #fade-layer { position: absolute; inset: 0; background: #fff; z-index: 200; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
        @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="fade-layer"></div>
    <div id="screen-1" class="ui-screen"><h1 class="glitch-text">TITAN FALL</h1><button onclick="engagePreload()">ENGAGE AUDIO & VIDEO</button></div>
    <div id="screen-2" class="ui-screen" style="display:none; background:transparent;">
        <div id="video-container"><div id="player"></div></div>
        <div style="z-index:120;"><h1 class="glitch-text" style="font-size: 2em;">ARTEMIS</h1><button onclick="launchGame()">INITIALIZE COCKPIT</button></div>
    </div>

    <div id="hud">
        <div class="top-bar"><div>LVL: <span id="lvl-val">1</span> | HITS: <span id="shield-val">10</span></div></div>
        <div id="radar"><div id="radar-sweep"></div><div id="blips"></div></div>
        <div id="console">
            <div id="hyper-btn" class="ctrl-btn">HYPER DRIVE</div>
            <div id="seeker-btn" class="ctrl-btn">SEEKER</div>
            <div id="fire-btn" class="ctrl-btn">MAIN CANNON</div>
        </div>
    </div>

<script>
let ytPlayer, gameActive = false;
const introId = 's0HU_j4fRkg', mainLoopId = 'hS57I6swXcc', playlistId = 'PLeMER9rHllyCIchd-ZGKTzAnAXYx4FSOz';

function engagePreload() {
    document.getElementById('screen-1').style.display = 'none';
    document.getElementById('screen-2').style.display = 'flex';
    document.getElementById('video-container').style.opacity = '1';
    if (!ytPlayer) {
        ytPlayer = new YT.Player('player', {
            height: '100%', width: '100%', videoId: introId,
            playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0 },
            events: { 'onReady': (e) => { e.target.unMute(); e.target.playVideo(); } }
        });
    }
}

function launchGame() {
    document.getElementById('fade-layer').style.opacity = 1;
    setTimeout(() => {
        document.getElementById('screen-2').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('fade-layer').style.opacity = 0;
        ytPlayer.loadPlaylist({ list: playlistId, listType: 'playlist' });
        bootSystem();
        gameActive = true;
    }, 1000);
}

// GAME CORE
let scene, camera, renderer, clock, playerShip, moon, targetMarker;
let chunks = [], lasers = [], drones = [], enemyLasers = [];
let state = { score: 0, speed: 7500, health: 10, level: 1, isHyper: false };
let joy = { active: false, x: 0, y: 0, sx: 0, sy: 0 };

function bootSystem() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000510, 0.00001);
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 4000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.HemisphereLight(0xaaddff, 0x000000, 1.5));
    createMoonObjective();
    
    // SHIP IS NOW 3X SIZE
    playerShip = createFalcon();
    playerShip.scale.setScalar(1.8); // 3x relative to original 0.6 scale
    scene.add(playerShip);

    for(let i = 0; i < 15; i++) spawnChunk(i * -20000);
    setupControls();
    clock = new THREE.Clock();
    animate();
    setInterval(() => { if(!state.isHyper) spawnDrone(); }, 1000);
}

function createMoonObjective() {
    moon = new THREE.Mesh(new THREE.SphereGeometry(120000, 32, 32), new THREE.MeshStandardMaterial({color: 0x667788}));
    
    // Red Target Marker (Mandatory Objective)
    const markerGeo = new THREE.RingGeometry(15000, 20000, 32);
    targetMarker = new THREE.Mesh(markerGeo, new THREE.MeshBasicMaterial({color: 0xff0000, side: THREE.DoubleSide}));
    targetMarker.position.set(0, 0, 120001);
    moon.add(targetMarker);

    moon.position.set(0, 80000, -2000000);
    scene.add(moon);
}

function createFalcon() {
    const g = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({color:0xcccccc, metalness:0.8});
    g.add(new THREE.Mesh(new THREE.CylinderGeometry(300, 300, 80, 32), mat));
    const cockpit = new THREE.Mesh(new THREE.SphereGeometry(70, 16, 16), new THREE.MeshBasicMaterial({color:0x00ffff}));
    cockpit.position.set(450, 0, 200); g.add(cockpit);
    return g;
}

function spawnDrone() {
    const d = new THREE.Group();
    d.add(new THREE.Mesh(new THREE.SphereGeometry(400, 8, 8), new THREE.MeshStandardMaterial({color:0x222222})));
    d.position.set((Math.random()-0.5)*100000, (Math.random()-0.5)*40000, playerShip.position.z - 150000);
    d.userData = { lastShot: 0 };
    scene.add(d); drones.push(d);
}

function updateRadar() {
    const blipContainer = document.getElementById('blips');
    blipContainer.innerHTML = '';
    drones.forEach(d => {
        const dx = (d.position.x - playerShip.position.x) / 1000;
        const dz = (d.position.z - playerShip.position.z) / 1000;
        const b = document.createElement('div');
        b.className = 'radar-blip';
        b.style.left = (60 + dx) + 'px';
        b.style.top = (60 + dz/5) + 'px';
        blipContainer.appendChild(b);
    });
}

function triggerHyper() {
    if(state.isHyper) return;
    state.isHyper = true;
    state.speed = 250000; // Massively increased entry speed
    document.getElementById('fade-layer').style.opacity = 0.4;
    setTimeout(() => {
        state.speed = 7500 + (state.level * 1000);
        state.isHyper = false;
        document.getElementById('fade-layer').style.opacity = 0;
    }, 2500);
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const now = Date.now();

    // STEERING AREA FREE: Touch only works on left half
    playerShip.position.x += joy.x * 40000 * dt;
    playerShip.position.y += joy.y * 30000 * dt;
    playerShip.position.z -= state.speed * dt;

    // TARGET MARKER BEHAVIOR
    targetMarker.lookAt(playerShip.position);

    // TIE FIGHTERS FLYING TOWARD PLAYER
    drones.forEach((d, i) => {
        d.position.z += (state.speed + 15000) * dt;
        if (now - d.userData.lastShot > 2000 && d.position.distanceTo(playerShip.position) < 200000) {
            const p = new THREE.Mesh(new THREE.BoxGeometry(200, 200, 5000), new THREE.MeshBasicMaterial({color: 0x00ff00}));
            p.position.copy(d.position);
            p.userData = { vel: new THREE.Vector3(0, 0, 40000) };
            scene.add(p); enemyLasers.push(p);
            d.userData.lastShot = now;
        }
        if (d.position.z > playerShip.position.z + 10000) { scene.remove(d); drones.splice(i, 1); }
    });

    // COLLISION & OBJECTIVE
    lasers.forEach((p, i) => {
        p.position.z -= 100000 * dt;
        if(p.position.distanceTo(moon.position) < 130000) {
            state.level++;
            document.getElementById('lvl-val').innerText = state.level;
            moon.position.z -= 2000000;
            scene.remove(p); lasers.splice(i, 1);
        }
    });

    updateRadar();
    chunks.forEach(c => { if(c.position.z > playerShip.position.z + 20000) c.position.z -= 20000 * chunks.length; });
    document.getElementById('shield-val').innerText = state.health;
    
    camera.position.lerp(playerShip.position.clone().add(new THREE.Vector3(0, 6000, 20000)), 0.1);
    camera.lookAt(playerShip.position.x, playerShip.position.y, playerShip.position.z - 10000);
    renderer.render(scene, camera);
}

function spawnChunk(z) {
    const chunk = new THREE.Group();
    chunk.add(new THREE.GridHelper(200000, 10, 0x445566, 0x112233));
    chunk.position.z = z; scene.add(chunk); chunks.push(chunk);
}

function setupControls() {
    document.getElementById('fire-btn').ontouchstart = (e) => { e.preventDefault(); shoot(); };
    document.getElementById('hyper-btn').ontouchstart = (e) => { e.preventDefault(); triggerHyper(); };
    document.addEventListener('touchstart', e => { 
        if(e.touches[0].clientX < window.innerWidth / 2) { 
            joy.active=true; joy.sx=e.touches[0].clientX; joy.sy=e.touches[0].clientY; 
        } 
    });
    document.addEventListener('touchmove', e => { if(joy.active) { joy.x = (e.touches[0].clientX-joy.sx)/60; joy.y = (joy.sy-e.touches[0].clientY)/60; } });
    document.addEventListener('touchend', () => { joy.active=false; joy.x=joy.y=0; });
}

function shoot() {
    const p = new THREE.Mesh(new THREE.BoxGeometry(200,200,6000), new THREE.MeshBasicMaterial({color: 0x00ffff}));
    p.position.copy(playerShip.position);
    scene.add(p); lasers.push(p);
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
