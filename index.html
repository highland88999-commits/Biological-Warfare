<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN FALL: ARTEMIS v9.7</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; touch-action:none; }
        
        /* LANDING & VIDEO */
        #video-container { position: absolute; inset:0; pointer-events: none; z-index: 100; }
        iframe { width: 100vw; height: 100vh; pointer-events: none; transform: scale(1.4); }
        #landing-overlay {
            position: absolute; inset: 0; z-index: 110; color: #0ff; text-align: center;
            background: radial-gradient(circle, rgba(0,255,255,0.05) 0%, rgba(0,0,0,0.8) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .glitch-text { font-size: 3em; letter-spacing: 15px; animation: pulse 2s infinite; text-shadow: 0 0 20px #0ff; }
        
        /* GAME HUD */
        #hud { position:absolute; inset:0; pointer-events:none; z-index:20; display:none; color:#0ff; }
        .top-bar { display:flex; justify-content:space-between; padding:15px; background:rgba(0,0,0,0.8); border-bottom:2px solid #0ff; }
        .ctrl-btn { position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center; justify-content:center; font-weight:bold; z-index:30; cursor:pointer; font-size:12px; }
        
        #fire-btn { bottom:40px; right:40px; width:110px; height:110px; background:rgba(0,255,255,0.1); border:4px solid #0ff; box-shadow: 0 0 20px #0ff; }
        #seeker-btn { bottom:40px; left:40px; width:90px; height:90px; background:rgba(255,0,0,0.1); border:4px solid #f00; color:#f00; box-shadow: 0 0 20px #f00; }
        #surge-btn { bottom:150px; left:40px; width:70px; height:70px; background:rgba(0,150,255,0.1); border:3px solid #0af; color:#0af; box-shadow: 0 0 15px #0af; overflow:hidden; }
        #surge-cooldown { position:absolute; bottom:0; left:0; width:100%; height:0%; background:rgba(0,150,255,0.4); }

        #fade-layer { position: absolute; inset: 0; background: #000; z-index: 200; pointer-events: none; opacity: 0; transition: opacity 1.5s; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body onclick="tryStart()">

    <div id="fade-layer"></div>

    <div id="landing-stage">
        <div id="video-container"><div id="player"></div></div>
        <div id="landing-overlay">
            <h1 class="glitch-text">TITAN FALL<br>ARTEMIS</h1>
            <div style="margin-top:20px; opacity:0.7;">TAP TO ENGAGE PROTOCOL</div>
        </div>
    </div>

    <div id="hud">
        <div class="top-bar">
            <div>SHIELD: <span id="shield-val">100</span>% | SCORE: <span id="score-val">0</span></div>
        </div>
        <div id="fire-btn" class="ctrl-btn">CANNON</div>
        <div id="seeker-btn" class="ctrl-btn">SEEKER</div>
        <div id="surge-btn" class="ctrl-btn"><div id="surge-cooldown"></div><span style="z-index:2">SURGE</span></div>
    </div>

<script>
let ytPlayer, gameActive = false;
const introId = 's0HU_j4fRkg'; 
const mainLoopId = 'hS57I6swXcc';
const gameplayMusic = 'wmin5WkOuPw'; // Your integrated music

function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('player', {
        height: '100%', width: '100%', videoId: introId,
        playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0 },
        events: { 'onReady': (e) => e.target.mute(), 'onStateChange': onPlayerStateChange }
    });
}

function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.ENDED && !gameActive) {
        ytPlayer.loadVideoById({ videoId: mainLoopId, startSeconds: 65 });
    }
}

function tryStart() {
    if(gameActive) return;
    document.getElementById('fade-layer').style.opacity = 1;
    ytPlayer.unMute();
    ytPlayer.setVolume(50);
    
    setTimeout(() => {
        document.getElementById('landing-stage').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('fade-layer').style.opacity = 0;
        
        // Switch to gameplay music
        ytPlayer.loadVideoById(gameplayMusic);
        ytPlayer.setLoop(true);
        
        bootSystem();
        gameActive = true;
    }, 1500);
}

// THREE.JS ENGINE
let scene, camera, renderer, clock, playerShip, surgeMesh;
let chunks = [], lasers = [], drones = [], missiles = [], items = [], particles = [], eLasers = [];
let state = { 
    score: 0, speed: 7000, shield: 100, shake: 0,
    surgeActive: false, surgeCooldown: 0, surgeMaxCD: 60
};
let joy = { active: false, x: 0, y: 0, sx: 0, sy: 0 };

function bootSystem() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000510, 0.00001);
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    // STARFIELD ENGINE
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for (let i = 0; i < 12000; i++) {
        starPos.push((Math.random()-0.5)*200000, (Math.random()-0.5)*150000, (Math.random()-0.5)*400000);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 200}));
    scene.add(stars);

    scene.add(new THREE.HemisphereLight(0x00ffff, 0xff00ff, 2));

    playerShip = new THREE.Group();
    playerShip.add(new THREE.Mesh(new THREE.BoxGeometry(400, 100, 600), new THREE.MeshStandardMaterial({color:0x00ffff})));
    
    surgeMesh = new THREE.Mesh(
        new THREE.TorusGeometry(3000, 60, 16, 100), 
        new THREE.MeshBasicMaterial({color: 0x00aaff, transparent:true, opacity:0})
    );
    surgeMesh.rotation.x = Math.PI/2;
    playerShip.add(surgeMesh);
    scene.add(playerShip);

    for(let i = 0; i < 15; i++) spawnChunk(i * -15000);
    setupControls();
    clock = new THREE.Clock();
    animate();
    setInterval(spawnDrone, 1500);
}

function spawnChunk(z) {
    const chunk = new THREE.Group();
    chunk.add(new THREE.GridHelper(50000, 10, 0x0044ff, 0x001133));
    for(let i=0; i<5; i++) {
        const h = 5000 + Math.random()*25000;
        const b = new THREE.Mesh(new THREE.BoxGeometry(4000, h, 4000), new THREE.MeshStandardMaterial({color:0x050505}));
        b.position.set((Math.random()-0.5)*40000, h/2 - 1400, (Math.random()-0.5)*15000);
        chunk.add(b);
    }
    chunk.position.set(0, -1400, z);
    scene.add(chunk);
    chunks.push(chunk);
}

function spawnDrone() {
    const d = new THREE.Mesh(new THREE.OctahedronGeometry(900), new THREE.MeshPhongMaterial({color:0xff3300}));
    d.position.set((Math.random()-0.5)*30000, (Math.random()-0.5)*10000, playerShip.position.z - 50000);
    d.userData = { offset: Math.random() * 10, lastShot: 0 };
    scene.add(d); drones.push(d);
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    playerShip.position.x += joy.x * 25000 * dt;
    playerShip.position.y += joy.y * 20000 * dt;
    playerShip.position.z -= state.speed * dt;

    if(state.surgeCooldown > 0) {
        state.surgeCooldown -= dt;
        document.getElementById('surge-cooldown').style.height = (state.surgeCooldown / state.surgeMaxCD * 100) + "%";
    }

    if(state.surgeActive) {
        surgeMesh.rotateZ(dt * 10);
        drones.forEach((d, i) => {
            if(d.position.distanceTo(playerShip.position) < 3500) {
                explode(d.position, true);
                scene.remove(d); drones.splice(i, 1);
            }
        });
    }

    // Logic for recycling chunks, drones, and collisions remains consistent with v9.6
    chunks.forEach(c => { if(c.position.z > playerShip.position.z + 15000) c.position.z -= 15000 * chunks.length; });
    
    document.getElementById('score-val').innerText = Math.floor(state.score += state.speed*dt*0.1);
    document.getElementById('shield-val').innerText = Math.max(0, state.shield);
    
    camera.position.lerp(playerShip.position.clone().add(new THREE.Vector3(0, 2000, 8000)), 0.1);
    camera.lookAt(playerShip.position.x, playerShip.position.y, playerShip.position.z - 5000);
    renderer.render(scene, camera);
}

function explode(pos, scrap) {
    for(let i=0; i<8; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(200,200,200), new THREE.MeshBasicMaterial({color:0xffaa00}));
        p.position.copy(pos);
        p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*15000, (Math.random()-0.5)*15000, (Math.random()-0.5)*15000), life: 0.6 };
        scene.add(p); particles.push(p);
    }
}

function setupControls() {
    document.getElementById('fire-btn').addEventListener('touchstart', e => { e.preventDefault(); shoot(false); });
    document.getElementById('seeker-btn').addEventListener('touchstart', e => { e.preventDefault(); shoot(true); });
    document.getElementById('surge-btn').addEventListener('touchstart', e => { e.preventDefault(); 
        if(state.surgeCooldown <= 0) {
            state.surgeActive = true; state.surgeCooldown = 60;
            surgeMesh.material.opacity = 0.7;
            setTimeout(() => { state.surgeActive = false; surgeMesh.material.opacity = 0; }, 3000);
        }
    });
    document.addEventListener('touchstart', e => { if(e.touches[0].clientX < window.innerWidth/2) { joy.active=true; joy.sx=e.touches[0].clientX; joy.sy=e.touches[0].clientY; } });
    document.addEventListener('touchmove', e => { if(joy.active) { joy.x = (e.touches[0].clientX-joy.sx)/80; joy.y = (joy.sy-e.touches[0].clientY)/80; } });
    document.addEventListener('touchend', () => { joy.active=false; joy.x=joy.y=0; });
}

function shoot(homing) {
    const p = new THREE.Mesh(homing ? new THREE.SphereGeometry(400) : new THREE.BoxGeometry(80,80,3000), new THREE.MeshBasicMaterial({color: homing ? 0xff0000 : 0x00ffff}));
    p.position.copy(playerShip.position);
    p.userData = { vel: new THREE.Vector3(0,0, homing ? -20000 : -45000) };
    scene.add(p);
    if(homing) missiles.push(p); else lasers.push(p);
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
