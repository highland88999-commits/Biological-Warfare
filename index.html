<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS v6.7 | STABLE RENDER</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; }
        #debug { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #0f0; padding: 8px; font-size: 11px; z-index: 1000; pointer-events: none; max-width: 80%; }
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; color: #0ff; }
        .top-bar { display: flex; justify-content: space-between; padding: 15px; background: rgba(0,0,0,0.7); border-bottom: 2px solid #0ff; }
        #fire-btn { position: absolute; bottom: 50px; right: 50px; width: 110px; height: 110px; background: rgba(255,0,255,0.2); border: 4px solid #f0f; border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; color: #f0f; font-weight: bold; z-index: 30; }
        .screen { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #0ff; text-align: center; }
        button { padding: 20px 50px; background: #0ff; border: none; font-weight: bold; cursor: pointer; font-size: 24px; box-shadow: 0 0 30px #0ff; }
        #warp-overlay { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 30%, rgba(0,255,255,0.15) 100%); display: none; z-index: 5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="debug">System initializing...</div>
<div id="warp-overlay"></div>

<div id="menu-screen" class="screen">
    <h1>ARTEMIS v6.7</h1>
    <p style="color:#f0f;">CORE RECONSTRUCTION COMPLETE | AEGIS READY</p>
    <button onclick="bootSystem()">ENGAGE ENGINE</button>
</div>

<div id="hud" style="display:none;">
    <div class="top-bar">
        <div>SCORE: <span id="score-val">0</span> <span id="shield-status" style="color:#0ff; display:none;"> [SHIELD READY]</span></div>
        <div>LIVES: <span id="lives-val">3</span></div>
    </div>
    <div id="fire-btn">FIRE</div>
</div>

<script>
    let scene, camera, renderer, clock, player;
    let worldObjs = [], lasers = [];
    let state = { 
        score: 0, speed: 5000, warpMode: false, 
        shieldCharge: 0, isShielded: false, shake: 0 
    };
    
    const log = (m) => { document.getElementById('debug').innerHTML = m; console.log(m); };

    // --- FIX: Functions defined before init() to avoid "Not Defined" errors ---
    function spawnChunk(z) {
        const grid = new THREE.GridHelper(40000, 20, 0x00ffff, 0x002222);
        grid.position.set(0, -1000, z);
        scene.add(grid);
        worldObjs.push(grid);

        // Spawn Side Buildings (Grid Safe)
        [-15000, 15000].forEach(x => {
            const h = 5000 + Math.random() * 15000;
            const b = new THREE.Mesh(
                new THREE.BoxGeometry(3000, h, 3000), 
                new THREE.MeshStandardMaterial({color: 0x050505})
            );
            b.position.set(x, h/2 - 1000, z + (Math.random()-0.5)*5000);
            scene.add(b);
            worldObjs.push(b);
        });
    }

    function bootSystem() {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        init();
    }

    function init() {
        try {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x00050a);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 500000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1));
            const sun = new THREE.DirectionalLight(0x00ffff, 2);
            sun.position.set(0, 5000, 5000);
            scene.add(sun);

            // Player Ship
            player = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(300, 80, 500), new THREE.MeshStandardMaterial({color:0x222222}));
            player.add(body);
            
            // Aegis Shield Mesh
            const sGeo = new THREE.IcosahedronGeometry(450, 1);
            const sMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0 });
            state.shieldMesh = new THREE.Mesh(sGeo, sMat);
            player.add(state.shieldMesh);
            
            scene.add(player);

            // Generate initial world
            for(let i=0; i<20; i++) spawnChunk(i * -15000);

            clock = new THREE.Clock();
            log("System Nominal. Flight engaged.");
            animate();
        } catch (e) {
            log("CRITICAL ERROR: " + e.message);
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        // Warp Logic
        state.warpMode = (state.score > 5000);
        state.speed = THREE.MathUtils.lerp(state.speed, state.warpMode ? 18000 : 5000, 0.05);
        camera.fov = THREE.MathUtils.lerp(camera.fov, state.warpMode ? 105 : 75, 0.05);
        camera.updateProjectionMatrix();
        document.getElementById('warp-overlay').style.display = state.warpMode ? 'block' : 'none';

        // Shield Logic
        if (state.warpMode && !state.isShielded) {
            state.shieldCharge = Math.min(1, state.shieldCharge + 0.1 * dt);
            if (state.shieldCharge >= 1) state.isShielded = true;
        }
        state.shieldMesh.material.opacity = state.isShielded ? 0.4 : 0;
        document.getElementById('shield-status').style.display = state.isShielded ? 'inline' : 'none';

        // Movement & Physics
        player.position.z -= state.speed * dt;
        state.score += state.speed * dt * 0.01;
        document.getElementById('score-val').innerText = Math.floor(state.score);

        // Camera Follow + Shake
        const camTarget = player.position.clone().add(new THREE.Vector3(0, 1500, 5000));
        camera.position.lerp(camTarget, 0.1);
        if (state.shake > 0.1) {
            camera.position.x += (Math.random()-0.5) * state.shake;
            state.shake *= 0.9;
        }
        camera.lookAt(player.position.x, player.position.y, player.position.z - 2000);

        // Recycle World
        worldObjs.forEach(o => {
            if (o.position.z > player.position.z + 10000) o.position.z -= 300000;
        });

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
