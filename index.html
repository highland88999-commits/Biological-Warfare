<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS | DEFINITIVE BUILD</title>
    <style>
        body { margin:0; overflow:hidden; background:#000; font-family:'Courier New',monospace; touch-action:none; color:#0ff; }
        #hud { position:absolute; inset:0; pointer-events:none; z-index:20; display:none; }
        .top-bar { display:flex; justify-content:space-between; padding:15px; background:rgba(0,0,0,0.8); border-bottom:2px solid #0ff; font-size:1.1em; }
        .btn-container { position:absolute; bottom:50px; width:100%; display:flex; justify-content:space-around; pointer-events:none; }
        .ctrl-btn { width:120px; height:120px; border-radius:50%; pointer-events:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:bold; cursor:pointer; font-size:14px; border:6px solid; text-align:center; box-shadow: 0 0 20px currentColor; -webkit-user-select:none; }
        #seeker-btn { color:#f00; border-color:#f00; background:rgba(255,0,0,0.1); }
        #fire-btn { color:#0ff; border-color:#0ff; background:rgba(0,255,255,0.1); }
        #joystick-base { position:absolute; bottom:180px; left:50%; transform:translateX(-50%); width:100px; height:100px; background:rgba(255,255,255,0.1); border-radius:50%; display:none; pointer-events:auto; z-index:30; border: 1px solid rgba(255,255,255,0.3); }
        #joystick-knob { position:absolute; top:30px; left:30px; width:40px; height:40px; background:#fff; border-radius:50%; opacity:0.6; }
        .screen { position:absolute; inset:0; background:#000; z-index:5000; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        #pal-img { width: 250px; border-radius: 50%; border: 4px solid #f00; box-shadow: 0 0 30px #f00; margin-bottom: 25px; }
        .start-btn { padding:20px 60px; background:transparent; color:#0ff; border:3px solid #0ff; font-weight:bold; font-size:22px; cursor:pointer; letter-spacing:3px; box-shadow: 0 0 15px #0ff; }
        #video-container { position:absolute; inset:0; background:#000; display:none; z-index:6000; }
        #skip-btn { position:absolute; bottom:40px; right:40px; padding:15px 40px; background:#0ff; border:none; font-weight:bold; cursor:pointer; z-index:6100; color:#000; }
    </style>
</head>
<body>

    <div id="landing-1" class="screen">
        <img id="pal-img" src="https://static.wikia.nocookie.net/starwars/images/d/d8/Emperor_Sidious.png">
        <h1 style="color:#f00; letter-spacing:8px; font-size:2.5em; text-shadow: 0 0 20px #f00;">UNLIMITED POWER</h1>
        <button class="start-btn" onclick="engageProtocol()">ENGAGE PROTOCOL</button>
    </div>

    <div id="landing-2" class="screen" style="display:none;">
        <h2 style="color:#0ff; letter-spacing:5px;">SYSTEMS ONLINE</h2>
        <p style="color:#fff;">COCKPIT NEURAL LINK ESTABLISHED</p>
        <button class="start-btn" onclick="bootSystem()">ENTER COCKPIT</button>
    </div>

    <div id="hud">
        <div class="top-bar">
            <div>SHIELD: <span id="shd">100</span>% | SECTOR: <span id="lvl">1</span></div>
            <div>COMBO: <span id="combo">0</span> | SCORE: <span id="score">0</span></div>
        </div>
        <div id="joystick-base"><div id="joystick-knob"></div></div>
        <div class="btn-container">
            <div id="seeker-btn" class="ctrl-btn" onclick="fireSeeker()">SEEKER<br><small id="seeker-status" style="font-size:10px;">Ready...</small></div>
            <div id="fire-btn" class="ctrl-btn">FIRE</div>
        </div>
    </div>

    <div id="video-container">
        <div id="vid-frame" style="width:100%; height:100%;"></div>
        <button id="skip-btn" onclick="skipClip()">SKIP TRANSMISSION</button>
    </div>

    <audio id="bg-music" loop><source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Star+Wars+Main+Theme&filename=mt/MTI0Nzk2NDgxMjQ3OTY4_y3X_2fK_2bR38o.mp3" type="audio/mpeg"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let scene, camera, renderer, clock, falcon, deathStar, music, ytPlayer, gridFloor;
let lasers = [], drones = [], missiles = [], cores = [];
let state = { level: 1, score: 0, combo: 0, health: 100, speed: 9800, active: false, seekerReady: true, phase: 'SWARM', shake: 0 };
let joyPos = { x: 0, y: 0 };

// Scene progression mapping
const vids = { 1:'D5iEO8n6I3w', 2:'lsAEdblcqU4', 3:'Xkm9h0S4wr8', 4:'d3nuk8UI76M', 5:'n3DHDXAzoBA', 6:'D5iEO8n6I3w', 7:'lsAEdblcqU4', 8:'Xkm9h0S4wr8', 9:'d3nuk8UI76M', 10:'n3DHDXAzoBA' };

function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('vid-frame', { height: '100%', width: '100%', events: { 'onStateChange': (e) => { if(e.data === YT.PlayerState.ENDED) skipClip(); } } });
}

function engageProtocol() {
    document.getElementById('landing-1').style.display = 'none';
    document.getElementById('landing-2').style.display = 'flex';
    music = document.getElementById('bg-music');
    music.play().catch(() => {});
}

function bootSystem() {
    document.getElementById('landing-2').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('joystick-base').style.display = 'block';
    init();
}

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    gridFloor = new THREE.GridHelper(1000000, 250, 0x00ffff, 0x002222);
    gridFloor.position.y = -5000;
    scene.add(gridFloor);

    for(let i=0; i<80; i++) {
        const h = 20000 + Math.random()*50000;
        const p = new THREE.Mesh(new THREE.BoxGeometry(4000, h, 4000), new THREE.MeshStandardMaterial({color:0x050505}));
        p.position.set((Math.random()-0.5)*180000, h/2 - 5000, -Math.random()*800000);
        scene.add(p);
    }

    falcon = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(600, 600, 150, 32), new THREE.MeshStandardMaterial({color:0xcccccc, metalness:0.8}));
    body.rotation.x = Math.PI/2;
    falcon.add(body);
    scene.add(falcon);

    deathStar = new THREE.Mesh(new THREE.SphereGeometry(45000, 32, 32), new THREE.MeshStandardMaterial({color:0x1a1a1a}));
    deathStar.visible = false;
    scene.add(deathStar);

    scene.add(new THREE.HemisphereLight(0x00ffff, 0x000000, 1.8));
    setupJoystick();

    document.getElementById('fire-btn').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    
    state.active = true;
    clock = new THREE.Clock();
    spawnEnemies();
    animate();
}

function setupJoystick() {
    const base = document.getElementById('joystick-base');
    const knob = document.getElementById('joystick-knob');
    const move = (e) => {
        const t = e.touches ? e.touches[0] : e;
        const r = base.getBoundingClientRect();
        let dx = t.clientX - (r.left + r.width/2);
        let dy = t.clientY - (r.top + r.height/2);
        const d = Math.min(40, Math.sqrt(dx*dx + dy*dy));
        const a = Math.atan2(dy, dx);
        joyPos.x = (Math.cos(a) * d) / 40;
        joyPos.y = -(Math.sin(a) * d) / 40;
        knob.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
    };
    base.addEventListener('touchmove', (e) => { e.preventDefault(); move(e); });
    base.addEventListener('touchend', () => { joyPos = {x:0, y:0}; knob.style.transform = 'translate(0,0)'; });
}

function shoot() {
    const l = new THREE.Mesh(new THREE.BoxGeometry(60, 60, 4000), new THREE.MeshBasicMaterial({color:0x00ffff}));
    l.position.copy(falcon.position).z -= 1200;
    scene.add(l);
    lasers.push(l);
}

function fireSeeker() {
    if(!state.seekerReady || drones.length === 0) return;
    state.seekerReady = false;
    document.getElementById('seeker-status').innerText = "LOCKING...";
    const m = new THREE.Mesh(new THREE.SphereGeometry(500), new THREE.MeshBasicMaterial({color:0xff0000}));
    m.position.copy(falcon.position);
    scene.add(m);
    missiles.push({mesh: m, target: drones[0]});
    setTimeout(() => { state.seekerReady = true; document.getElementById('seeker-status').innerText = "Ready..."; }, 5000);
}

function spawnEnemies() {
    drones.forEach(d => scene.remove(d)); drones = [];
    for(let i=0; i<25; i++) {
        const tie = new THREE.Mesh(new THREE.BoxGeometry(2200, 2200, 2200), new THREE.MeshPhongMaterial({color:0x222222}));
        resetTie(tie);
        scene.add(tie);
        drones.push(tie);
    }
}

function resetTie(tie) {
    tie.position.set((Math.random()-0.5)*160000, (Math.random()-0.5)*70000, falcon.position.z - (150000 + Math.random()*200000));
}

function animate() {
    requestAnimationFrame(animate);
    if(!state.active) return;
    const dt = clock.getDelta();

    falcon.position.x += joyPos.x * 70000 * dt;
    falcon.position.y += joyPos.y * 60000 * dt;
    falcon.position.z -= state.speed * dt;
    gridFloor.position.z = falcon.position.z;

    camera.position.lerp(falcon.position.clone().add(new THREE.Vector3(0, 3000, 8000)), 0.1);
    camera.lookAt(falcon.position.x, falcon.position.y, falcon.position.z - 20000);

    lasers.forEach((l, i) => {
        l.position.z -= 100000 * dt;
        drones.forEach(d => {
            if(l.position.distanceTo(d.position) < 8000) {
                state.score += 300; state.combo++; updateHUD(); resetTie(d);
                if(state.score >= 10000 && state.phase === 'SWARM') startBoss();
            }
        });
        cores.forEach((c, ci) => {
            if(l.position.distanceTo(c.position) < 10000) {
                scene.remove(c); cores.splice(ci, 1); state.shake = 50;
                if(cores.length === 0) levelUp();
            }
        });
    });

    missiles.forEach((m, i) => {
        m.mesh.position.lerp(m.target.position, 0.2);
        if(m.mesh.position.distanceTo(m.target.position) < 4000) {
            resetTie(m.target); scene.remove(m.mesh); missiles.splice(i, 1);
            state.score += 1000; updateHUD();
        }
    });

    drones.forEach(d => {
        if(d.position.z > falcon.position.z + 10000) resetTie(d);
        if(d.position.distanceTo(falcon.position) < 5000) {
            state.health -= 25; state.shake = 60; updateHUD(); resetTie(d);
            if(state.health <= 0) location.reload();
        }
    });

    if(state.shake > 0) { camera.position.x += (Math.random()-0.5)*state.shake; state.shake *= 0.85; }
    renderer.render(scene, camera);
}

function startBoss() {
    state.phase = 'BOSS'; deathStar.visible = true;
    deathStar.position.z = falcon.position.z - 200000;
    for(let i=0; i<5; i++) {
        const c = new THREE.Mesh(new THREE.SphereGeometry(4000), new THREE.MeshBasicMaterial({color:0xff0000}));
        c.position.set((Math.random()-0.5)*60000, (Math.random()-0.5)*50000, deathStar.position.z + 10000);
        scene.add(c); cores.push(c);
    }
}

function levelUp() {
    state.active = false; music.pause();
    document.getElementById('video-container').style.display = 'block';
    ytPlayer.loadVideoById(vids[state.level] || 'n3DHDXAzoBA');
}

function skipClip() {
    document.getElementById('video-container').style.display = 'none';
    ytPlayer.stopVideo();
    state.level++; state.score = 0; state.health = 100; state.phase = 'SWARM';
    deathStar.visible = false; updateHUD();
    document.getElementById('lvl').innerText = state.level;
    music.play(); state.active = true;
}

function updateHUD() {
    document.getElementById('score').innerText = state.score;
    document.getElementById('combo').innerText = state.combo;
    document.getElementById('shd').innerText = Math.max(0, state.health);
}
</script>
</body>
</html>
