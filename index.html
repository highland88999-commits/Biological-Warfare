<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS v14.0 | THE HYPER-SAGA</title>
    <style>
        body { margin:0; overflow:hidden; background:#000; font-family:'Courier New',monospace; touch-action:none; color:#0ff; }
        #hud { position:absolute; inset:0; pointer-events:none; z-index:20; }
        .top-bar { display:flex; justify-content:space-between; padding:15px; background:rgba(0,0,0,0.8); border-bottom:2px solid #0ff; font-size:1.1em; }
        .ctrl-btn { position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center; justify-content:center; font-weight:bold; z-index:30; cursor:pointer;}
        #fire-btn { bottom:40px; right:40px; width:110px; height:110px; background:rgba(0,255,255,0.1); border:5px solid #0ff; color:#0ff; box-shadow: 0 0 20px #0ff; }
        #video-container { position:absolute; inset:0; background:#000; display:none; z-index:2000; pointer-events:auto; }
        #skip-btn { position:absolute; bottom:40px; right:40px; padding:15px 40px; background:#0ff; border:none; font-weight:bold; cursor:pointer; z-index:2100; }
        .screen { position:absolute; inset:0; background:#000; z-index:5000; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        #palpatine-img { width: 250px; border-radius: 50%; border: 4px solid #f00; box-shadow: 0 0 30px #f00; margin-bottom: 20px; }
        button.start { padding:25px 60px; background:#0ff; color:#000; border:none; font-weight:bold; font-size:24px; cursor:pointer; }
    </style>
</head>
<body>

    <div id="yt-player-container" style="position:absolute; top:-1000px;"><div id="player"></div></div>

    <div id="menu-screen" class="screen">
        <img id="palpatine-img" src="https://i.imgur.com/kP5h1oE.jpg">
        <h1 style="letter-spacing:10px; color:#f00;">UNLIMITED POWER</h1>
        <p>ARTEMIS HYPER-SAGA PROTOCOL</p>
        <button class="start" onclick="bootSystem()">ENGAGE COCKPIT</button>
    </div>

    <div id="hud" style="display:none;">
        <div class="top-bar">
            <div>SECTOR: <span id="lvl">1</span> | SHIELD: <span id="shd">100</span>%</div>
            <div>TIES: <span id="cnt">0</span>/100 | LVL KILLS: <span id="lvl-kills">0</span></div>
        </div>
        <div id="fire-btn" class="ctrl-btn">FIRE</div>
    </div>

    <div id="video-container">
        <div id="vid-frame" style="width:100%; height:100%;"></div>
        <button id="skip-btn" onclick="skipClip()">SKIP TRANSMISSION</button>
    </div>

    <audio id="bg-music" loop>
        <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Star+Wars+Main+Theme&filename=mt/MTI0Nzk2NDgxMjQ3OTY4_y3X_2fK_2bR38o.mp3" type="audio/mpeg">
    </audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let scene, camera, renderer, clock, falcon, deathStar, starField, music, ytPlayer;
let lasers = [], drones = [], enemyLasers = [], cores = [];
let state = { 
    level: 1, kills: 0, lvlKills: 0, health: 100, 
    speed: 6000, shake: 0, phase: 'SWARM', active: false 
};
let mouse = { x: 0, y: 0 };
const vids = { 10:'D5iEO8n6I3w', 20:'lsAEdblcqU4', 30:'Xkm9h0S4wr8', 40:'d3nuk8UI76M', 50:'n3DHDXAzoBA' };

function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('vid-frame', {
        height: '100%', width: '100%',
        events: { 'onStateChange': (e) => { if(e.data === YT.PlayerState.ENDED) skipClip(); } }
    });
}

function bootSystem() {
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    music = document.getElementById('bg-music');
    music.volume = 0.5;
    music.play();
    init();
}

function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.00002);
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Starfield Warp
    const starGeo = new THREE.BufferGeometry();
    const pos = [];
    for(let i=0; i<15000; i++) pos.push((Math.random()-0.5)*200000, (Math.random()-0.5)*200000, (Math.random()-0.5)*400000);
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    starField = new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff, size:200}));
    scene.add(starField);

    // Millennium Falcon
    falcon = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(400, 400, 100, 32), new THREE.MeshStandardMaterial({color:0xaaaaaa, metalness:0.8}));
    body.rotation.x = Math.PI/2;
    falcon.add(body);
    scene.add(falcon);

    // Death Star (Ready for Boss phase)
    deathStar = new THREE.Mesh(new THREE.SphereGeometry(40000, 32, 32), new THREE.MeshStandardMaterial({color:0x222222}));
    deathStar.position.z = -150000;
    deathStar.visible = false;
    scene.add(deathStar);

    scene.add(new THREE.HemisphereLight(0x00ffff, 0x000000, 1));
    
    window.addEventListener('mousemove', e => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    document.getElementById('fire-btn').addEventListener('mousedown', shoot);
    
    state.active = true;
    clock = new THREE.Clock();
    spawnTies();
    animate();
}

function shoot() {
    const l = new THREE.Mesh(new THREE.BoxGeometry(40, 40, 2000), new THREE.MeshBasicMaterial({color:0x00ffff}));
    l.position.copy(falcon.position).z -= 500;
    scene.add(l);
    lasers.push(l);
}

function spawnTies() {
    for(let i=0; i<12; i++) {
        const tie = new THREE.Mesh(new THREE.BoxGeometry(800, 800, 800), new THREE.MeshPhongMaterial({color:0x444444}));
        resetTie(tie);
        scene.add(tie);
        drones.push(tie);
    }
}

function resetTie(tie) {
    tie.position.set((Math.random()-0.5)*60000, (Math.random()-0.5)*40000, falcon.position.z - (40000 + Math.random()*60000));
}

function animate() {
    requestAnimationFrame(animate);
    if(!state.active) return;
    const dt = clock.getDelta();

    // Movement & Hyperdrive FOV
    falcon.position.x = THREE.MathUtils.lerp(falcon.position.x, mouse.x * 30000, 0.1);
    falcon.position.y = THREE.MathUtils.lerp(falcon.position.y, mouse.y * 20000, 0.1);
    falcon.position.z -= state.speed * dt;
    
    camera.fov = THREE.MathUtils.lerp(camera.fov, 85 + (state.speed/2000), 0.05);
    camera.updateProjectionMatrix();
    camera.position.lerp(falcon.position.clone().add(new THREE.Vector3(0, 800, 3000)), 0.1);
    camera.lookAt(falcon.position.x, falcon.position.y, falcon.position.z - 5000);

    // Starfield Warp
    starField.position.z = falcon.position.z % 100000;

    // Combat Logic
    lasers.forEach((l, i) => {
        l.position.z -= 40000 * dt;
        if(l.position.distanceTo(falcon.position) > 100000) { scene.remove(l); lasers.splice(i,1); }
        
        drones.forEach(d => {
            if(l.position.distanceTo(d.position) < 2000) {
                state.kills++; state.lvlKills++;
                document.getElementById('cnt').innerText = state.kills;
                document.getElementById('lvl-kills').innerText = state.lvlKills;
                resetTie(d);
                state.shake = 5;
                if(state.kills >= 100 && state.phase === 'SWARM') startBoss();
            }
        });

        cores.forEach((c, ci) => {
            if(l.position.distanceTo(c.position) < 4000) {
                scene.remove(c); cores.splice(ci,1);
                if(cores.length === 0) levelUp();
            }
        });
    });

    drones.forEach(d => {
        if(d.position.z > falcon.position.z) resetTie(d);
    });

    if(state.shake > 0) {
        camera.position.x += (Math.random()-0.5)*state.shake;
        state.shake *= 0.9;
    }

    renderer.render(scene, camera);
}

function startBoss() {
    state.phase = 'BOSS';
    deathStar.visible = true;
    deathStar.position.z = falcon.position.z - 80000;
    drones.forEach(d => scene.remove(d)); drones = [];
    for(let i=0; i<state.level; i++) {
        const c = new THREE.Mesh(new THREE.SphereGeometry(1500), new THREE.MeshBasicMaterial({color:0xff0000}));
        c.position.set((Math.random()-0.5)*20000, (Math.random()-0.5)*20000, deathStar.position.z + 2000);
        scene.add(c);
        cores.push(c);
    }
}

function levelUp() {
    state.active = false;
    music.pause();
    if(vids[state.level]) {
        document.getElementById('video-container').style.display = 'block';
        ytPlayer.loadVideoById(vids[state.level]);
    } else {
        nextSector();
    }
}

function skipClip() {
    document.getElementById('video-container').style.display = 'none';
    ytPlayer.stopVideo();
    nextSector();
}

function nextSector() {
    state.level++; state.kills = 0; state.lvlKills = 0;
    state.phase = 'SWARM';
    deathStar.visible = false;
    document.getElementById('lvl').innerText = state.level;
    document.getElementById('cnt').innerText = "0";
    document.getElementById('lvl-kills').innerText = "0";
    spawnTies();
    music.play();
    state.active = true;
}
</script>
</body>
</html>
