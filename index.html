<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS v6.2 | WARP DRIVE – AEGIS SHIELD</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; }
        #yt-player { position: absolute; top: -1000px; }
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; color: #0ff; }
        #minimap { position: absolute; top: 20px; right: 20px; width: 180px; height: 180px; border: 2px solid #0ff; background: rgba(0,0,0,0.7); pointer-events: none; }
        .top-bar { display: flex; justify-content: space-between; padding: 15px; background: rgba(0,0,0,0.8); border-bottom: 2px solid #0ff; font-size: 1.1em; }
        #warp-overlay { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, transparent 30%, rgba(0,255,255,0.18) 100%); display: none; z-index: 5; }
        #fire-btn { position: absolute; bottom: 40px; right: 40px; width: 100px; height: 100px; background: rgba(255,0,255,0.2); border: 4px solid #f0f; border-radius: 50%; pointer-events: auto; display: flex; align-items: center; justify-content: center; color: #f0f; font-weight: bold; font-size: 18px; }
        #js-base { position: absolute; width: 140px; height: 140px; border: 3px solid #0ff; background: rgba(0,255,255,0.1); border-radius: 50%; display: none; pointer-events: none; }
        #js-knob { position: absolute; width: 60px; height: 60px; background: #0ff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 25px #0ff; }
        .screen { position: absolute; inset: 0; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        button { padding: 20px 50px; background: #0ff; border: none; font-weight: bold; cursor: pointer; font-size: 24px; box-shadow: 0 0 30px #0ff; }
        #multiplier-tag { font-size: 22px; color: #f0f; text-shadow: 0 0 10px #f0f; display: none; }
        #shield-status { font-size: 18px; color: #00ffff; text-shadow: 0 0 8px #00ffff; display: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<div id="yt-player"></div>
<div id="warp-overlay"></div>

<div id="menu-screen" class="screen">
    <h1 style="color:#0ff; letter-spacing: 15px;">ARTEMIS OS v6.2</h1>
    <p style="color:#f0f;">WARP DRIVE | AEGIS SHIELD | GRID SAFE</p>
    <button onclick="bootSystem()">INITIATE NEURAL LINK</button>
</div>

<div id="hud">
    <div class="top-bar">
        <div>SCORE: <span id="score-val">0</span> <span id="multiplier-tag">WARP X2</span> <span id="shield-status">AEGIS ACTIVE</span></div>
        <div id="boss-alert" style="color:red; display:none; animation: blink 0.3s infinite;">BOSS ACTIVE</div>
        <div>LIVES: <span id="lives-val">3</span></div>
    </div>
    <canvas id="minimap"></canvas>
    <div id="fire-btn">FIRE</div>
    <div id="js-base"><div id="js-knob"></div></div>
</div>

<script>
    let scene, camera, renderer, clock = new THREE.Clock(), ytPlayer, minimapCtx;
    let player, engineTrail, worldObjs = [], lasers = [], bosses = [], drones = [];
    let state = {
        speed: 5000,
        baseSpeed: 5000,
        warpMode: false,
        score: 0,
        multiplier: 1,
        lastTap: 0,
        shieldCharge: 0,
        isShielded: false,
        shake: 0,
        prevWarp: false
    };
    let joy = { active: false, x: 0, y: 0, sx: 0, sy: 0 };
    let gameState = 'menu', bossActive = false;
    const SAFE_CORRIDOR = 12000;
    const BUILDING_LANES = [-16000, -8000, 8000, 16000];

    // YouTube (unchanged)
    const EXPLORATION_PL = 'PL7F37BB1A67E0238D';
    const BOSS_TRACK = 'wmin5WkOuPw';

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-player', {
            height: '0', width: '0',
            playerVars: { 'listType': 'playlist', 'list': EXPLORATION_PL },
            events: { 'onStateChange': (e) => { if(e.data === 1 && !bossActive) state.lastPlIndex = ytPlayer.getPlaylistIndex?.() || 0; }}
        });
    }

    function switchMusic(toBoss) {
        if (!ytPlayer) return;
        if (toBoss) ytPlayer.loadVideoById(BOSS_TRACK);
        else ytPlayer.loadPlaylist({ list: EXPLORATION_PL, index: state.lastPlIndex || 0 });
        ytPlayer.playVideo();
    }

    function bootSystem() {
        document.getElementById('menu-screen').style.display = 'none';
        ytPlayer?.playVideo();
        init();
    }

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x00050a);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 500000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0x00ffff, 0xff00ff, 2));

        player = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(200, 50, 400), new THREE.MeshPhongMaterial({color:0x222222}));
        engineTrail = new THREE.Mesh(new THREE.CylinderGeometry(40, 80, 500), new THREE.MeshBasicMaterial({color:0x00ffff, transparent:true, opacity:0.6}));
        engineTrail.rotation.x = Math.PI/2; engineTrail.position.z = 400;
        player.add(body, engineTrail);

        // === AEGIS SHIELD MESH ===
        const shieldGeo = new THREE.IcosahedronGeometry(450, 2);
        const shieldMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff, 
            wireframe: true, 
            transparent: true, 
            opacity: 0 
        });
        state.shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
        player.add(state.shieldMesh);

        scene.add(player);

        for(let i=0; i<30; i++) spawnChunk(i * -15000);
        setupControls();
        minimapCtx = document.getElementById('minimap').getContext('2d');
        gameState = 'playing';
        animate();
        setInterval(spawnBoss, 20000);
        setInterval(spawnDroneWave, 10000);
    }

    function spawnChunk(z) {
        const floor = new THREE.GridHelper(30000, 30, 0x00ffff, 0x002222);
        floor.position.set(0, -1000, z);
        scene.add(floor); worldObjs.push(floor);

        BUILDING_LANES.forEach(laneX => {
            if (Math.random() > 0.4) {
                const h = 5000 + Math.random()*15000;
                const b = new THREE.Mesh(new THREE.BoxGeometry(2000, h, 2000), new THREE.MeshPhongMaterial({color:0x050505}));
                b.position.set(laneX, h/2 - 1000, z + (Math.random()-0.5)*8000);
                scene.add(b); worldObjs.push(b);
            }
        });
    }

    function spawnBoss() { /* unchanged from previous */ 
        if (bossActive) return;
        bossActive = true;
        switchMusic(true);
        document.getElementById('boss-alert').style.display = 'block';
        setTimeout(() => document.getElementById('boss-alert').style.display = 'none', 5000);
        const boss = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 32), new THREE.MeshPhongMaterial({color:0xff0000, wireframe:true}));
        boss.position.set(0, 0, player.position.z - 30000);
        boss.hp = 20; scene.add(boss); bosses.push(boss);
    }

    function spawnDroneWave() { /* unchanged */ 
        for(let i=0; i<3; i++) {
            const drone = new THREE.Mesh(new THREE.OctahedronGeometry(600), new THREE.MeshPhongMaterial({color:0xff8800}));
            drone.position.set((Math.random()-0.5)*20000, (Math.random()-0.5)*8000, player.position.z - 25000);
            drone.hp = 4; scene.add(drone); drones.push(drone);
        }
    }

    function setupControls() {
        // (joystick + fire button logic unchanged from v6.1 – left for brevity)
        const input = document.getElementById('hud');
        const base = document.getElementById('js-base');
        const knob = document.getElementById('js-knob');
        const fireBtn = document.getElementById('fire-btn');

        // ... (touch joystick, fire double-tap, keyboard space – same as before)

        fireBtn.addEventListener('touchstart', e => {
            e.preventDefault();
            const now = Date.now();
            if (now - state.lastTap < 300) {
                state.multiplier = state.multiplier === 1 ? 2 : 1;
                document.getElementById('multiplier-tag').innerText = `WARP X${state.multiplier}`;
                document.getElementById('multiplier-tag').style.display = state.multiplier > 1 ? 'inline' : 'none';
            } else {
                shoot();
            }
            state.lastTap = now;
        });

        window.addEventListener('keydown', e => {
            if (e.code === 'Space') shoot();
        });
    }

    function shoot() {
        const offs = state.multiplier > 1 ? [-300, 0, 300] : [0];
        offs.forEach(x => {
            const l = new THREE.Mesh(new THREE.BoxGeometry(50, 50, 1000), new THREE.MeshBasicMaterial({color:0x00ffff}));
            l.position.copy(player.position).add(new THREE.Vector3(x, 0, -200));
            scene.add(l); lasers.push(l);
        });
        navigator.vibrate?.(30);
    }

    function handleWarpAndShield(dt) {
        // Warp Entry – Sonic Boom Shake
        if (state.warpMode && !state.prevWarp) {
            state.shake = 150;
        }
        state.prevWarp = state.warpMode;

        // Shield Charging (only in warp)
        if (state.warpMode && !state.isShielded) {
            state.shieldCharge = Math.min(1, state.shieldCharge + 0.05 * dt); // ~20s full charge
            if (state.shieldCharge >= 1) state.isShielded = true;
        }

        // Shield Visuals
        if (state.isShielded) {
            state.shieldMesh.material.opacity = 0.4 + Math.sin(Date.now() * 0.005) * 0.2;
            state.shieldMesh.rotation.y += dt * 2;
            document.getElementById('shield-status').style.display = 'inline';
        } else {
            state.shieldMesh.material.opacity = 0;
            document.getElementById('shield-status').style.display = 'none';
        }

        // Camera Shake (warp entry or shield impact)
        if (state.shake > 0.1) {
            camera.position.x += (Math.random() - 0.5) * state.shake;
            camera.position.y += (Math.random() - 0.5) * state.shake;
            state.shake *= 0.88;
        }
    }

    function checkCollisions() {
        // Example: building / enemy collision
        // In real game you'd use distance checks or raycasting
        // For demo: assume random chance or distance < threshold
        const collided = Math.random() < 0.002; // placeholder – replace with real logic

        if (collided) {
            if (state.isShielded) {
                state.isShielded = false;
                state.shieldCharge = 0;
                state.shake = 100;
                // Flash effect
                scene.background = new THREE.Color(0x00ffff);
                setTimeout(() => scene.background = new THREE.Color(0x00050a), 80);
                navigator.vibrate?.([50, 30, 50]);
            } else {
                // takeDamage() logic
                lives = Math.max(0, (lives || 3) - 1);
                document.getElementById('lives-val').innerText = lives;
                if (lives <= 0) gameState = 'gameover'; // add game over screen if desired
                state.shake = 80;
                navigator.vibrate?.(120);
            }
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        if (gameState !== 'playing') return;
        const dt = clock.getDelta();

        // Warp logic (unchanged)
        if (state.score > 5000 && !bossActive) {
            state.warpMode = true;
            state.speed = THREE.MathUtils.lerp(state.speed, 15000, 0.05);
            camera.fov = THREE.MathUtils.lerp(camera.fov, 110, 0.05);
            document.getElementById('warp-overlay').style.display = 'block';
            document.getElementById('multiplier-tag').style.display = 'inline';
        } else {
            state.warpMode = false;
            state.speed = THREE.MathUtils.lerp(state.speed, state.baseSpeed, 0.1);
            camera.fov = THREE.MathUtils.lerp(camera.fov, 75, 0.1);
            document.getElementById('warp-overlay').style.display = 'none';
        }
        camera.updateProjectionMatrix();

        // Forward flight + control input
        const inputX = joy.x * 1.2;
        const inputY = joy.y * 0.8;
        player.position.x += inputX * 8000 * dt;
        player.position.y += inputY * 4000 * dt;
        player.position.z -= state.speed * dt;

        state.score += state.speed * dt * 0.1 * state.multiplier;
        document.getElementById('score-val').innerText = Math.floor(state.score);

        camera.position.lerp(player.position.clone().add(new THREE.Vector3(0, 1500, 5000)), 0.1);
        camera.lookAt(player.position.x, player.position.y, player.position.z - 2000);

        handleWarpAndShield(dt);
        checkCollisions(); // replace with your real collision detection

        // ... (lasers, enemies, minimap, recycle, render calls – unchanged)

        renderer.render(scene, camera);
    }
</script>
</body>
</html>
