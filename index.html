<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS | DEFINITIVE BUILD</title>
    <style>
        body { margin:0; overflow:hidden; background:#000; font-family:'Courier New',monospace; touch-action:none; color:#0ff; }
        #hud { position:absolute; inset:0; pointer-events:none; z-index:20; display:none; }
        .top-bar { display:flex; justify-content:space-between; padding:15px; background:rgba(0,0,0,0.8); border-bottom:1px solid #0ff; font-size:1.1em; }
        .btn-container { position:absolute; bottom:40px; width:100%; display:flex; justify-content:space-around; pointer-events:none; }
        .ctrl-btn { width:100px; height:100px; border-radius:50%; pointer-events:auto; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:bold; cursor:pointer; font-size:12px; border:4px solid; }
        #seeker-btn { color:#f00; border-color:#f00; background:rgba(255,0,0,0.1); }
        #fire-btn { color:#0ff; border-color:#0ff; background:rgba(0,255,255,0.1); }
        #video-container { position:absolute; inset:0; background:#000; display:none; z-index:2000; }
        .screen { position:absolute; inset:0; background:#000; z-index:5000; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        #pal-img { width: 220px; border-radius: 50%; border: 3px solid #f00; box-shadow: 0 0 20px #f00; margin-bottom: 20px; }
        .start-btn { padding:20px 50px; background:#0ff; color:#000; border:none; font-weight:bold; font-size:20px; cursor:pointer; margin-top:10px; }
    </style>
</head>
<body>

    <div id="landing-1" class="screen">
        <img id="pal-img" src="https://i.imgur.com/kP5h1oE.jpg">
        <h1 style="color:#f00;">UNLIMITED POWER</h1>
        <button class="start-btn" onclick="engageProtocol()">ENGAGE PROTOCOL</button>
    </div>

    <div id="landing-2" class="screen" style="display:none;">
        <h2 style="color:#0ff;">SYSTEMS READY</h2>
        <button class="start-btn" onclick="bootSystem()">ENTER COCKPIT</button>
    </div>

    <div id="hud">
        <div class="top-bar">
            <div>SHIELD: <span id="shd">100</span>% | COMBO: <span id="combo">0</span></div>
            <div>SCORE: <span id="score">0</span></div>
        </div>
        <div class="btn-container">
            <div id="seeker-btn" class="ctrl-btn">SEEKER<br><small>Ready...</small></div>
            <div id="fire-btn" class="ctrl-btn">FIRE</div>
        </div>
    </div>

    <div id="video-container">
        <div id="vid-frame" style="width:100%; height:100%;"></div>
        <button style="position:absolute; bottom:40px; right:40px;" onclick="skipClip()">SKIP</button>
    </div>

    <audio id="bg-music" loop><source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Star+Wars+Main+Theme&filename=mt/MTI0Nzk2NDgxMjQ3OTY4_y3X_2fK_2bR38o.mp3" type="audio/mpeg"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let scene, camera, renderer, clock, falcon, deathStar, starField, music, ytPlayer, grid;
let lasers = [], drones = [], cores = [];
let state = { level: 1, score: 0, combo: 0, health: 100, speed: 9000, shake: 0, active: false };
let mouse = { x: 0, y: 0 };

function engageProtocol() {
    document.getElementById('landing-1').style.display = 'none';
    document.getElementById('landing-2').style.display = 'flex';
    music = document.getElementById('bg-music');
    music.play().catch(() => {});
}

function bootSystem() {
    document.getElementById('landing-2').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    init();
}

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Neon Grid Floor
    const gridHelper = new THREE.GridHelper(500000, 100, 0x00ffff, 0x004444);
    gridHelper.position.y = -5000;
    scene.add(gridHelper);
    grid = gridHelper;

    // Pillars (Buildings)
    for(let i=0; i<40; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(2000, 20000, 2000), new THREE.MeshStandardMaterial({color:0x111111}));
        p.position.set((Math.random()-0.5)*100000, 5000, -Math.random()*400000);
        scene.add(p);
    }

    // Starfield & Lights
    const starGeo = new THREE.BufferGeometry();
    const pos = [];
    for(let i=0; i<10000; i++) pos.push((Math.random()-0.5)*400000, (Math.random()-0.5)*400000, (Math.random()-0.5)*400000);
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff, size:200})));
    scene.add(new THREE.HemisphereLight(0x00ffff, 0x000000, 1));

    // Player
    falcon = new THREE.Group();
    falcon.add(new THREE.Mesh(new THREE.CylinderGeometry(500,500,100,32), new THREE.MeshStandardMaterial({color:0x888888})));
    scene.add(falcon);

    window.addEventListener('mousemove', e => { mouse.x = (e.clientX/window.innerWidth)*2-1; mouse.y = -(e.clientY/window.innerHeight)*2+1; });
    document.getElementById('fire-btn').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    
    state.active = true;
    clock = new THREE.Clock();
    spawnTies();
    animate();
}

function shoot() {
    const l = new THREE.Mesh(new THREE.BoxGeometry(40,40,3000), new THREE.MeshBasicMaterial({color:0x00ffff}));
    l.position.copy(falcon.position).z -= 1000;
    scene.add(l);
    lasers.push(l);
}

function spawnTies() {
    for(let i=0; i<15; i++) {
        const tie = new THREE.Mesh(new THREE.BoxGeometry(1500,1500,1500), new THREE.MeshPhongMaterial({color:0x333333}));
        resetTie(tie);
        scene.add(tie);
        drones.push(tie);
    }
}

function resetTie(tie) {
    tie.position.set((Math.random()-0.5)*80000, (Math.random()-0.5)*40000, falcon.position.z - (70000 + Math.random()*80000));
}

function animate() {
    requestAnimationFrame(animate);
    if(!state.active) return;
    const dt = clock.getDelta();

    falcon.position.x = THREE.MathUtils.lerp(falcon.position.x, mouse.x * 40000, 0.1);
    falcon.position.y = THREE.MathUtils.lerp(falcon.position.y, mouse.y * 30000, 0.1);
    falcon.position.z -= state.speed * dt;
    grid.position.z = falcon.position.z; // Follow player

    camera.position.lerp(falcon.position.clone().add(new THREE.Vector3(0, 1500, 5000)), 0.1);
    camera.lookAt(falcon.position.x, falcon.position.y, falcon.position.z - 10000);

    lasers.forEach((l, i) => {
        l.position.z -= 70000 * dt;
        if(l.position.distanceTo(falcon.position) > 150000) { scene.remove(l); lasers.splice(i,1); }
        drones.forEach(d => {
            if(l.position.distanceTo(d.position) < 5000) {
                state.score += 150; state.combo++;
                document.getElementById('score').innerText = state.score;
                document.getElementById('combo').innerText = state.combo;
                resetTie(d);
            }
        });
    });

    if(state.shake > 0) {
        camera.position.x += (Math.random()-0.5)*state.shake;
        state.shake *= 0.9;
    }

    renderer.render(scene, camera);
}
</script>
</body>
</html>
