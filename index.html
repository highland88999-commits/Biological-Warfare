<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Biological Warfare | Artemis Prime</title>
    <style>
        :root { --blue: #00f2ff; --gold: #d4af37; --red: #ff2d55; --green: #39ff14; --bg: #050505; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; touch-action:none; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; overflow:hidden; }
        
        /* UI OVERLAYS */
        #hud { position: fixed; top: 20px; width: 100%; display: flex; justify-content: space-around; z-index: 100; pointer-events: none; }
        .stat-box { background: rgba(0,0,0,0.7); border: 1px solid var(--blue); padding: 5px 15px; border-radius: 5px; text-align: center; }
        .stat-label { font-size: 10px; color: var(--gold); text-transform: uppercase; }
        .stat-val { font-size: 18px; font-weight: bold; font-family: monospace; }

        /* UPGRADE NOTIFICATION */
        #level-up { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--gold); font-size: 2rem; display: none; z-index: 200; text-shadow: 0 0 20px var(--gold); }

        /* DEPLOYMENT ZONE */
        #cannon {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--gold);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, rgba(0,0,0,0.8) 70%);
            box-shadow: 0 0 20px rgba(212,175,55,0.4); z-index: 100; cursor: pointer;
        }
        #cooldown-overlay { position: absolute; bottom: 0; width: 100%; background: rgba(212,175,55,0.3); height: 0%; transition: 0.1s; border-radius: 0 0 50% 50%; }

        /* CELLS */
        .cell { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; pointer-events: none; }
        .cell::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid inherit; opacity: 0.3; }
        .blue { border: 2px solid var(--blue); box-shadow: 0 0 15px var(--blue); color: var(--blue); }
        .red { border: 2px solid var(--red); box-shadow: 0 0 15px var(--red); color: var(--red); }
        .green { border: 2px solid var(--green); box-shadow: 0 0 15px var(--green); color: var(--green); }
    </style>
</head>
<body>

    <div id="hud">
        <div class="stat-box"><div class="stat-label">Stability</div><div id="stability" class="stat-val">100%</div></div>
        <div class="stat-box"><div class="stat-label">Level</div><div id="lvl" class="stat-val">1</div></div>
        <div class="stat-box" style="border-color: var(--gold);"><div class="stat-label">Best</div><div id="best" class="stat-val">0</div></div>
    </div>

    <div id="level-up">UPGRADED!</div>

    <div id="cannon" onpointerdown="triggerDeploy()">
        <div id="cooldown-overlay"></div>
        <span style="font-size: 10px; color: var(--gold);">DEPLOY</span>
    </div>

    <div id="arena"></div>

    <script>
        // Game State
        let state = {
            stability: 100, level: 1, best: localStorage.getItem('bw_best') || 1,
            entities: [], active: true, cd: 0, maxCD: 50,
            spawnRate: 2000, lastSpawn: 0
        };

        const arena = document.getElementById('arena');
        const levelUpEl = document.getElementById('level-up');

        class Cell {
            constructor(type) {
                this.type = type;
                this.hp = 100;
                this.x = (type === 'blue') ? window.innerWidth/2 : Math.random()*window.innerWidth;
                this.y = (type === 'blue') ? window.innerHeight - 150 : -50;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (type === 'blue') ? -4 : 2 + (state.level * 0.05); // Speed scales with level
                
                this.el = document.createElement('div');
                this.el.className = `cell ${type}`;
                this.el.style.width = this.el.style.height = `32px`;
                arena.appendChild(this.el);
            }

            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.x < 0 || this.x > window.innerWidth - 32) this.vx *= -1;

                // Simple Combat Collision
                state.entities.forEach(other => {
                    if (other.type !== this.type) {
                        let d = Math.hypot(this.x - other.x, this.y - other.y);
                        if (d < 40) other.hp -= 1.5;
                    }
                });

                // Crossing the Line logic
                if (this.type === 'blue' && this.y < -40) {
                    this.hp = 0; scoreLevel(); 
                } else if (this.type !== 'blue' && this.y > window.innerHeight) {
                    this.hp = 0; state.stability -= 10; // Stability penalty
                }

                this.el.style.transform = `translate(${this.x}px,${this.y}px)`;
                this.el.innerText = Math.ceil(this.hp);
            }
        }

        function triggerDeploy() {
            if (state.cd <= 0) {
                state.entities.push(new Cell('blue'));
                state.cd = state.maxCD;
            }
        }

        function scoreLevel() {
            state.level++;
            if(state.level > state.best) {
                state.best = state.level;
                localStorage.setItem('bw_best', state.best);
            }
            levelUpEl.style.display = 'block';
            setTimeout(() => levelUpEl.style.display = 'none', 1000);
            // Dynamic Difficulty Adjustment
            state.spawnRate = Math.max(500, 2000 - (state.level * 20));
        }

        function gameLoop(time) {
            if (!state.active) return;

            // Handle Cooldown
            if (state.cd > 0) {
                state.cd--;
                document.getElementById('cooldown-overlay').style.height = `${(state.cd/state.maxCD)*100}%`;
            }

            // Enemy Spawning
            if (time - state.lastSpawn > state.spawnRate) {
                state.entities.push(new Cell(Math.random() > 0.5 ? 'red' : 'green'));
                state.lastSpawn = time;
            }

            // Update Cells
            for(let i = state.entities.length - 1; i >= 0; i--) {
                let c = state.entities[i];
                c.update();
                if(c.hp <= 0) {
                    c.el.remove();
                    state.entities.splice(i, 1);
                }
            }

            // Update UI
            document.getElementById('stability').innerText = `${state.stability}%`;
            document.getElementById('lvl').innerText = state.level;
            document.getElementById('best').innerText = state.best;

            if (state.stability <= 0) {
                alert(`GAME OVER. RECREATING BIO-DENSITY. LEVEL REACHED: ${state.level}`);
                location.reload();
            } else {
                requestAnimationFrame(gameLoop);
            }
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
