<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Titan Siege: Interceptor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --blue: #00f2ff; --gold: #d4af37; --red: #ff2d55; --green: #39ff14; --bg: #000; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #fff; }
        
        /* HUD UI */
        #hud { position: fixed; top: 20px; width: 100%; display: flex; justify-content: space-around; z-index: 100; pointer-events: none; }
        .stat-box { background: rgba(0,0,0,0.8); border: 1px solid var(--blue); padding: 10px; border-radius: 5px; text-align: center; min-width: 120px; }
        
        /* Proximity Alarm */
        #proximity-alert { position: fixed; inset: 0; pointer-events: none; border: 0px solid var(--red); transition: border-width 0.2s; z-index: 40; }
        .danger-pulse { border-width: 20px !important; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

        /* Mini Map */
        #minimap { position: fixed; bottom: 20px; right: 20px; width: 150px; height: 150px; background: rgba(0,20,20,0.8); border: 2px solid var(--blue); border-radius: 50%; z-index: 100; overflow: hidden; }
        #map-center { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: var(--green); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 10px var(--green); }
        .map-dot { position: absolute; width: 4px; height: 4px; background: var(--red); border-radius: 50%; transform: translate(-50%, -50%); }

        /* Cannon & Cockpit */
        #cockpit { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; height: 250px; pointer-events: none; z-index: 50; display: flex; justify-content: center; align-items: flex-end; }
        #cannon { width: 100px; height: 180px; background: linear-gradient(to top, #111, #333); border: 4px solid var(--green); border-bottom: none; border-radius: 15px 15px 0 0; box-shadow: 0 0 30px var(--green); transition: transform 0.05s; }
        #cannon.recoil { transform: translateY(30px); }

        /* Controls */
        #joystick-zone { position: fixed; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(0,242,255,0.1); border-radius: 50%; z-index: 200; border: 2px solid var(--blue); }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; background: var(--blue); border-radius: 50%; transform: translate(-50%, -50%); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        .btn { padding: 20px 40px; margin-top: 20px; border: 2px solid var(--blue); background: none; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="proximity-alert"></div>
    <div id="hud">
        <div class="stat-box"><small>STABILITY</small><br><b id="stability">100%</b></div>
        <div class="stat-box"><small>MISSILES</small><br><b id="missile-status">READY</b></div>
    </div>

    <div id="minimap"><div id="map-center"></div></div>
    <div id="cockpit"><div id="cannon"></div></div>

    <div id="joystick-zone"><div id="joystick-stick"></div></div>

    <div id="start-menu" class="overlay">
        <h1 style="color:var(--blue)">ARTEMIS-OS V2</h1>
        <p>SYSTEM: BURST CANNON & SEEKER READY</p>
        <button class="btn" onclick="initGame()">ENGAGE</button>
    </div>

    <script>
let scene, camera, renderer, clock = new THREE.Clock();
let enemies = [], missiles = [], weatherSystem;
const state = {
    active: false, stability: 100, level: 1,
    joy: { x: 0, y: 0 },
    rotation: { y: 0, x: 0 },
    missileCD: 0
};

function initGame() {
    state.active = true;
    document.getElementById('start-menu').style.display = 'none';
    
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0002);
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 20000);
    
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    createWorld();
    setupControls();
    
    // Weapon Systems
    setInterval(burstFire, 1500); // Burst every 1.5s
    setInterval(launchSeeker, 3000); // Missile every 3s

    animate();
}

function createWorld() {
    scene.add(new THREE.GridHelper(20000, 40, 0xff00ff, 0x111111));
    scene.add(new THREE.AmbientLight(0x4040ff, 0.6));
    
    // Buildings
    for (let i = 0; i < 100; i++) {
        const h = 500 + Math.random() * 3000;
        const b = new THREE.Mesh(new THREE.BoxGeometry(400, h, 400), new THREE.MeshStandardMaterial({color: 0x050508}));
        b.position.set((Math.random()-0.5)*15000, h/2, (Math.random()-0.5)*15000);
        scene.add(b);
    }
}

class Missile {
    constructor(target) {
        this.target = target;
        this.mesh = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 40), new THREE.MeshBasicMaterial({color: 0xffff00}));
        this.mesh.position.copy(camera.position);
        this.mesh.rotation.copy(camera.rotation);
        scene.add(this.mesh);
        missiles.push(this);
    }
    update() {
        if (!this.target || !enemies.includes(this.target)) {
            this.mesh.translateZ(-30);
        } else {
            const dir = new THREE.Vector3().subVectors(this.target.mesh.position, this.mesh.position).normalize();
            this.mesh.position.add(dir.multiplyScalar(40));
            this.mesh.lookAt(this.target.mesh.position);
            if (this.mesh.position.distanceTo(this.target.mesh.position) < 100) {
                this.target.hp -= 200;
                this.destroy();
            }
        }
        if (this.mesh.position.length() > 10000) this.destroy();
    }
    destroy() { scene.remove(this.mesh); missiles = missiles.filter(m => m !== this); }
}

class Drone {
    constructor() {
        this.mesh = new THREE.Mesh(new THREE.SphereGeometry(60, 8, 8), new THREE.MeshBasicMaterial({color: 0xff2d55, wireframe: true}));
        const ang = Math.random() * Math.PI * 2;
        this.mesh.position.set(Math.cos(ang)*8000, 500 + Math.random()*1000, Math.sin(ang)*8000);
        this.hp = 100;
        this.mapDot = document.createElement('div');
        this.mapDot.className = 'map-dot';
        document.getElementById('minimap').appendChild(this.mapDot);
        scene.add(this.mesh);
        enemies.push(this);
    }
    update() {
        const dir = new THREE.Vector3().subVectors(camera.position, this.mesh.position).normalize();
        this.mesh.position.add(dir.multiplyScalar(20));
        
        // Map Logic
        const dx = (this.mesh.position.x - camera.position.x) / 100;
        const dz = (this.mesh.position.z - camera.position.z) / 100;
        this.mapDot.style.left = (75 + dx) + 'px';
        this.mapDot.style.top = (75 + dz) + 'px';

        const dist = this.mesh.position.distanceTo(camera.position);
        if (dist < 1500) document.getElementById('proximity-alert').classList.add('danger-pulse');
        if (dist < 200) { state.stability -= 5; this.destroy(); }
    }
    destroy() { 
        this.mapDot.remove(); scene.remove(this.mesh); 
        enemies = enemies.filter(e => e !== this); 
        document.getElementById('proximity-alert').classList.remove('danger-pulse');
    }
}

function burstFire() {
    if (!state.active) return;
    let shots = 0;
    const interval = setInterval(() => {
        document.getElementById('cannon').classList.add('recoil');
        setTimeout(() => document.getElementById('cannon').classList.remove('recoil'), 50);
        
        const ray = new THREE.Raycaster();
        ray.setFromCamera(new THREE.Vector2(0, -0.2), camera);
        const hits = ray.intersectObjects(enemies.map(e => e.mesh));
        if (hits.length > 0) {
            const e = enemies.find(en => en.mesh === hits[0].object);
            if (e) { e.hp -= 40; if(e.hp <= 0) e.destroy(); }
        }

        if (++shots >= 3) clearInterval(interval);
    }, 100);
}

function launchSeeker() {
    if (!state.active || enemies.length === 0) return;
    new Missile(enemies[0]);
}

function setupControls() {
    const jZone = document.getElementById('joystick-zone');
    const jStick = document.getElementById('joystick-stick');
    jZone.addEventListener('pointermove', e => {
        const rect = jZone.getBoundingClientRect();
        state.joy.x = (e.clientX - (rect.left + 50)) / 50;
        state.joy.y = (e.clientY - (rect.top + 50)) / 50;
        jStick.style.transform = `translate(calc(-50% + ${state.joy.x*25}px), calc(-50% + ${state.joy.y*25}px))`;
    });
    jZone.addEventListener('pointerup', () => { state.joy = {x:0, y:0}; jStick.style.transform = 'translate(-50%, -50%)'; });
}

function animate() {
    requestAnimationFrame(animate);
    state.rotation.y -= state.joy.x * 0.04;
    state.rotation.x = Math.max(-0.6, Math.min(0.6, state.rotation.x - state.joy.y * 0.03));
    camera.rotation.set(state.rotation.x, state.rotation.y, 0, 'YXZ');

    if (Math.random() < 0.04) new Drone();
    enemies.forEach(e => e.update());
    missiles.forEach(m => m.update());

    document.getElementById('stability').innerText = Math.max(0, state.stability) + "%";
    if (state.stability <= 0) location.reload();

    renderer.render(scene, camera);
}
    </script>
</body>
</html>
