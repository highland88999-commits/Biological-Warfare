<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Megacity OS - Flight Core</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --blue: #0ff; --gold: #d4af37; --red: #f0f; --green: #39ff14; --yellow: #ffff00; }
        body { margin: 0; overflow: hidden; background: #000; color: var(--blue); font-family: 'Courier New', monospace; }
        
        /* Tactical Overlay */
        #overlay { 
            position: absolute; top: 20px; left: 20px; z-index: 100; 
            border-left: 2px solid var(--blue); padding: 15px; background: rgba(0,0,0,0.85); 
            text-transform: uppercase; letter-spacing: 1px; pointer-events: none;
        }
        .stat { color: var(--red); font-weight: bold; text-shadow: 0 0 5px var(--red); }

        /* Weapon Dock */
        #weapon-dock { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 500; }
        .w-btn { width: 65px; height: 65px; border: 1px solid #444; background: rgba(0,0,0,0.9); border-radius: 5px; color: #666; font-size: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .w-btn.active { border-color: var(--blue); color: var(--blue); box-shadow: 0 0 10px var(--blue); }

        /* Flight Controls */
        #joystick-zone { position: fixed; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(0,255,255,0.05); border: 1px solid var(--blue); border-radius: 50%; z-index: 200; }
        #joystick-stick { position: absolute; top: 50%; left: 50%; width: 35px; height: 35px; background: var(--blue); border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.5; }

        #minimap { position: fixed; bottom: 20px; right: 20px; width: 120px; height: 120px; background: rgba(0,0,0,0.8); border: 1px solid var(--blue); border-radius: 50%; z-index: 100; overflow: hidden; }
        .dot { position: absolute; width: 4px; height: 4px; border-radius: 50%; transform: translate(-50%, -50%); }
    </style>
</head>
<body>

    <div id="overlay">
        <span style="font-size: 1.2em; border-bottom: 1px solid var(--blue);">MEGACITY FLIGHT OS</span><br>
        HULL: <span id="hull-status" class="stat">100%</span><br>
        ALT: <span id="alt-status" class="stat">0m</span><br>
        MODE: <span id="mode-status" class="stat">STD</span>
    </div>

    <div id="weapon-dock">
        <div class="w-btn active" id="w-std" onclick="setWeapon('std')">STD</div>
        <div class="w-btn" id="w-burst" onclick="setWeapon('burst')">BURST</div>
        <div class="w-btn" id="w-msl" onclick="setWeapon('msl')">MSL</div>
    </div>

    <div id="minimap"><div class="dot" style="background:var(--green); left:50%; top:50%;"></div></div>
    <div id="joystick-zone"><div id="joystick-stick"></div></div>

<script>
let scene, camera, renderer, clock = new THREE.Clock();
let ship, buildings = [], enemies = [], projectiles = [], weatherSystem;
const state = { 
    active: true, hull: 100, joy: { x: 0, y: 0 }, 
    weapon: 'std', fireTimer: 0, speed: 25 
};

function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0001);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 30000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x4040ff, 0.5));
    const sun = new THREE.PointLight(0xffffff, 1, 20000);
    sun.position.set(5000, 5000, 5000);
    scene.add(sun);

    createShip();
    createEnvironment();
    setupControls();
    animate();
}

function createShip() {
    ship = new THREE.Group();
    // Cockpit/Body
    const body = new THREE.Mesh(new THREE.BoxGeometry(20, 10, 50), new THREE.MeshStandardMaterial({color: 0x111111}));
    const wings = new THREE.Mesh(new THREE.BoxGeometry(60, 2, 20), new THREE.MeshStandardMaterial({color: 0x222222}));
    ship.add(body, wings);
    ship.position.set(0, 1000, 2000);
    scene.add(ship);
    
    // Add collision box helper
    ship.userData.box = new THREE.Box3().setFromObject(ship);
}

function createEnvironment() {
    // Grid
    scene.add(new THREE.GridHelper(20000, 40, 0xff00ff, 0x222222));

    // Buildings (The "Un-pass-through-able" structures)
    for (let i = 0; i < 200; i++) {
        const h = 500 + Math.random() * 2500;
        const bGeo = new THREE.BoxGeometry(200, h, 200);
        const bMat = new THREE.MeshStandardMaterial({ color: 0x050508 });
        const b = new THREE.Mesh(bGeo, bMat);
        
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(bGeo), new THREE.LineBasicMaterial({ color: 0x00ffff, opacity: 0.3, transparent: true }));
        b.add(edges);

        let x = (Math.random() - 0.5) * 15000;
        let z = (Math.random() - 0.5) * 15000;
        if (Math.abs(x) < 500 && Math.abs(z) < 500) x += 1000;
        b.position.set(x, h/2, z);
        
        // Store bounding box for physics
        b.userData.box = new THREE.Box3().setFromObject(b);
        scene.add(b);
        buildings.push(b);
    }

    // Weather
    const wGeo = new THREE.BufferGeometry();
    const wPos = new Float32Array(5000 * 3);
    for(let i=0; i<wPos.length; i++) wPos[i] = (Math.random()-0.5) * 15000;
    wGeo.setAttribute('position', new THREE.BufferAttribute(wPos, 3));
    weatherSystem = new THREE.Points(wGeo, new THREE.PointsMaterial({color: 0xffffff, size: 3, transparent: true, opacity: 0.5}));
    scene.add(weatherSystem);
}

function setWeapon(m) {
    state.weapon = m;
    document.querySelectorAll('.w-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('w-'+m).classList.add('active');
    document.getElementById('mode-status').innerText = m.toUpperCase();
}

class Projectile {
    constructor(type, offset = new THREE.Vector3()) {
        this.type = type;
        const color = type === 'burst' ? 0x39ff14 : 0xffff00;
        this.mesh = new THREE.Mesh(new THREE.BoxGeometry(type === 'msl' ? 5 : 2, 2, 30), new THREE.MeshBasicMaterial({color: color}));
        this.mesh.position.copy(ship.position).add(offset.applyQuaternion(ship.quaternion));
        this.mesh.quaternion.copy(ship.quaternion);
        scene.add(this.mesh);
        projectiles.push(this);
    }
    update() {
        this.mesh.translateZ(-60);
        if (this.mesh.position.distanceTo(ship.position) > 6000) this.destroy();
        enemies.forEach(e => {
            if (this.mesh.position.distanceTo(e.mesh.position) < 100) { e.hp -= 50; this.destroy(); }
        });
    }
    destroy() { scene.remove(this.mesh); projectiles = projectiles.filter(p => p !== this); }
}

function fireWeapons(dt) {
    state.fireTimer += dt;
    let rate = state.weapon === 'std' ? 0.15 : (state.weapon === 'burst' ? 0.4 : 0.7);
    if (state.fireTimer > rate) {
        state.fireTimer = 0;
        if (state.weapon === 'std') new Projectile('std');
        if (state.weapon === 'msl') new Projectile('msl');
        if (state.weapon === 'burst') {
            new Projectile('burst', new THREE.Vector3(-30, 0, 0));
            new Projectile('burst', new THREE.Vector3(0, 0, 0));
            new Projectile('burst', new THREE.Vector3(30, 0, 0));
        }
    }
}

function checkCollisions() {
    ship.userData.box.setFromObject(ship);
    buildings.forEach(b => {
        if (ship.userData.box.intersectsBox(b.userData.box)) {
            state.hull -= 0.5;
            // Physical bounce back
            const bounce = new THREE.Vector3().subVectors(ship.position, b.position).normalize();
            ship.position.add(bounce.multiplyScalar(30));
        }
    });
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    // Flight
    ship.rotateY(-state.joy.x * 0.04);
    ship.rotateX(-state.joy.y * 0.04);
    ship.rotation.z = -state.joy.x * 0.5;
    const dir = new THREE.Vector3(0,0,-1).applyQuaternion(ship.quaternion);
    ship.position.add(dir.multiplyScalar(state.speed));

    // Collision & Camera
    checkCollisions();
    const camTarget = ship.position.clone().add(new THREE.Vector3(0, 40, 150).applyQuaternion(ship.quaternion));
    camera.position.lerp(camTarget, 0.1);
    camera.lookAt(ship.position);

    // Systems
    fireWeapons(dt);
    projectiles.forEach(p => p.update());
    
    // UI
    document.getElementById('hull-status').innerText = Math.ceil(state.hull) + "%";
    document.getElementById('alt-status').innerText = Math.floor(ship.position.y) + "m";

    if (state.hull <= 0) { alert("CRITICAL FAILURE"); location.reload(); }
    renderer.render(scene, camera);
}

function setupControls() {
    const jz = document.getElementById('joystick-zone');
    const js = document.getElementById('joystick-stick');
    const handleMove = (e) => {
        const rect = jz.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        state.joy.x = (cx - (rect.left + 50)) / 50;
        state.joy.y = (cy - (rect.top + 50)) / 50;
        js.style.transform = `translate(calc(-50% + ${state.joy.x*25}px), calc(-50% + ${state.joy.y*25}px))`;
    };
    jz.addEventListener('pointermove', handleMove);
    jz.addEventListener('pointerup', () => { state.joy = {x:0, y:0}; js.style.transform = 'translate(-50%,-50%)'; });
}

init();
</script>
</body>
</html>
