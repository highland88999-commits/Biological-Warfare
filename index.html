<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS v9.5 | TOTAL WARFARE</title>
    <style>
        body { margin:0; overflow:hidden; background:#000; font-family:'Courier New',monospace; touch-action:none; color:#0ff; }
        #hud { position:absolute; inset:0; pointer-events:none; z-index:20; }
        .top-bar { display:flex; justify-content:space-between; padding:15px; background:rgba(0,0,0,0.8); border-bottom:2px solid #0ff; font-size:1.1em; }
        .ctrl-btn { position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center; justify-content:center; font-weight:bold; z-index:30; cursor:pointer;}
        #fire-btn { bottom:40px; right:40px; width:110px; height:110px; background:rgba(0,255,255,0.1); border:5px solid #0ff; color:#0ff; box-shadow: 0 0 20px #0ff; }
        #seeker-btn { bottom:40px; left:40px; width:90px; height:90px; background:rgba(255,0,0,0.1); border:5px solid #f00; color:#f00; box-shadow: 0 0 20px #f00;}
        .screen { position:absolute; inset:0; background:#000; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        button { padding:25px 60px; background:#0ff; color:#000; border:none; font-weight:bold; font-size:28px; cursor:pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="menu-screen" class="screen">
        <h1 style="letter-spacing:12px;">ARTEMIS v9.5</h1>
        <button onclick="bootSystem()">ENGAGE COMBAT</button>
    </div>
    <div id="hud" style="display:none;">
        <div class="top-bar">
            <div>SHIELD: <span id="shield-val">100</span>% | SCORE: <span id="score-val">0</span></div>
        </div>
        <div id="fire-btn" class="ctrl-btn">CANNON</div>
        <div id="seeker-btn" class="ctrl-btn">SEEKER</div>
    </div>

<script>
let scene, camera, renderer, clock, player;
let chunks = [], lasers = [], drones = [], missiles = [], items = [], particles = [], eLasers = [];
let state = { score: 0, speed: 7000, shield: 100, lastFire: 0, lastSeeker: 0, shake: 0 };
let joy = { active: false, x: 0, y: 0, sx: 0, sy: 0 };

function bootSystem() {
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    init();
}

function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000510, 0.00001);
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0x00ffff, 0xff00ff, 2));

    player = new THREE.Group();
    player.add(new THREE.Mesh(new THREE.BoxGeometry(400, 100, 600), new THREE.MeshStandardMaterial({color:0x00ffff})));
    scene.add(player);

    for(let i = 0; i < 15; i++) spawnChunk(i * -15000);
    setupControls();
    clock = new THREE.Clock();
    animate();
    setInterval(spawnDrone, 1500);
}

function spawnChunk(z) {
    const chunk = new THREE.Group();
    const grid = new THREE.GridHelper(50000, 10, 0x0044ff, 0x001133);
    grid.position.y = -1400;
    chunk.add(grid);
    for(let i=0; i<5; i++) {
        const h = 5000 + Math.random()*25000;
        const b = new THREE.Mesh(new THREE.BoxGeometry(4000, h, 4000), new THREE.MeshStandardMaterial({color:0x050505}));
        b.position.set((Math.random()-0.5)*40000, h/2 - 1400, (Math.random()-0.5)*15000);
        b.userData = { type: 'building' };
        chunk.add(b);
    }
    chunk.position.z = z;
    scene.add(chunk);
    chunks.push(chunk);
}

function spawnDrone() {
    const d = new THREE.Mesh(new THREE.OctahedronGeometry(900), new THREE.MeshPhongMaterial({color:0xff3300}));
    d.position.set((Math.random()-0.5)*30000, (Math.random()-0.5)*10000, player.position.z - 50000);
    d.userData = { offset: Math.random() * 10, lastShot: 0 };
    scene.add(d);
    drones.push(d);
}

function createExplosion(pos, isScrap) {
    for(let i=0; i<10; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(200,200,200), new THREE.MeshBasicMaterial({color:0xffaa00}));
        p.position.copy(pos);
        p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*20000, (Math.random()-0.5)*20000, (Math.random()-0.5)*20000), life: 0.8 };
        scene.add(p);
        particles.push(p);
    }
    if(isScrap) {
        const scrap = new THREE.Mesh(new THREE.IcosahedronGeometry(400), new THREE.MeshBasicMaterial({color:0x00ff00, wireframe:true}));
        scrap.position.copy(pos);
        scene.add(scrap);
        items.push(scrap);
    }
}

function shootCannon() {
    if (Date.now() - state.lastFire < 150) return;
    const l = new THREE.Mesh(new THREE.BoxGeometry(80, 80, 3000), new THREE.MeshBasicMaterial({color:0x00ffff}));
    l.position.copy(player.position);
    l.userData = { vel: new THREE.Vector3(0,0,-45000) };
    scene.add(l);
    lasers.push(l);
    state.lastFire = Date.now();
}

function shootSeeker() {
    if (Date.now() - state.lastSeeker < 1000) return;
    const m = new THREE.Mesh(new THREE.SphereGeometry(400), new THREE.MeshBasicMaterial({color:0xff0000}));
    m.position.copy(player.position);
    m.userData = { vel: new THREE.Vector3(0,0,-20000) };
    scene.add(m);
    missiles.push(m);
    state.lastSeeker = Date.now();
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    // Movement & Bounce
    player.position.x += joy.x * 25000 * dt;
    player.position.y += joy.y * 20000 * dt;
    player.position.z -= state.speed * dt;

    if (player.position.y < -1100) { player.position.y = -1000; state.shield -= 5; state.shake = 10; }
    if (Math.abs(player.position.x) > 25000) { player.position.x *= 0.9; state.shield -= 5; state.shake = 10; }

    // Drones: Move & Fire Back
    drones.forEach((d, i) => {
        d.position.x += Math.sin(clock.elapsedTime + d.userData.offset) * 100;
        d.position.y += Math.cos(clock.elapsedTime + d.userData.offset) * 50;
        if (Date.now() - d.userData.lastShot > 3000 && d.position.z < player.position.z) {
            const el = new THREE.Mesh(new THREE.SphereGeometry(300), new THREE.MeshBasicMaterial({color:0xff00ff}));
            el.position.copy(d.position);
            el.userData = { vel: new THREE.Vector3().subVectors(player.position, d.position).normalize().multiplyScalar(15000) };
            scene.add(el);
            eLasers.push(el);
            d.userData.lastShot = Date.now();
        }
    });

    // Collision: Player vs Enemy Fire
    eLasers.forEach((el, i) => {
        el.position.add(el.userData.vel.clone().multiplyScalar(dt));
        if(el.position.distanceTo(player.position) < 1000) {
            state.shield -= 15; state.shake = 15;
            scene.remove(el); eLasers.splice(i,1);
        }
    });

    // Collision: Player vs Scrap
    items.forEach((s, i) => {
        if(s.position.distanceTo(player.position) < 1500) {
            state.shield = Math.min(100, state.shield + 20);
            scene.remove(s); items.splice(i,1);
        }
    });

    // Projectile Loops
    [...lasers, ...missiles].forEach((p, i) => {
        if(p.geometry.type === 'SphereGeometry') { // Homing
            let target = drones[0];
            if(target) {
                let dir = new THREE.Vector3().subVectors(target.position, p.position).normalize();
                p.userData.vel.lerp(dir.multiplyScalar(30000), 0.1);
            }
        }
        p.position.add(p.userData.vel.clone().multiplyScalar(dt));
        drones.forEach((d, di) => {
            if(p.position.distanceTo(d.position) < 2500) {
                createExplosion(d.position, true);
                scene.remove(d); drones.splice(di,1);
                scene.remove(p); 
                if(p.geometry.type === 'SphereGeometry') missiles.splice(missiles.indexOf(p),1);
                else lasers.splice(lasers.indexOf(p),1);
                state.score += 5000;
            }
        });
    });

    // Recycling
    chunks.forEach(c => { if(c.position.z > player.position.z + 15000) c.position.z -= 15000 * chunks.length; });
    particles.forEach((p, i) => { 
        p.position.add(p.userData.vel.clone().multiplyScalar(dt)); 
        p.userData.life -= dt; 
        if(p.userData.life <= 0) { scene.remove(p); particles.splice(i,1); }
    });

    document.getElementById('score-val').innerText = Math.floor(state.score += state.speed*dt*0.1);
    document.getElementById('shield-val').innerText = Math.max(0, state.shield);
    
    camera.position.lerp(player.position.clone().add(new THREE.Vector3(0, 2000, 8000)), 0.1);
    camera.lookAt(player.position.x, player.position.y, player.position.z - 5000);
    if(state.shake > 0) { camera.position.x += (Math.random()-0.5)*state.shake; state.shake *= 0.9; }
    renderer.render(scene, camera);
}

function setupControls() {
    document.getElementById('fire-btn').addEventListener('touchstart', e => { e.preventDefault(); shootCannon(); });
    document.getElementById('seeker-btn').addEventListener('touchstart', e => { e.preventDefault(); shootSeeker(); });
    document.addEventListener('touchstart', e => { if(e.touches[0].clientX < window.innerWidth/2) { joy.active=true; joy.sx=e.touches[0].clientX; joy.sy=e.touches[0].clientY; } });
    document.addEventListener('touchmove', e => { if(!joy.active) return; joy.x = (e.touches[0].clientX-joy.sx)/80; joy.y = (joy.sy-e.touches[0].clientY)/80; });
    document.addEventListener('touchend', () => { joy.active=false; joy.x=joy.y=0; });
}
</script>
</body>
</html>
