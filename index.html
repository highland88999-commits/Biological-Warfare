<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>ASTRA • OLYMPUS PROTOCOL</title>
  <style>
    /* Global Styles and Reset */
    body,html {
      margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;
      font-family:'Courier New',monospace; touch-action:none; color:#0ff;
    }
    
    /* Background Video Container */
    #video-container {
      position:absolute; inset:0; z-index:100; opacity:0; transition:opacity 1.8s;
      pointer-events:none;
    }
    video { width:100vw; height:100vh; object-fit: cover; pointer-events:none; }

    /* UI Overlay and Landing Screens */
    .landing {
      position:absolute; inset:0; z-index:110; background:#000;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center;
    }
    .glitch {
      font-size:3.4rem; letter-spacing:14px; animation:pulse 1.8s infinite;
      text-shadow:0 0 16px #0ff;
    }
    button {
      margin-top:2rem; padding:1.2rem 3rem;
      background:rgba(0,255,255,0.12); border:2px solid #0ff; color:#0ff;
      font-size:1.3rem; font-family:inherit; cursor:pointer;
      box-shadow:0 0 12px #0ff; transition:0.2s;
    }
    button:hover { background:rgba(0,255,255,0.3); }
    button:active { background:#0ff; color:#000; transform:scale(0.96); }

    /* Heads-Up Display (HUD) */
    #hud { position:absolute; inset:0; pointer-events:none; z-index:30; display:none; }
    .top { 
      display:flex; justify-content:space-between; padding:12px 16px;
      background:rgba(0,0,0,0.75); border-bottom:2px solid #0ff; font-size:1.1rem;
    }
    #radar {
      position:absolute; top:70px; right:18px; width:110px; height:110px;
      border:2px solid #0ff; border-radius:50%; background:rgba(0,20,20,0.65);
    }
    #sweep {
      position:absolute; inset:0; border-radius:50%;
      background:conic-gradient(from 0deg, rgba(0,255,255,0.25) 0%, transparent 45%);
      animation:sweep 2.4s linear infinite;
    }
    @keyframes sweep { to { transform:rotate(360deg); } }
    @keyframes pulse { 50% { opacity: 0.8; text-shadow: 0 0 25px #0ff; } }

    .blip {
      position:absolute; width:5px; height:5px; background:#f00;
      border-radius:50%; box-shadow:0 0 6px #f00; transform:translate(-50%,-50%);
    }

    /* Weapon & Hyper Controls */
    #console {
      position:absolute; bottom:24px; right:24px; display:grid;
      grid-template-columns:repeat(2,1fr); gap:12px; pointer-events:auto;
    }
    .btn {
      width:86px; height:86px; border:2px solid #0ff; border-radius:12px;
      background:rgba(0,0,0,0.7); color:#0ff; font-size:0.9rem; font-weight:bold;
      display:flex; align-items:center; justify-content:center; cursor:pointer;
    }
    #hyper-btn { grid-column:span 2; height:48px; border-color:#fff; color:#fff; }

    /* Targeting Reticle */
    #crosshair {
      position:absolute; width:64px; height:64px; border:2px solid #f44;
      border-radius:8px; pointer-events:none; display:none; z-index:120;
      box-shadow:0 0 12px #f00;
    }
    #crosshair::before {
      content:'TARGET'; position:absolute; top:-24px; left:50%;
      transform:translateX(-50%); color:#f44; font-size:0.8rem; white-space:nowrap;
    }
    #fade { position:absolute; inset:0; background:#000; z-index:200; opacity:0; transition:opacity 1s; pointer-events: none;}
    
    /* Invisible Audio Host */
    #music-host { display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>

<div id="fade"></div>
<div id="music-host"></div>

<div id="screen1" class="landing">
  <h1 class="glitch">ASTRA</h1>
  <button onclick="step1()">ENABLE SYSTEMS</button>
</div>

<div id="screen2" class="landing" style="display:none; background:transparent;">
  <div id="video-container">
    <video id="bg-video" loop muted playsinline></video>
  </div>
  <div style="z-index:130;">
    <h1 class="glitch" style="font-size:2.4rem;">OLYMPUS PROTOCOL</h1>
    <button onclick="launchGame()">ENTER COCKPIT</button>
  </div>
</div>

<div id="hud">
  <div class="top">
    <div>LVL <span id="lvl">1</span>   SHIELD <span id="hp">10</span></div>
    <div id="phase">PHASE: SCANNING</div>
  </div>
  <div id="radar"><div id="sweep"></div><div id="blips"></div></div>
  <div id="console">
    <div id="hyper-btn" class="btn">HYPER</div>
    <div id="seeker-btn" class="btn">SEEKER</div>
    <div id="fire-btn"  class="btn">CANNON</div>
  </div>
  <div id="crosshair"></div>
</div>

<script>
// ==========================================
// ARTEMIS MEDIA INTEGRATION
// ==========================================
window.ArtemisMedia = {
    musicPlayer: null,
    setup: function() {
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        window.onYouTubeIframeAPIReady = () => {
            this.musicPlayer = new YT.Player('music-host', {
                videoId: 'qwMz1wgXokk',
                playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': 'qwMz1wgXokk', 'playsinline': 1 },
            });
        };
    },
    ignite: function(videoID) {
        const v = document.getElementById(videoID);
        v.src = "https://xo6u0xsindhyafqf.public.blob.vercel-storage.com/nexus_render%20%2811%29.webm";
        v.play().then(() => {
            v.style.opacity = "1";
        }).catch(err => console.log("Video Play Error:", err));

        if (this.musicPlayer && this.musicPlayer.playVideo) {
            this.musicPlayer.unMute();
            this.musicPlayer.playVideo();
        }
    }
};
ArtemisMedia.setup();

// ==========================================
// MENU / LANDING LOGIC
// ==========================================
function step1() {
  document.getElementById('screen1').style.display = 'none';
  document.getElementById('screen2').style.display = 'flex';
  document.getElementById('video-container').style.opacity = '1';
  ArtemisMedia.ignite('bg-video');
}

function launchGame() {
  document.getElementById('fade').style.opacity = '1';
  setTimeout(() => {
    document.getElementById('screen2').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('fade').style.opacity = '0';
    initThree();
  }, 1200);
}

// ==========================================
// THREE.JS CORE & KALEIDOSCOPE SHADER
// ==========================================
let scene, camera, renderer, clock;
let player, chunks = [], lasers = [], drones = [], missiles = [];
let kaleidoscopeMaterial;
let state = {
  level: 1, health: 10, maxHealth: 10,
  phase: "SWARM", kills: 0, killsNeeded: 80,
  lastDamage: 0, speed: 8000, hyperActive: false
};
const CHUNK_DEPTH = 22000;
const CHUNK_COUNT = 14;

function initThree() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000308, 0.000008);
  camera = new THREE.PerspectiveCamera(74, innerWidth/innerHeight, 0.1, 9000000);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xaaccff, 0x000022, 1.4));

  // KALEIDOSCOPE SCANNER BACKGROUND
  const kalGeo = new THREE.PlaneGeometry(3000000, 3000000);
  kaleidoscopeMaterial = new THREE.ShaderMaterial({
    uniforms: {
      time: { value: 0.0 },
      resolution: { value: new THREE.Vector2(innerWidth, innerHeight) }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float time;
      uniform vec2 resolution;
      varying vec2 vUv;
      
      void main() {
        // Normalize and adjust for aspect ratio
        vec2 uv = gl_FragCoord.xy / resolution.xy * 2.0 - 1.0;
        uv.x *= resolution.x / resolution.y;

        // Polar coordinates
        float radius = length(uv);
        float angle = atan(uv.y, uv.x);

        // Fold symmetry (8 segments)
        float segments = 8.0;
        float fold = 6.2831853 / segments;
        angle = mod(angle, fold);
        angle = abs(angle - fold / 2.0);

        // Convert back to cartesian
        vec2 kalUv = radius * vec2(cos(angle), sin(angle));

        // Scan/scroll movement
        kalUv.x += time * 0.15;
        kalUv.y -= time * 0.1;

        // Geometric pattern generation
        float pattern = sin(kalUv.x * 25.0) * cos(kalUv.y * 25.0);
        float scanner = sin(radius * 15.0 - time * 6.0) * 0.5 + 0.5;
        
        // Cyberpunk colors: Deep blue/cyan blends
        vec3 baseColor = vec3(0.0, 0.1, 0.2);
        vec3 glowColor = vec3(0.0, 0.8, 1.0) * scanner * 0.3;
        vec3 patternColor = vec3(0.0, 0.3, 0.6) * pattern;

        // Radial fade to black at edges
        float vignette = 1.0 - smoothstep(0.5, 1.5, radius);
        
        vec3 finalColor = (baseColor + glowColor + patternColor) * vignette;
        gl_FragColor = vec4(finalColor, 1.0);
      }
    `,
    depthWrite: false
  });

  const kaleidoscopeMesh = new THREE.Mesh(kalGeo, kaleidoscopeMaterial);
  kaleidoscopeMesh.position.z = -1500000; // Push far into the background
  scene.add(kaleidoscopeMesh);

  // Player Hull
  player = new THREE.Group();
  const hull = new THREE.Mesh(
    new THREE.CylinderGeometry(280,340,160,24),
    new THREE.MeshStandardMaterial({color:0x334455, metalness:0.9})
  );
  hull.rotation.x = Math.PI/2;
  player.add(hull);
  scene.add(player);

  // Initial Terrain Chunks
  for(let i=0;i<CHUNK_COUNT;i++) spawnChunk(i*-CHUNK_DEPTH);

  clock = new THREE.Clock();
  setupTouch();
  animate();
  setInterval(spawnDrone, 1400);
}

// ==========================================
// GAME MECHANICS
// ==========================================
function spawnChunk(zOff) {
  const c = new THREE.Group();
  const g = new THREE.GridHelper(180000, 30, 0x004488, 0x001122);
  g.position.y = -3800;
  c.add(g);
  c.position.z = zOff;
  scene.add(c);
  chunks.push(c);
}

function recycleChunks() {
  chunks.forEach(c => {
    if (c.position.z > player.position.z + CHUNK_DEPTH*1.5) {
      c.position.z -= CHUNK_DEPTH * CHUNK_COUNT;
    }
  });
}

function spawnDrone() {
  if (state.phase === 'BOSS') return;
  const d = new THREE.Mesh(
    new THREE.OctahedronGeometry(480),
    new THREE.MeshPhongMaterial({color:0xcc2200, emissive:0x440000})
  );
  d.position.set((Math.random()-0.5)*120000, (Math.random()-0.5)*70000, player.position.z - 180000);
  scene.add(d);
  drones.push(d);
}

function shoot(isSeeker=false) {
  const geo = isSeeker ? new THREE.SphereGeometry(320,8,8) : new THREE.BoxGeometry(140,140,3800);
  const mat = new THREE.MeshBasicMaterial({color: isSeeker ? 0xff3366 : 0x00ddff});
  const p = new THREE.Mesh(geo, mat);
  p.position.copy(player.position);
  p.userData = { seeker: isSeeker, target: isSeeker ? findNearest() : null };
  scene.add(p);
  if (isSeeker) missiles.push(p); else lasers.push(p);
}

function findNearest() {
  let closest = null, minD = 1e9;
  [...drones].forEach(d => {
    const dist = d.position.distanceTo(player.position);
    if (dist < minD) { minD = dist; closest = d; }
  });
  return closest;
}

// ==========================================
// RENDER LOOP
// ==========================================
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const elapsedTime = clock.getElapsedTime();

  // Update Shader Uniforms
  if (kaleidoscopeMaterial) {
    kaleidoscopeMaterial.uniforms.time.value = elapsedTime;
  }

  // Player Movement
  player.position.x += joy.x * 42000 * dt;
  player.position.y += joy.y * 34000 * dt;
  player.position.z -= state.speed * dt;

  player.position.y = THREE.MathUtils.clamp(player.position.y, -3000, 3000);
  player.position.x = THREE.MathUtils.clamp(player.position.x, -50000, 50000);

  recycleChunks();

  // Health Regen
  if (Date.now() - state.lastDamage > 5200 && state.health < state.maxHealth) {
    state.health = Math.min(state.maxHealth, state.health + 1);
    document.getElementById('hp').innerText = state.health;
  }

  // Laser Logic
  lasers.forEach((l,i) => {
    l.position.z -= 180000 * dt;
    if (l.position.z < player.position.z - 50000) { scene.remove(l); lasers.splice(i,1); }
  });

  updateRadar();
  updateCrosshair();
  renderer.render(scene, camera);
}

// ==========================================
// INPUT CONTROLS
// ==========================================
let joy = { active:false, x:0, y:0, sx:0, sy:0 };
function setupTouch() {
  const fire = document.getElementById('fire-btn');
  const seeker = document.getElementById('seeker-btn');
  const hyper = document.getElementById('hyper-btn');

  fire.ontouchstart = e=>{e.preventDefault(); shoot(false);};
  seeker.ontouchstart = e=>{e.preventDefault(); shoot(true);};
  hyper.ontouchstart = e=>{e.preventDefault(); triggerHyper();};

  document.addEventListener('touchstart', e=>{
    const t = e.touches[0];
    if (t.clientX < innerWidth/2) { joy.active = true; joy.sx = t.clientX; joy.sy = t.clientY; }
  });
  document.addEventListener('touchmove', e=>{
    if (!joy.active) return;
    const t = e.touches[0];
    joy.x = THREE.MathUtils.clamp((t.clientX - joy.sx)/90, -1, 1);
    joy.y = THREE.MathUtils.clamp(-(t.clientY - joy.sy)/90, -1, 1);
  });
  document.addEventListener('touchend', () => { joy.active = false; joy.x = joy.y = 0; });
}

function triggerHyper() {
  if (state.hyperActive) return;
  state.hyperActive = true;
  const old = state.speed;
  state.speed = 240000;
  document.getElementById('fade').style.background = '#fff';
  document.getElementById('fade').style.opacity = 0.4;
  setTimeout(() => {
    state.speed = old;
    state.hyperActive = false;
    document.getElementById('fade').style.opacity = 0;
  }, 1800);
}

// ==========================================
// HUD & WINDOW HANDLers
// ==========================================
function updateRadar() {
  const c = document.getElementById('blips');
  c.innerHTML = '';
  drones.forEach(d => {
    const dx = (d.position.x - player.position.x) / 1800;
    const dz = (d.position.z - player.position.z) / 1800;
    if (Math.abs(dx) > 60 || Math.abs(dz) > 60) return;
    const b = document.createElement('div');
    b.className = 'blip';
    b.style.left = (55 + dx) + 'px';
    b.style.top = (55 + dz) + 'px';
    c.appendChild(b);
  });
}

function updateCrosshair() {
  const ch = document.getElementById('crosshair');
  if (state.phase !== 'BOSS') { ch.style.display = 'none'; return; }
  ch.style.display = 'block';
  ch.style.left = 'calc(50% - 32px)';
  ch.style.top = 'calc(50% - 32px)';
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  
  // Update shader resolution to prevent stretching
  if (kaleidoscopeMaterial) {
      kaleidoscopeMaterial.uniforms.resolution.value.set(innerWidth, innerHeight);
  }
});
</script>
</body>
</html>
