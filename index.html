<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Falcon OS: Open World</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --blue: #0ff; --red: #f00; --gold: #ffd700; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; }
        #hud { position: absolute; top: 20px; left: 20px; z-index: 100; border-left: 2px solid var(--blue); padding: 10px; background: rgba(0,0,0,0.8); pointer-events: none; }
        .radar { color: var(--gold); font-weight: bold; }
        
        #joy-left-zone { position: absolute; top: 0; left: 0; width: 50%; height: 100%; z-index: 200; }
        #joy-left-container { position: absolute; width: 80px; height: 80px; border: 1px solid var(--blue); border-radius: 50%; display: none; pointer-events: none; transform: translate(-50%, -50%); }
        #joy-left-stick { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; background: var(--blue); border-radius: 50%; transform: translate(-50%, -50%); }
        
        #fire-btn { position: fixed; bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(255,0,0,0.2); border: 2px solid var(--red); border-radius: 50%; z-index: 500; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hud">
        SECTOR: <span class="radar" id="sector-coord">0, 0</span><br>
        HULL: <span id="hull" style="color:var(--blue)">100%</span><br>
        THREATS: <span id="threat-count" style="color:var(--red)">0</span>
    </div>

    <div id="joy-left-zone"><div id="joy-left-container"><div id="joy-left-stick"></div></div></div>
    <div id="fire-btn">FIRE</div>

<script>
let scene, camera, renderer, clock = new THREE.Clock();
let playerShip, buildings = [], enemies = [], projectiles = [];
const state = { hull: 100, joyL: { x: 0, y: 0, active: false }, speed: 50, sectorSize: 5000 };

function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0001);
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 50000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    const sun = new THREE.DirectionalLight(0x00ffff, 0.8);
    sun.position.set(1, 1, 1);
    scene.add(sun);

    createFalcon();
    setupControls();
    
    // Initial city chunk
    spawnSector(0, 0);
    
    animate();
}

function createFalcon() {
    playerShip = new THREE.Group();
    const silver = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 });
    const hull = new THREE.Mesh(new THREE.CylinderGeometry(15, 15, 4, 32), silver);
    const cockpit = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), silver);
    cockpit.position.set(18, 0, 8);
    playerShip.add(hull, cockpit);
    playerShip.position.set(0, 400, 0);
    scene.add(playerShip);
    playerShip.userData.box = new THREE.Box3();
}

function spawnSector(gridX, gridZ) {
    const group = new THREE.Group();
    for (let i = 0; i < 40; i++) {
        const h = 500 + Math.random() * 3000;
        const b = new THREE.Mesh(new THREE.BoxGeometry(200, h, 200), new THREE.MeshStandardMaterial({ color: 0x05050a }));
        b.position.set((Math.random()-0.5)*state.sectorSize, h/2, (Math.random()-0.5)*state.sectorSize);
        
        const frame = new THREE.LineSegments(new THREE.EdgesGeometry(b.geometry), new THREE.LineBasicMaterial({ color: 0x00f2ff, transparent: true, opacity: 0.3 }));
        b.add(frame);
        
        b.userData.box = new THREE.Box3();
        group.add(b);
        buildings.push(b);
    }
    group.position.set(gridX * state.sectorSize, 0, gridZ * state.sectorSize);
    scene.add(group);
}

function createTieFighter() {
    const tie = new THREE.Group();
    const black = new THREE.MeshStandardMaterial({ color: 0x0a0a0a });
    const ball = new THREE.Mesh(new THREE.SphereGeometry(5, 8, 8), black);
    const wings = new THREE.Mesh(new THREE.BoxGeometry(20, 15, 1), black);
    wings.rotation.y = Math.PI/2;
    tie.add(ball, wings);
    
    // Spawn in a ring around the player
    const angle = Math.random() * Math.PI * 2;
    const dist = 4000;
    tie.position.set(
        playerShip.position.x + Math.cos(angle) * dist,
        playerShip.position.y + (Math.random()-0.5)*500,
        playerShip.position.z + Math.sin(angle) * dist
    );
    
    scene.add(tie);
    enemies.push({ mesh: tie, hp: 100, lastFire: 0 });
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    // 1. Open World Infinite Logic
    const currentSectorX = Math.round(playerShip.position.x / state.sectorSize);
    const currentSectorZ = Math.round(playerShip.position.z / state.sectorSize);
    document.getElementById('sector-coord').innerText = `${currentSectorX}, ${currentSectorZ}`;

    // 2. Flight & Stability
    playerShip.rotateY(-state.joyL.x * 0.04);
    playerShip.rotation.x = THREE.MathUtils.lerp(playerShip.rotation.x, -state.joyL.y * 0.7, 0.05);
    playerShip.rotation.z = THREE.MathUtils.lerp(playerShip.rotation.z, -state.joyL.x * 0.7, 0.05);
    const pDir = new THREE.Vector3(0,0,1).applyQuaternion(playerShip.quaternion);
    playerShip.position.add(pDir.multiplyScalar(state.speed));

    // 3. Camera Chase
    const camOffset = new THREE.Vector3(0, 30, -120).applyQuaternion(playerShip.quaternion);
    camera.position.lerp(playerShip.position.clone().add(camOffset), 0.1);
    camera.lookAt(playerShip.position);

    // 4. Enemy Seek & Combat
    if (Math.random() < 0.01 && enemies.length < 8) createTieFighter();
    
    enemies.forEach((enemy, i) => {
        // Pursuit Logic
        const vectorToPlayer = new THREE.Vector3().subVectors(playerShip.position, enemy.mesh.position);
        enemy.mesh.lookAt(playerShip.position);
        
        // Only move if far away
        if (vectorToPlayer.length() > 400) {
            const eDir = new THREE.Vector3(0,0,1).applyQuaternion(enemy.mesh.quaternion);
            enemy.mesh.position.add(eDir.multiplyScalar(state.speed * 0.7));
        }

        // AI Firing
        enemy.lastFire += dt;
        if (enemy.lastFire > 2.5 && vectorToPlayer.length() < 2500) {
            fireLaser(enemy.mesh, 0xff0000, true);
            enemy.lastFire = 0;
        }
    });

    // 5. Projectile Physics
    projectiles.forEach((p, i) => {
        p.translateZ(100);
        if (p.position.distanceTo(playerShip.position) > 6000) { scene.remove(p); projectiles.splice(i, 1); }
        
        if (p.userData.isEnemy) {
            if (p.position.distanceTo(playerShip.position) < 25) { state.hull -= 10; scene.remove(p); projectiles.splice(i, 1); }
        } else {
            enemies.forEach((e, ei) => {
                if (p.position.distanceTo(e.mesh.position) < 30) {
                    scene.remove(e.mesh); enemies.splice(ei, 1);
                    scene.remove(p); projectiles.splice(i, 1);
                }
            });
        }
    });

    // Sector Management (Cleanup far buildings)
    if (buildings.length > 400) {
        const farB = buildings.shift();
        scene.remove(farB);
    }

    document.getElementById('hull').innerText = Math.ceil(state.hull) + "%";
    document.getElementById('threat-count').innerText = enemies.length;
    if (state.hull <= 0) location.reload();
    
    renderer.render(scene, camera);
}

function fireLaser(source, color, isEnemy) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 40), new THREE.MeshBasicMaterial({ color }));
    p.position.copy(source.position);
    p.quaternion.copy(source.quaternion);
    p.userData = { isEnemy };
    scene.add(p);
    projectiles.push(p);
}

function setupControls() {
    const lZone = document.getElementById('joy-left-zone');
    const lCont = document.getElementById('joy-left-container');
    const fBtn = document.getElementById('fire-btn');

    lZone.addEventListener('pointerdown', e => {
        state.joyL.active = true;
        lCont.style.display = 'block';
        lCont.style.left = e.clientX + 'px'; lCont.style.top = e.clientY + 'px';
        state.joyL.originX = e.clientX; state.joyL.originY = e.clientY;
    });

    window.addEventListener('pointermove', e => {
        if (!state.joyL.active) return;
        const dx = e.clientX - state.joyL.originX; const dy = e.clientY - state.joyL.originY;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40);
        const angle = Math.atan2(dy, dx);
        state.joyL.x = (Math.cos(angle) * dist) / 40;
        state.joyL.y = (Math.sin(angle) * dist) / 40;
        document.getElementById('joy-left-stick').style.transform = `translate(calc(-50% + ${state.joyL.x * 20}px), calc(-50% + ${state.joyL.y * 20}px))`;
    });

    window.addEventListener('pointerup', () => { state.joyL.active = false; lCont.style.display = 'none'; });
    fBtn.addEventListener('pointerdown', () => fireLaser(playerShip, 0x00ffff, false));
}

init();
</script>
</body>
</html>
