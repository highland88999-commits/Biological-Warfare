<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Biological Warfare</title>
    <style>
        :root { --blue: #00f2ff; --gold: #d4af37; --red: #ff2d55; --green: #39ff14; }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; touch-action:none; }
        body { background:#000; overflow:hidden; font-family: monospace; }

        #landing {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; text-align: center;
        }
        #landing h1 { color: var(--blue); font-size: 2.5rem; letter-spacing: 5px; margin-bottom: 20px; text-shadow: 0 0 20px var(--blue); }
        #landing p { color: var(--gold); animation: blink 2s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        #hud { display: none; position: fixed; top: 40px; width: 100%; text-align: center; color: var(--blue); z-index: 100; font-size: 1.2rem; text-shadow: 0 0 5px #000; }
        #cannon {
            position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%);
            width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--gold);
            z-index: 100; display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.8); color: var(--gold); font-weight: bold; font-size: 12px;
        }
        
        .cell { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #fff; z-index: 10; transition: border-width 0.1s; }
        .blue { border: 2px solid var(--blue); box-shadow: 0 0 10px var(--blue); }
        .red { border: 2px solid var(--red); box-shadow: 0 0 10px var(--red); }
        .green { border: 2px solid var(--green); box-shadow: 0 0 10px var(--green); }
    </style>
</head>
<body>

    <div id="landing" onclick="launch()">
        <h1>BIOLOGICAL WARFARE</h1>
        <p>TAP TO INITIALIZE DEPLOYMENT</p>
    </div>

    <div id="hud">STABILITY: <span id="xp">100</span>%</div>
    <div id="cannon" onpointerdown="spawnBlue()">DEPLOY</div>
    <div id="arena"></div>

    <script>
        let stability = 100, entities = [], active = false;
        const arena = document.getElementById('arena');

        function launch() {
            document.getElementById('landing').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('cannon').style.display = 'flex';
            active = true;
            spawnEnemy();
            gameLoop();
        }

        class Cell {
            constructor(type) {
                this.type = type;
                this.hp = 100;
                this.size = 32;
                this.x = (type === 'blue') ? window.innerWidth/2 : Math.random()*window.innerWidth;
                this.y = (type === 'blue') ? window.innerHeight - 150 : -50;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (type === 'blue') ? -3 : 2 + Math.random() * 3;
                
                this.el = document.createElement('div');
                this.el.className = `cell ${type}`;
                this.el.style.width = this.el.style.height = `${this.size}px`;
                arena.appendChild(this.el);
            }

            update() {
                // Movement
                this.x += this.vx;
                this.y += this.vy;
                if(this.x < 0 || this.x > window.innerWidth - this.size) this.vx *= -1;

                // Combat Logic: Find nearest enemy
                entities.forEach(other => {
                    if (other.type !== this.type) {
                        let dx = this.x - other.x;
                        let dy = this.y - other.y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 50) { // Attack Range
                            other.hp -= 0.5; // Damage per frame
                            this.el.style.borderWidth = '4px'; // Visual feedback
                        } else {
                            this.el.style.borderWidth = '2px';
                        }
                    }
                });

                // Scoring / Penalty Logic
                if (this.type === 'blue' && this.y < -30) {
                    penalty('enemy'); // You scored on them
                    this.hp = 0; 
                } else if ((this.type === 'red' || this.type === 'green') && this.y > window.innerHeight) {
                    penalty('player'); // They scored on you
                    this.hp = 0;
                }

                this.el.style.transform = `translate(${this.x}px,${this.y}px)`;
                this.el.innerText = Math.ceil(this.hp);
            }
        }

        function penalty(target) {
            if (target === 'player') stability -= 5;
            // Immediate deletion of 2 cells from the "scored on" team
            let count = 0;
            for (let i = entities.length - 1; i >= 0; i--) {
                if (count < 2 && ((target === 'player' && entities[i].type === 'blue') || 
                    (target === 'enemy' && (entities[i].type === 'red' || entities[i].type === 'green')))) {
                    entities[i].hp = 0;
                    count++;
                }
            }
        }

        function spawnBlue() { if(active) entities.push(new Cell('blue')); }
        
        function spawnEnemy() { 
            if(active) { 
                const type = Math.random() > 0.5 ? 'red' : 'green';
                entities.push(new Cell(type)); 
                setTimeout(spawnEnemy, 2000); 
            }
        }

        function gameLoop() {
            for(let i = entities.length - 1; i >= 0; i--) {
                let c = entities[i];
                c.update();
                if(c.hp <= 0) {
                    c.el.remove();
                    entities.splice(i, 1);
                }
            }
            document.getElementById('xp').innerText = stability;
            if (stability > 0) requestAnimationFrame(gameLoop);
            else alert("SYSTEM COLLAPSED - GAME OVER");
        }
    </script>
</body>
</html>
