<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ARTEMIS: GALACTIC COMMAND</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #0ff; }
        /* LANDING PAGE */
        #landing-page { position: absolute; width: 100vw; height: 100vh; background: black; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        #palpatine-img { width: 300px; border-radius: 50%; border: 4px solid #444; box-shadow: 0 0 30px #f00; margin-bottom: 20px; }
        #start-btn { padding: 20px 50px; font-size: 1.5rem; background: #222; color: #0ff; border: 2px solid #0ff; cursor: pointer; border-radius: 10px; }
        #start-btn:hover { background: #0ff; color: #000; }

        /* HUD */
        #hud { position: absolute; top: 0; width: 100%; padding: 20px; box-sizing: border-box; display: flex; justify-content: space-between; z-index: 100; pointer-events: none; }
        .hud-box { background: rgba(0, 40, 40, 0.8); padding: 10px 20px; border: 2px solid #0ff; border-radius: 5px; box-shadow: 0 0 10px #0ff; }
        
        /* VIDEO & OVERLAYS */
        #video-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; display: none; z-index: 1000; }
        #skip-btn { position: absolute; bottom: 40px; right: 40px; padding: 15px 30px; background: #0ff; color: #000; border: none; font-weight: bold; cursor: pointer; }
        #rapid-fire-btn { position: absolute; bottom: 20px; right: 20px; width: 100px; height: 100px; border-radius: 50%; background: rgba(0,255,255,0.2); border: 3px solid #0ff; color: #0ff; display: none; cursor: pointer; z-index: 500; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; z-index: 2000; background: rgba(0,0,0,0.9); padding: 50px; border: 5px solid #f00; }
    </style>
</head>
<body>

<div id="landing-page">
    <img id="palpatine-img" src="https://i.imgur.com/kP5h1oE.jpg" alt="Emperor Palpatine">
    <h1 style="color: #f00;">UNLIMITED POWER</h1>
    <p>Sector Command Awaiting Orders...</p>
    <button id="start-btn" onclick="startGame()">ENTER COCKPIT</button>
</div>

<div id="hud" style="display:none;">
    <div class="hud-box">SECTOR: <span id="lvl">1</span></div>
    <div class="hud-box">SHIELD: <span id="shd">100</span>%</div>
    <div class="hud-box">
        <span id="target-label">TIES</span>: <span id="cnt">0</span>/100<br>
        <small>LVL KILLS: <span id="lvl-kills">0</span></small>
    </div>
</div>

<button id="rapid-fire-btn" onclick="activateRapidFire()">RAPID FIRE</button>

<div id="game-over">
    <h1 style="color:red; font-size:3rem;">TRANSMISSION LOST</h1>
    <button onclick="respawn()" style="padding:15px 30px; cursor:pointer;">RESPAWN</button>
</div>

<div id="video-container">
    <div id="player"></div>
    <button id="skip-btn" onclick="skipClip()">SKIP TRANSMISSION</button>
</div>

<audio id="bg-music" loop>
    <source src="https://www.soundboard.com/handler/DownLoadTrack.ashx?cliptitle=Star+Wars+Main+Theme&filename=mt/MTI0Nzk2NDgxMjQ3OTY4_y3X_2fK_2bR38o.mp3" type="audio/mpeg">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
const state = {
    level: 1, health: 100, phase: 'SWARM', kills: 0, totalLvlKills: 0,
    isRapidFire: false, canRapidFire: true, lastDamage: Date.now()
};

const vids = { 10:'D5iEO8n6I3w', 20:'lsAEdblcqU4', 30:'Xkm9h0S4wr8', 40:'d3nuk8UI76M', 50:'n3DHDXAzoBA', 60:'ijTAJ-JRiac', 70:'9MDNJSv6Bpw', 80:'wXrwWnu7agk', 90:'8kpHK4YIwY4', 100:'ErjtFtRi9Xo' };

let scene, camera, renderer, falcon, deathStar, ytPlayer, starField, music;
let lasers = [], enemyLasers = [], drones = [], cores = [];
let gameActive = false;

function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('player', {
        height: '100%', width: '100%',
        events: { 'onStateChange': (e) => { if(e.data === YT.PlayerState.ENDED) skipClip(); } }
    });
}

function startGame() {
    document.getElementById('landing-page').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    music = document.getElementById('bg-music');
    music.play();
    initGame();
}

function initGame() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 2000000);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Starfield
    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for(let i=0; i<15000; i++) starCoords.push((Math.random()-0.5)*1000000, (Math.random()-0.5)*1000000, (Math.random()-0.5)*1000000);
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    starField = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 500}));
    scene.add(starField);

    createFalcon();
    createDeathStar();
    
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(5, 5, 5);
    scene.add(sun);

    window.addEventListener('mousemove', (e) => {
        if(!gameActive) return;
        falcon.position.x = (e.clientX - window.innerWidth/2) * 60;
        falcon.position.y = -(e.clientY - window.innerHeight/2) * 60;
        camera.lookAt(falcon.position.x, falcon.position.y, falcon.position.z - 100000);
    });

    window.addEventListener('mousedown', () => { if(gameActive) fireBlue(); });
    
    gameActive = true;
    spawnSwarm();
    animate();
}

function createFalcon() {
    falcon = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(1500, 1500, 400, 32), new THREE.MeshPhongMaterial({color: 0xcccccc}));
    body.rotation.x = Math.PI/2;
    falcon.add(body);
    scene.add(falcon);
}

function createDeathStar() {
    deathStar = new THREE.Mesh(new THREE.SphereGeometry(150000, 32, 32), new THREE.MeshPhongMaterial({color: 0x333333}));
    deathStar.position.z = -600000;
    scene.add(deathStar);
    deathStar.visible = false;
}

function fireBlue() {
    const l = new THREE.Mesh(new THREE.CylinderGeometry(80, 80, 4000), new THREE.MeshBasicMaterial({color: 0x00ffff}));
    l.position.copy(falcon.position);
    l.rotation.x = Math.PI/2;
    scene.add(l);
    lasers.push(l);
    if(state.isRapidFire) {
        setTimeout(() => {
            const l2 = l.clone(); scene.add(l2); lasers.push(l2);
        }, 100);
    }
}

function animate() {
    requestAnimationFrame(animate);
    if(!gameActive) return;

    starField.position.z += 3000;
    if(starField.position.z > 500000) starField.position.z = 0;

    // Laser Movement & Hit Detection
    lasers.forEach((l, i) => {
        l.position.z -= 18000;
        if(l.position.z < -800000) { scene.remove(l); lasers.splice(i, 1); }
        
        drones.forEach(t => {
            if(l.position.distanceTo(t.position) < 6000) {
                state.kills++;
                state.totalLvlKills++;
                document.getElementById('cnt').innerText = state.kills;
                document.getElementById('lvl-kills').innerText = state.totalLvlKills;
                t.position.z = -400000; // Reset TIE
                if(state.kills >= 100 && state.phase === 'SWARM') startBoss();
            }
        });

        cores.forEach((c, ci) => {
            if(l.position.distanceTo(c.position) < 8000) {
                scene.remove(c); cores.splice(ci, 1);
                if(cores.length === 0) levelUp();
            }
        });
    });

    // Enemy AI
    drones.forEach(t => {
        t.position.z += 2000;
        if(t.position.z > 20000) t.position.z = -400000;
    });

    renderer.render(scene, camera);
}

function spawnSwarm() {
    for(let i=0; i<12; i++) {
        const tie = new THREE.Mesh(new THREE.BoxGeometry(3000, 3000, 3000), new THREE.MeshPhongMaterial({color: 0x666666}));
        tie.position.set((Math.random()-0.5)*150000, (Math.random()-0.5)*150000, -300000 - Math.random()*200000);
        scene.add(tie);
        drones.push(tie);
    }
}

function startBoss() {
    state.phase = 'BOSS';
    deathStar.visible = true;
    drones.forEach(d => scene.remove(d)); drones = [];
    for(let i=0; i<state.level; i++) {
        const c = new THREE.Mesh(new THREE.SphereGeometry(4000), new THREE.MeshBasicMaterial({color: 0xff0000}));
        c.position.set((Math.random()-0.5)*120000, (Math.random()-0.5)*120000, deathStar.position.z + 10000);
        scene.add(c);
        cores.push(c);
    }
}

function levelUp() {
    gameActive = false;
    music.pause();
    if(vids[state.level]) {
        document.getElementById('video-container').style.display = 'block';
        ytPlayer.loadVideoById(vids[state.level]);
    } else {
        nextSector();
    }
}

function skipClip() {
    document.getElementById('video-container').style.display = 'none';
    ytPlayer.stopVideo();
    nextSector();
}

function nextSector() {
    state.level++;
    state.kills = 0;
    state.totalLvlKills = 0;
    state.phase = 'SWARM';
    deathStar.visible = false;
    document.getElementById('lvl').innerText = state.level;
    document.getElementById('cnt').innerText = "0";
    document.getElementById('lvl-kills').innerText = "0";
    if(state.level >= 50) document.getElementById('rapid-fire-btn').style.display = 'block';
    spawnSwarm();
    music.play();
    gameActive = true;
}

function activateRapidFire() {
    if(!state.canRapidFire) return;
    state.isRapidFire = true;
    state.canRapidFire = false;
    setTimeout(() => { state.isRapidFire = false; setTimeout(() => state.canRapidFire = true, 5000); }, 10000);
}

function respawn() {
    state.health = 100;
    document.getElementById('shd').innerText = "100";
    document.getElementById('game-over').style.display = 'none';
    gameActive = true;
}
</script>
</body>
</html>
