<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS v9.4 | THE FINISH LINE</title>
    <style>
        body { margin:0; overflow:hidden; background:#000; font-family:'Courier New',monospace; touch-action:none; color:#0ff; }
        #hud { position:absolute; inset:0; pointer-events:none; z-index:20; }
        .top-bar { display:flex; justify-content:space-between; padding:15px; background:rgba(0,0,0,0.8); border-bottom:2px solid #0ff; }
        .ctrl-btn { position:absolute; border-radius:50%; pointer-events:auto; display:flex; align-items:center; justify-content:center; font-weight:bold; z-index:30; cursor:pointer;}
        #fire-btn { bottom:40px; right:40px; width:110px; height:110px; background:rgba(0,255,255,0.1); border:5px solid #0ff; color:#0ff; box-shadow: 0 0 20px #0ff; }
        #seeker-btn { bottom:40px; left:40px; width:90px; height:90px; background:rgba(255,0,0,0.1); border:5px solid #f00; color:#f00; box-shadow: 0 0 20px #f00;}
        .screen { position:absolute; inset:0; background:#000; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
        button { padding:25px 60px; background:#0ff; color:#000; border:none; font-weight:bold; font-size:28px; cursor:pointer; }
        #fuel-wrap { width: 100px; height: 10px; border: 1px solid #f00; margin-top: 5px; background: #200; }
        #fuel-bar { width: 100%; height: 100%; background: #f00; transition: width 0.3s; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="menu-screen" class="screen">
        <h1 style="letter-spacing:12px;">ARTEMIS v9.4</h1>
        <button onclick="bootSystem()">FINALIZE ENGAGEMENT</button>
    </div>
    <div id="hud" style="display:none;">
        <div class="top-bar">
            <div>SHIELD: <span id="shield-val">100</span>% | SCORE: <span id="score-val">0</span></div>
            <div style="text-align:right;">SEEKER FUEL<div id="fuel-wrap"><div id="fuel-bar"></div></div></div>
        </div>
        <div id="fire-btn" class="ctrl-btn">FIRE</div>
        <div id="seeker-btn" class="ctrl-btn">SEEKER</div>
    </div>

<script>
let scene, camera, renderer, clock, player;
let chunks = [], lasers = [], drones = [], missiles = [], particles = [];
let state = { 
    score: 0, speed: 7000, seekerFuel: 1.0, 
    warpTime: 0, lastFire: 0, lastSeeker: 0 
};
let joy = { active: false, x: 0, y: 0, sx: 0, sy: 0 };

function bootSystem() {
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    init();
}

function init() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x00ffff, 0xff00ff, 2));

    player = new THREE.Group();
    player.add(new THREE.Mesh(new THREE.BoxGeometry(400, 100, 600), new THREE.MeshStandardMaterial({color:0x555555})));
    scene.add(player);

    for(let i = 0; i < 10; i++) spawnChunk(i * -20000);
    setupControls();
    clock = new THREE.Clock();
    animate();
    setInterval(spawnDrone, 1800);
}

function spawnChunk(z) {
    const chunk = new THREE.Group();
    const grid = new THREE.GridHelper(60000, 20, 0x0044ff, 0x001133);
    grid.position.y = -1400;
    chunk.add(grid);
    chunk.position.z = z;
    scene.add(chunk);
    chunks.push(chunk);
}

function spawnDrone() {
    const d = new THREE.Mesh(new THREE.SphereGeometry(800, 8, 8), new THREE.MeshPhongMaterial({color:0xff3300, wireframe:true}));
    d.position.set((Math.random()-0.5)*40000, (Math.random()-0.5)*15000, player.position.z - 60000);
    scene.add(d);
    drones.push(d);
}

function createExplosion(pos) {
    for(let i=0; i<15; i++) {
        const p = new THREE.Mesh(new THREE.BoxGeometry(200, 200, 200), new THREE.MeshBasicMaterial({color:0xffaa00}));
        p.position.copy(pos);
        p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*20000, (Math.random()-0.5)*20000, (Math.random()-0.5)*20000), life: 1.0 };
        scene.add(p);
        particles.push(p);
    }
}

function launchSeeker() {
    if (state.seekerFuel < 0.2 || Date.now() - state.lastSeeker < 800) return;
    const m = new THREE.Mesh(new THREE.BoxGeometry(300, 300, 800), new THREE.MeshBasicMaterial({color:0xff0000}));
    m.position.copy(player.position);
    m.userData = { vel: new THREE.Vector3(0, 0, -25000) };
    scene.add(m);
    missiles.push(m);
    state.seekerFuel -= 0.2;
    state.lastSeeker = Date.now();
    document.getElementById('fuel-bar').style.width = (state.seekerFuel * 100) + "%";
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    player.position.x += joy.x * 25000 * dt;
    player.position.y += joy.y * 20000 * dt;
    player.position.z -= state.speed * dt;

    // Seeker Fuel Regen
    state.seekerFuel = Math.min(1.0, state.seekerFuel + 0.05 * dt);
    document.getElementById('fuel-bar').style.width = (state.seekerFuel * 100) + "%";

    // Missile Logic
    for(let i=missiles.length-1; i>=0; i--) {
        let m = missiles[i];
        let target = drones[0]; 
        if(target) {
            let dir = new THREE.Vector3().subVectors(target.position, m.position).normalize();
            m.userData.vel.lerp(dir.multiplyScalar(35000), 0.15);
        }
        m.position.add(m.userData.vel.clone().multiplyScalar(dt));

        drones.forEach((d, di) => {
            if(m.position.distanceTo(d.position) < 2500) {
                createExplosion(d.position);
                scene.remove(d); drones.splice(di, 1);
                scene.remove(m); missiles.splice(i, 1);
                state.score += 10000;
            }
        });
    }

    // Particle Logic
    particles.forEach((p, i) => {
        p.position.add(p.userData.vel.clone().multiplyScalar(dt));
        p.userData.life -= dt;
        p.scale.multiplyScalar(0.95);
        if(p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
    });

    chunks.forEach(c => { if(c.position.z > player.position.z + 20000) c.position.z -= 200000; });
    
    document.getElementById('score-val').innerText = Math.floor(state.score += state.speed*dt*0.1);
    camera.position.lerp(player.position.clone().add(new THREE.Vector3(0, 2000, 8000)), 0.1);
    camera.lookAt(player.position.x, player.position.y, player.position.z - 5000);
    renderer.render(scene, camera);
}

function setupControls() {
    document.getElementById('fire-btn').addEventListener('touchstart', e => { e.preventDefault(); /* Laser Logic */ });
    document.getElementById('seeker-btn').addEventListener('touchstart', e => { e.preventDefault(); launchSeeker(); });
    document.addEventListener('touchstart', e => { if(e.touches[0].clientX < window.innerWidth/2) { joy.active=true; joy.sx=e.touches[0].clientX; joy.sy=e.touches[0].clientY; } });
    document.addEventListener('touchmove', e => { if(!joy.active) return; joy.x = (e.touches[0].clientX-joy.sx)/80; joy.y = (joy.sy-e.touches[0].clientY)/80; });
    document.addEventListener('touchend', () => { joy.active=false; joy.x=joy.y=0; });
}
</script>
</body>
</html>
