<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MEGACITY OS: ARTEMIS SYNC</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #0ff; }
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
        }
        .top-bar { display: flex; justify-content: space-between; padding: 20px; background: rgba(0,0,0,0.5); border-bottom: 1px solid #0ff; }
        .stat { color: #f0f; font-weight: bold; text-shadow: 0 0 5px #f0f; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
            transform: translate(-50%, -50%); border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%; transition: all 0.1s;
        }
        #crosshair.locked { border-color: #ff0000; width: 60px; height: 60px; box-shadow: 0 0 15px #ff0000; border-style: dashed; }
        
        #boss-ui {
            display: none; position: absolute; top: 15%; left: 50%; transform: translateX(-50%);
            width: 60%; flex-direction: column; align-items: center;
        }
        #boss-bar { width: 100%; height: 10px; border: 1px solid #f00; background: rgba(50,0,0,0.5); margin-top: 5px; }
        #boss-hp { width: 100%; height: 100%; background: #f00; transition: width 0.2s; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
        }
        button {
            padding: 15px 30px; background: transparent; color: #0ff; border: 2px solid #0ff;
            cursor: pointer; font-family: inherit; font-size: 20px; margin-top: 20px;
        }
        button:hover { background: #0ff; color: #000; }
        .hidden { display: none !important; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <div id="hud">
        <div class="top-bar">
            <div>HULL: <span id="hull-stat" class="stat">100</span>%</div>
            <div>MODE: <span id="fire-mode" class="stat" style="color:#0ff">DUAL BOLT</span></div>
            <div>KILLS: <span id="kill-stat" class="stat">0</span></div>
        </div>
        <div id="boss-ui">
            <div style="color:#f00; font-weight:bold; letter-spacing:3px;">⚠ CAPITAL SHIP DETECTED ⚠</div>
            <div id="boss-bar"><div id="boss-hp"></div></div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1 style="font-size: 50px; text-shadow: 0 0 20px #0ff;">ARTEMIS PROTOCOL: MEGACITY</h1>
        <p>[W,A,S,D] Pilot | [SPACE] Fire | [F] Toggle Fire Mode | [V] Camera</p>
        <button onclick="startGame()">INITIATE SYNC</button>
    </div>

    <div id="game-over" class="screen hidden">
        <h1 style="color:#f00">SIGNAL LOST</h1>
        <button onclick="location.reload()">REBOOT</button>
    </div>

    <div id="hidden-player" style="position:absolute; top:-9999px;"></div>

<script>
    let scene, camera, renderer, clock = new THREE.Clock();
    let playerShip, starField, boss;
    let enemies = [], lasers = [], particles = [], buildings = [];
    let isFirstPerson = false, fireMode = 0; // 0: Dual, 1: Spread
    let stats = { hull: 100, kills: 0, inBoss: false, bossHP: 3000 };
    let input = { x: 0, y: 0, velX: 0, velY: 0 };
    let ytPlayer, audioContext;

    /* --- Audio & YouTube Setup --- */
    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('hidden-player', {
            height: '0', width: '0', videoId: 'lEDxJfr4YJQ',
            playerVars: { 'autoplay': 0, 'controls': 0 }
        });
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        init3D();
        animate();
    }

    /* --- Asset Creation --- */
    function createFalcon() {
        const ship = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.7 });
        const hull = new THREE.Mesh(new THREE.CylinderGeometry(12, 12, 2, 32), mat);
        hull.scale.set(1, 0.3, 1.2);
        
        const cock = new THREE.Mesh(new THREE.SphereGeometry(3, 16, 16), new THREE.MeshBasicMaterial({color: 0x001111}));
        cock.position.set(10, 1, 6);
        
        const mandL = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 10), mat);
        mandL.position.set(-4, 0, 12);
        const mandR = mandL.clone();
        mandR.position.set(4, 0, 12);

        ship.add(hull, cock, mandL, mandR);
        return ship;
    }

    function createTie() {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const ball = new THREE.Mesh(new THREE.SphereGeometry(5, 8, 8), mat);
        const wingGeo = new THREE.CylinderGeometry(12, 12, 1, 6);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const wL = new THREE.Mesh(wingGeo, wingMat); wL.rotation.z = Math.PI/2; wL.position.x = -10;
        const wR = wL.clone(); wR.position.x = 10;
        group.add(ball, wL, wR);
        return group;
    }

    function init3D() {
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.00008);
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 50000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x4040ff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(500, 1000, 500);
        scene.add(sun);

        playerShip = createFalcon();
        playerShip.position.set(0, 500, 0);
        scene.add(playerShip);

        // Expansive City Initialization
        for(let i=0; i<200; i++) spawnBuilding( (Math.random()-0.5)*15000, -(Math.random()*30000) );

        // Stars
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<5000; i++) starPos.push((Math.random()-0.5)*30000, (Math.random()-0.5)*20000, (Math.random()-0.5)*30000);
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        starField = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 2}));
        scene.add(starField);

        window.addEventListener('keydown', handleInput);
        setInterval(spawnEnemy, 2000);
    }

    function spawnBuilding(x, z) {
        const h = 500 + Math.random() * 4000;
        const bGeo = new THREE.BoxGeometry(400, h, 400);
        const bMat = new THREE.MeshStandardMaterial({ color: 0x050508 });
        const b = new THREE.Mesh(bGeo, bMat);
        const edges = new THREE.LineSegments(new THREE.EdgesGeometry(bGeo), new THREE.LineBasicMaterial({color: 0x00ffff, transparent:true, opacity:0.3}));
        b.add(edges);
        b.position.set(x, h/2, z);
        scene.add(b);
        buildings.push(b);
    }

    function spawnEnemy() {
        if (stats.inBoss) return;
        const e = createTie();
        e.position.set((Math.random()-0.5)*10000, 400+Math.random()*1000, playerShip.position.z - 12000);
        scene.add(e);
        enemies.push(e);
    }

    function handleInput(e) {
        if(e.code === 'KeyW') input.y = 1; if(e.code === 'KeyS') input.y = -1;
        if(e.code === 'KeyA') input.x = -1; if(e.code === 'KeyD') input.x = 1;
        if(e.code === 'Space') fireWeapon();
        if(e.code === 'KeyF') toggleFireMode();
        if(e.code === 'KeyV') isFirstPerson = !isFirstPerson;
    }

    function toggleFireMode() {
        fireMode = (fireMode + 1) % 2;
        document.getElementById('fire-mode').innerText = fireMode === 0 ? "DUAL BOLT" : "SPREAD-V";
        playBeep(440, 50);
    }

    function fireWeapon() {
        const offsets = fireMode === 0 ? [-5, 5] : [-15, 0, 15];
        offsets.forEach(off => {
            const l = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 40, 8), new THREE.MeshBasicMaterial({color: 0x00ffff}));
            l.position.copy(playerShip.position);
            l.position.x += off;
            l.rotation.copy(playerShip.rotation);
            l.rotateX(Math.PI/2);
            if(fireMode === 1) l.rotation.y += off * 0.01;
            scene.add(l);
            lasers.push({ mesh: l, vel: new THREE.Vector3(0,0,2000).applyQuaternion(playerShip.quaternion), age: 0 });
        });
        playBeep(880, 30);
    }

    function playBeep(f, d) {
        if(!audioContext) return;
        let o = audioContext.createOscillator();
        let g = audioContext.createGain();
        o.frequency.value = f; g.gain.value = 0.1;
        o.connect(g); g.connect(audioContext.destination);
        o.start(); o.stop(audioContext.currentTime + d/1000);
    }

    function spawnBoss() {
        stats.inBoss = true;
        document.getElementById('boss-ui').style.display = 'flex';
        ytPlayer.playVideo();
        boss = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.BoxGeometry(1000, 300, 2500), new THREE.MeshStandardMaterial({color: 0x111111}));
        boss.add(hull);
        
        for(let i=0; i<4; i++) {
            const m = new THREE.Mesh(new THREE.SphereGeometry(60), new THREE.MeshStandardMaterial({color:0xff0000, emissive:0xff0000}));
            m.position.set((i%2?1:-1)*400, 150, (i<2?1:-1)*800);
            boss.add(m); bossMarkers.push(m);
        }
        boss.position.set(0, 1000, playerShip.position.z - 8000);
        scene.add(boss);
    }

    let bossMarkers = [];

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        // Pilot movement
        input.velX = THREE.MathUtils.lerp(input.velX, (window.inputX || 0) * 30, 0.1); 
        // Note: Using standard key listeners for demo
        let moveX = (input.x === -1 ? -40 : (input.x === 1 ? 40 : 0));
        let moveY = (input.y === -1 ? -40 : (input.y === 1 ? 40 : 0));
        
        playerShip.position.x += moveX * dt * 20;
        playerShip.position.y += moveY * dt * 20;
        playerShip.position.z += 1200 * dt;
        playerShip.rotation.z = THREE.MathUtils.lerp(playerShip.rotation.z, -moveX * 0.01, 0.1);

        // Expansive City recycling
        buildings.forEach(b => {
            if (b.position.z < playerShip.position.z - 5000) {
                b.position.z += 35000; // Move it way ahead
                b.position.x = (Math.random()-0.5) * 20000;
            }
        });

        // Camera
        if(isFirstPerson) {
            camera.position.copy(playerShip.position).add(new THREE.Vector3(10, 5, 8));
            camera.lookAt(playerShip.position.x, playerShip.position.y, playerShip.position.z + 1000);
        } else {
            camera.position.set(playerShip.position.x, playerShip.position.y + 400, playerShip.position.z - 1200);
            camera.lookAt(playerShip.position);
        }

        starField.position.z = playerShip.position.z;

        // AI Dogfight
        enemies.forEach((e, i) => {
            const toPlayer = playerShip.position.clone().sub(e.position).normalize();
            e.position.add(toPlayer.multiplyScalar(8));
            e.lookAt(playerShip.position);
            
            if(e.position.distanceTo(playerShip.position) < 150) {
                stats.hull -= 0.5;
                document.getElementById('hull-stat').innerText = Math.floor(stats.hull);
            }
        });

        // Lasers
        lasers.forEach((l, i) => {
            l.mesh.position.add(l.vel.clone().multiplyScalar(dt));
            l.age += dt;
            
            enemies.forEach((e, ei) => {
                if(l.mesh.position.distanceTo(e.position) < 100) {
                    scene.remove(e); enemies.splice(ei, 1);
                    stats.kills++;
                    document.getElementById('kill-stat').innerText = stats.kills;
                    if(stats.kills === 15) spawnBoss();
                }
            });

            if(stats.inBoss && boss) {
                bossMarkers.forEach((m, mi) => {
                    const worldPos = new THREE.Vector3(); m.getWorldPosition(worldPos);
                    if(l.mesh.position.distanceTo(worldPos) < 150) {
                        stats.bossHP -= 100;
                        document.getElementById('boss-hp').style.width = (stats.bossHP/3000*100) + "%";
                        if(stats.bossHP <= 0) {
                            scene.remove(boss); stats.inBoss = false;
                            document.getElementById('boss-ui').classList.add('hidden');
                        }
                    }
                });
            }
        });

        // UI Reset for keys
        input.x = 0; input.y = 0; 
        window.addEventListener('keydown', (e) => {
            if(e.code === 'KeyA') input.x = -1; if(e.code === 'KeyD') input.x = 1;
            if(e.code === 'KeyW') input.y = 1; if(e.code === 'KeyS') input.y = -1;
        });

        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onWindowResize);
</script>
</body>
</html>
