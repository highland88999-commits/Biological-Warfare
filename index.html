<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARTEMIS v10.1 | INFINITE REACH</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; touch-action:none; }
        #video-container { position: absolute; inset:0; pointer-events: none; z-index: 100; opacity: 0; transition: opacity 2s; }
        iframe { width: 100vw; height: 100vh; pointer-events: none; transform: scale(1.4); }
        .ui-screen { position: absolute; inset: 0; z-index: 110; color: #0ff; text-align: center; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .glitch-text { font-size: 3em; letter-spacing: 15px; animation: pulse 2s infinite; text-shadow: 0 0 20px #0ff; }
        button { padding: 20px 40px; background: rgba(0,255,255,0.1); border: 2px solid #0ff; color: #0ff; font-family: inherit; font-size: 1.2em; cursor: pointer; margin-top: 30px; box-shadow: 0 0 10px #0ff; }
        
        #hud { position:absolute; inset:0; pointer-events:none; z-index:20; display:none; color:#0ff; }
        .top-bar { display:flex; justify-content:space-between; padding:15px; background:rgba(0,0,0,0.8); border-bottom:2px solid #0ff; }
        
        #console { position: absolute; bottom: 20px; right: 20px; pointer-events: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .ctrl-btn { width: 80px; height: 80px; border: 2px solid #0ff; background: rgba(0,0,0,0.7); color: #0ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; text-align: center; transition: all 0.2s; }
        .ctrl-btn:active { background: #0ff; color: #000; }
        .cooldown-ui { position: absolute; bottom: 0; left: 0; height: 4px; background: #0ff; width: 0%; transition: width linear; }
        
        #fade-layer { position: absolute; inset: 0; background: #fff; z-index: 200; pointer-events: none; opacity: 0; }
        #lightning-flash { position: absolute; inset: 0; background: #fff; z-index: 150; pointer-events: none; opacity: 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="fade-layer"></div>
    <div id="lightning-flash"></div>
    
    <div id="screen-1" class="ui-screen"><h1 class="glitch-text">TITAN FALL</h1><button onclick="engagePreload()">RECEIVE TRANSMISSION</button></div>
    <div id="screen-2" class="ui-screen" style="display:none; background:transparent;">
        <div id="video-container"><div id="player"></div></div>
        <div style="z-index:120;"><h1 class="glitch-text" style="font-size: 2em;">ARTEMIS</h1><button onclick="launchGame()">ENTER COCKPIT</button></div>
    </div>

    <div id="hud">
        <div class="top-bar">
            <div>LVL: <span id="lvl-val">1</span> | KILLS: <span id="kill-val">0</span>/<span id="target-val">100</span></div>
            <div>SHIELD: <span id="shield-val">10</span></div>
        </div>
        <div id="console">
            <div id="hyper-btn" class="ctrl-btn">LIGHT SPEED</div>
            <div id="shield-btn" class="ctrl-btn">DEFLECTOR<div id="cd-shield" class="cooldown-ui"></div></div>
            <div id="seeker-btn" class="ctrl-btn">SEEKER<div id="cd-seeker" class="cooldown-ui"></div></div>
            <div id="lightning-btn" class="ctrl-btn">SURGE<div id="cd-surge" class="cooldown-ui"></div></div>
            <div id="fire-btn" class="ctrl-btn" style="grid-column: span 2; height: 50px; border-radius: 10px; background: rgba(0,255,255,0.2);">QUAD CANNON</div>
        </div>
    </div>

<script>
let ytPlayer, gameActive = false;
const palpatineId = 's0HU_j4fRkg';

function engagePreload() {
    document.getElementById('screen-1').style.display = 'none';
    document.getElementById('screen-2').style.display = 'flex';
    document.getElementById('video-container').style.opacity = '1';
    if (!ytPlayer) {
        ytPlayer = new YT.Player('player', {
            height: '100%', width: '100%', videoId: palpatineId,
            playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0 },
            events: { 'onReady': (e) => { e.target.unMute(); e.target.playVideo(); } }
        });
    }
}

function launchGame() {
    document.getElementById('fade-layer').style.opacity = 1;
    setTimeout(() => {
        document.getElementById('screen-2').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('fade-layer').style.opacity = 0;
        bootSystem();
        gameActive = true;
    }, 1000);
}

let scene, camera, renderer, clock, playerShip, falconEngine, lightTrail, deathStar, starField;
let drones = [], lasers = [], enemyLasers = [], missiles = [], cores = [];
let state = { 
    speed: 8000, level: 1, kills: 0, killTarget: 100, health: 10,
    isShielded: false, phase: 'SWARM', isHyper: false,
    cooldowns: { fire: 0, seeker: 0, shield: 0, lightning: 0 }
};
let joy = { active: false, x: 0, y: 0, sx: 0, sy: 0 };

function bootSystem() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 10000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    
    scene.add(new THREE.AmbientLight(0x404040));
    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(10000, 10000, 10000);
    scene.add(sun);

    // EXPANDED STAR FIELD
    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for(let i=0; i<15000; i++) {
        starCoords.push((Math.random()-0.5)*1000000, (Math.random()-0.5)*1000000, (Math.random()-0.5)*1000000);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    starField = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 500}));
    scene.add(starField);

    playerShip = createFalcon();
    scene.add(playerShip);

    deathStar = new THREE.Mesh(new THREE.SphereGeometry(250000, 64, 64), new THREE.MeshStandardMaterial({color: 0x444444}));
    deathStar.position.set(0, 100000, -1500000); // Massive and distant
    scene.add(deathStar);

    setupControls();
    clock = new THREE.Clock();
    animate();
    
    setInterval(() => { if(state.phase === 'SWARM') spawnTie(); }, 1000);
}

function createFalcon() {
    const falcon = new THREE.Group();
    const disk = new THREE.Mesh(new THREE.CylinderGeometry(2500, 2500, 600, 32), new THREE.MeshStandardMaterial({color: 0xcccccc}));
    disk.rotation.x = Math.PI/2;
    falcon.add(disk);

    falconEngine = new THREE.Mesh(new THREE.BoxGeometry(2000, 200, 100), new THREE.MeshBasicMaterial({color: 0x00ffff}));
    falconEngine.position.set(0, 0, 305);
    falcon.add(falconEngine);

    lightTrail = new THREE.Mesh(new THREE.BoxGeometry(2000, 200, 40000), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.4}));
    lightTrail.position.z = 20000;
    lightTrail.visible = false;
    falcon.add(lightTrail);

    return falcon;
}

function spawnTie() {
    const tie = new THREE.Group();
    const body = new THREE.Mesh(new THREE.SphereGeometry(500, 8, 8), new THREE.MeshBasicMaterial({color: 0x111111}));
    tie.add(body);
    tie.position.set((Math.random()-0.5)*150000, (Math.random()-0.5)*80000, playerShip.position.z - 150000);
    scene.add(tie);
    drones.push(tie);
    
    const shootInterval = setInterval(() => {
        if(!tie.parent) { clearInterval(shootInterval); return; }
        const l = new THREE.Mesh(new THREE.BoxGeometry(150, 150, 3000), new THREE.MeshBasicMaterial({color: 0x00ff00}));
        l.position.copy(tie.position);
        l.lookAt(playerShip.position);
        l.userData = { vel: new THREE.Vector3().subVectors(playerShip.position, tie.position).normalize().multiplyScalar(45000) };
        scene.add(l); enemyLasers.push(l);
    }, 2000);
}

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();

    playerShip.position.x += joy.x * 45000 * dt;
    playerShip.position.y += joy.y * 35000 * dt;
    playerShip.position.z -= state.speed * dt;

    // Fixed Bullet Speed (Independent of ship speed)
    lasers.forEach((l, i) => {
        l.position.z -= 180000 * dt;
        if(l.position.distanceTo(playerShip.position) > 200000) { scene.remove(l); lasers.splice(i, 1); }
        drones.forEach((d, di) => {
            if(l.position.distanceTo(d.position) < 3000) {
                createExplosion(d.position);
                scene.remove(d); drones.splice(di, 1);
                state.kills++;
                document.getElementById('kill-val').innerText = state.kills;
                if(state.kills >= state.killTarget) startBossPhase();
            }
        });
    });

    enemyLasers.forEach((l, i) => {
        l.position.add(l.userData.vel.clone().multiplyScalar(dt));
        if(l.position.distanceTo(playerShip.position) < 2500) {
            if(!state.isShielded) { state.health--; document.getElementById('shield-val').innerText = state.health; }
            scene.remove(l); enemyLasers.splice(i, 1);
        }
    });

    missiles.forEach((m, i) => {
        if(m.userData.target && m.userData.target.parent) {
            const dir = new THREE.Vector3().subVectors(m.userData.target.position, m.position).normalize();
            m.position.add(dir.multiplyScalar(70000 * dt));
            m.lookAt(m.userData.target.position);
            if(m.position.distanceTo(m.userData.target.position) < 3000) {
                createExplosion(m.position);
                scene.remove(m.userData.target); scene.remove(m); missiles.splice(i, 1);
                state.kills++;
            }
        } else { scene.remove(m); missiles.splice(i, 1); }
    });

    starField.position.z = playerShip.position.z; // Infinite field effect
    camera.position.lerp(playerShip.position.clone().add(new THREE.Vector3(0, 3500, 18000)), 0.1);
    camera.lookAt(playerShip.position);
    renderer.render(scene, camera);
}

function createExplosion(pos) {
    const exp = new THREE.Mesh(new THREE.SphereGeometry(1500, 12, 12), new THREE.MeshBasicMaterial({color: 0xff4400, transparent: true}));
    exp.position.copy(pos);
    scene.add(exp);
    let s = 1;
    const inter = setInterval(() => {
        s += 0.8; exp.scale.setScalar(s); exp.material.opacity -= 0.1;
        if(exp.material.opacity <= 0) { scene.remove(exp); clearInterval(inter); }
    }, 40);
}

function shoot() {
    if(Date.now() - state.cooldowns.fire < 500) return;
    state.cooldowns.fire = Date.now();
    const l = new THREE.Mesh(new THREE.BoxGeometry(250, 250, 6000), new THREE.MeshBasicMaterial({color: 0xff0000}));
    l.position.copy(playerShip.position);
    scene.add(l); lasers.push(l);
}

function shootMissile() {
    if(Date.now() - state.cooldowns.seeker < 2000) return;
    state.cooldowns.seeker = Date.now();
    startCD('cd-seeker', 2000);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(150, 150, 800), new THREE.MeshBasicMaterial({color: 0xff00ff}));
    m.position.copy(playerShip.position);
    m.userData = { target: drones[0] };
    scene.add(m); missiles.push(m);
}

function triggerShield() {
    if(Date.now() - state.cooldowns.shield < 15000) return;
    state.isShielded = true;
    state.cooldowns.shield = Date.now();
    startCD('cd-shield', 15000);
    const sMesh = new THREE.Mesh(new THREE.SphereGeometry(5000, 32, 32), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0.2, wireframe: true}));
    playerShip.add(sMesh);
    setTimeout(() => { state.isShielded = false; playerShip.remove(sMesh); }, 5000);
}

function triggerLightning() {
    if(Date.now() - state.cooldowns.lightning < 10000) return;
    state.cooldowns.lightning = Date.now();
    startCD('cd-surge', 10000);
    document.getElementById('lightning-flash').style.opacity = 1;
    setTimeout(() => document.getElementById('lightning-flash').style.opacity = 0, 100);
    drones.forEach(d => { if(d.position.distanceTo(playerShip.position) < 120000) createExplosion(d.position); scene.remove(d); });
    drones = [];
}

function startCD(id, time) {
    const el = document.getElementById(id);
    el.style.transition = 'none'; el.style.width = '100%';
    setTimeout(() => { el.style.transition = `width ${time}ms linear`; el.style.width = '0%'; }, 50);
}

function triggerHyper() {
    state.isHyper = true; state.speed = 500000;
    lightTrail.visible = true;
    document.getElementById('fade-layer').style.opacity = 0.4;
    setTimeout(() => { state.isHyper = false; state.speed = 8000; lightTrail.visible = false; document.getElementById('fade-layer').style.opacity = 0; }, 2000);
}

function setupControls() {
    document.getElementById('fire-btn').ontouchstart = (e) => { e.preventDefault(); shoot(); };
    document.getElementById('seeker-btn').ontouchstart = (e) => { e.preventDefault(); shootMissile(); };
    document.getElementById('shield-btn').ontouchstart = (e) => { e.preventDefault(); triggerShield(); };
    document.getElementById('lightning-btn').ontouchstart = (e) => { e.preventDefault(); triggerLightning(); };
    document.getElementById('hyper-btn').ontouchstart = (e) => { e.preventDefault(); triggerHyper(); };
    document.addEventListener('touchstart', e => { if(e.touches[0].clientX < window.innerWidth/2) { joy.active=true; joy.sx=e.touches[0].clientX; joy.sy=e.touches[0].clientY; } });
    document.addEventListener('touchmove', e => { if(joy.active) { joy.x = (e.touches[0].clientX-joy.sx)/50; joy.y = (joy.sy-e.touches[0].clientY)/50; } });
    document.addEventListener('touchend', () => { joy.active=false; joy.x=joy.y=0; });
}

function startBossPhase() {
    state.phase = 'BOSS';
    deathStar.position.z = playerShip.position.z - 150000; // Engage
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
