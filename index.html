<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN FALL: ARTEMIS | MASTER</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; touch-action: none; color: #0ff; }
        
        /* Landing Page Styles */
        #video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        #player-frame { width: 100vw; height: 100vh; pointer-events: none; transform: scale(1.3); }
        #overlay { position: absolute; inset: 0; background: radial-gradient(circle, rgba(0,255,255,0.05) 0%, rgba(0,0,0,0.8) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: #0ff; text-align: center; transition: opacity 2s ease; }
        .glitch-text { font-size: 3em; letter-spacing: 15px; text-transform: uppercase; animation: pulse 2s infinite; text-shadow: 0 0 20px #0ff; }
        .prompt { margin-top: 20px; font-size: 1.2em; opacity: 0.7; letter-spacing: 2px; }
        #fade-layer { position: absolute; inset: 0; background: #000; z-index: 100; pointer-events: none; opacity: 0; transition: opacity 1.5s ease; }

        /* HUD & Game UI */
        #hud { position: absolute; inset: 0; pointer-events: none; z-index: 20; display: none; }
        .top-bar { display: flex; justify-content: space-between; padding: 15px; background: rgba(0,0,0,0.8); border-bottom: 2px solid #0ff; font-size: 1.1em; }
        .btn-container { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: space-around; pointer-events: none; }
        .ctrl-btn { width: 110px; height: 110px; border-radius: 50%; pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; font-size: 12px; border: 5px solid; text-align: center; box-shadow: 0 0 20px currentColor; -webkit-user-select: none; }
        #seeker-btn { color: #f00; border-color: #f00; background: rgba(255,0,0,0.1); }
        #shield-btn { color: #fff; border-color: #fff; background: rgba(255,255,255,0.1); }
        #fire-btn { color: #0ff; border-color: #0ff; background: rgba(0,255,255,0.1); }
        #joystick-base { position: absolute; bottom: 180px; left: 50%; transform: translateX(-50%); width: 90px; height: 90px; background: rgba(255,255,255,0.1); border-radius: 50%; display: none; pointer-events: auto; z-index: 30; border: 1px solid rgba(255,255,255,0.3); }
        #joystick-knob { position: absolute; top: 25px; left: 25px; width: 40px; height: 40px; background: #fff; border-radius: 50%; opacity: 0.6; }

        @keyframes pulse { 0% { opacity: 0.4; transform: scale(0.98); } 50% { opacity: 1; transform: scale(1); } 100% { opacity: 0.4; transform: scale(0.98); } }
    </style>
</head>
<body onclick="handleGlobalClick()">

    <div id="fade-layer"></div>

    <div id="video-container">
        <div id="player-frame"></div>
    </div>

    <div id="overlay">
        <h1 class="glitch-text">TITAN FALL<br>ARTEMIS</h1>
        <div class="prompt">TAP TO ENGAGE PROTOCOL</div>
    </div>

    <div id="hud">
        <div class="top-bar">
            <div>SHIELD: <span id="shd">100</span>% | SECTOR: <span id="lvl">1</span></div>
            <div>COMBO: <span id="combo">0</span> | SCORE: <span id="score">0</span></div>
        </div>
        <div id="joystick-base"><div id="joystick-knob"></div></div>
        <div class="btn-container">
            <div id="seeker-btn" class="ctrl-btn" onclick="fireSeeker()">SEEKER<br><small id="seeker-status">Ready...</small></div>
            <div id="shield-btn" class="ctrl-btn" onclick="activateShield()">SHIELD<br><small id="shd-status">Ready</small></div>
            <div id="fire-btn" class="ctrl-btn" onclick="shoot()">FIRE</div>
        </div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

<script>
let scene, camera, renderer, clock, falcon, ytPlayer, gridFloor, shieldMesh;
let lasers = [], drones = [], missiles = [], enemyLasers = [];
let state = { level: 1, score: 0, combo: 0, health: 100, active: false, seekerReady: true, shdActive: false, shdReady: true, landed: false };
let joyPos = { x: 0, y: 0 };
const vids = { intro: 's0HU_j4fRkg', speech: 'hS57I6swXcc' };

function onYouTubeIframeAPIReady() {
    ytPlayer = new YT.Player('player-frame', {
        videoId: vids.intro,
        playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0 },
        events: { 'onReady': (e) => e.target.mute(), 'onStateChange': onPlayerStateChange }
    });
}

function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.ENDED && !state.active) {
        ytPlayer.loadVideoById({ videoId: vids.speech, startSeconds: 65 });
    }
}

function handleGlobalClick() {
    if (!state.landed) {
        state.landed = true;
        document.getElementById('overlay').style.opacity = 0;
        document.getElementById('fade-layer').style.opacity = 1;
        setTimeout(() => {
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('joystick-base').style.display = 'block';
            document.getElementById('fade-layer').style.opacity = 0;
            initGame();
        }, 1500);
    }
}

function initGame() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 1000000);
    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    gridFloor = new THREE.GridHelper(1000000, 200, 0x00ffff, 0x001111);
    gridFloor.position.y = -5000;
    scene.add(gridFloor);

    // Falcon Player
    falcon = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(600, 600, 150, 32), new THREE.MeshStandardMaterial({color:0x888888}));
    body.rotation.x = Math.PI/2;
    falcon.add(body);
    
    // Physical Shield Visual
    shieldMesh = new THREE.Mesh(new THREE.SphereGeometry(1200, 32, 32), new THREE.MeshBasicMaterial({color: 0x00ffff, transparent: true, opacity: 0}));
    falcon.add(shieldMesh);
    scene.add(falcon);

    scene.add(new THREE.HemisphereLight(0x00ffff, 0x000000, 1.5));
    setupJoystick();
    spawnEnemies();
    state.active = true;
    clock = new THREE.Clock();
    animate();
}

function activateShield() {
    if (!state.shdReady) return;
    state.shdActive = true; state.shdReady = false;
    shieldMesh.material.opacity = 0.3;
    document.getElementById('shd-status').innerText = "ACTIVE";
    setTimeout(() => {
        state.shdActive = false;
        shieldMesh.material.opacity = 0;
        document.getElementById('shd-status').innerText = "COOLDOWN";
        setTimeout(() => { state.shdReady = true; document.getElementById('shd-status').innerText = "Ready"; }, 10000);
    }, 5000);
}

function shoot() {
    const l = new THREE.Mesh(new THREE.BoxGeometry(50, 50, 3000), new THREE.MeshBasicMaterial({color:0x00ffff}));
    l.position.copy(falcon.position).z -= 1000;
    scene.add(l); lasers.push(l);
}

function enemyShoot(pos) {
    const l = new THREE.Mesh(new THREE.BoxGeometry(40, 40, 2000), new THREE.MeshBasicMaterial({color:0x00ff00}));
    l.position.copy(pos);
    scene.add(l); enemyLasers.push(l);
}

function fireSeeker() {
    if(!state.seekerReady || drones.length === 0) return;
    state.seekerReady = false;
    const m = new THREE.Mesh(new THREE.SphereGeometry(400), new THREE.MeshBasicMaterial({color:0xff0000}));
    m.position.copy(falcon.position);
    scene.add(m); missiles.push({mesh: m, target: drones[0]});
    setTimeout(() => { state.seekerReady = true; }, 5000);
}

function spawnEnemies() {
    for(let i=0; i<15; i++) {
        const tie = new THREE.Mesh(new THREE.BoxGeometry(2000, 2000, 2000), new THREE.MeshPhongMaterial({color:0x222222}));
        tie.position.set((Math.random()-0.5)*100000, (Math.random()-0.5)*40000, -100000 - Math.random()*200000);
        scene.add(tie); drones.push(tie);
    }
}

function animate() {
    requestAnimationFrame(animate);
    if(!state.active) return;
    const dt = clock.getDelta();

    falcon.position.x += joyPos.x * 60000 * dt;
    falcon.position.y += joyPos.y * 50000 * dt;
    falcon.position.z -= 9000 * dt;
    gridFloor.position.z = falcon.position.z;

    camera.position.lerp(falcon.position.clone().add(new THREE.Vector3(0, 2000, 6000)), 0.1);
    camera.lookAt(falcon.position.x, falcon.position.y, falcon.position.z - 10000);

    lasers.forEach((l, i) => {
        l.position.z -= 100000 * dt;
        drones.forEach(d => {
            if(l.position.distanceTo(d.position) < 6000) {
                state.score += 100; d.position.z -= 200000;
                document.getElementById('score').innerText = state.score;
            }
        });
    });

    enemyLasers.forEach((l, i) => {
        l.position.z += 50000 * dt;
        if(l.position.distanceTo(falcon.position) < 2000) {
            if(!state.shdActive) state.health -= 10;
            scene.remove(l); enemyLasers.splice(i,1);
            document.getElementById('shd').innerText = state.health;
        }
    });

    drones.forEach(d => {
        if(Math.random() < 0.01) enemyShoot(d.position);
        if(d.position.z > falcon.position.z) d.position.z -= 300000;
    });

    missiles.forEach((m, i) => {
        m.mesh.position.lerp(m.target.position, 0.1);
        if(m.mesh.position.distanceTo(m.target.position) < 3000) {
            m.target.position.z -= 200000; scene.remove(m.mesh); missiles.splice(i, 1);
        }
    });

    renderer.render(scene, camera);
}

function setupJoystick() {
    const base = document.getElementById('joystick-base');
    const knob = document.getElementById('joystick-knob');
    base.addEventListener('touchmove', (e) => {
        const t = e.touches[0]; const r = base.getBoundingClientRect();
        let dx = t.clientX - (r.left + r.width/2), dy = t.clientY - (r.top + r.height/2);
        const d = Math.min(30, Math.sqrt(dx*dx + dy*dy)), a = Math.atan2(dy, dx);
        joyPos.x = (Math.cos(a)*d)/30; joyPos.y = -(Math.sin(a)*d)/30;
        knob.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
    });
}
</script>
</body>
</html>
